/* ---- PDF statement import ---- */
function fixHeb(s){
  const heb = /[֐-׿]/, out = [], run = [];
  const flush = () => { if(run.length){ out.push(...run.map(t => [...t].reverse().join('')).reverse()); run.length = 0; } };
  s.split(/\s+/).forEach(t => { if(heb.test(t)) run.push(t); else { flush(); out.push(t); } });
  flush(); return out.join(' ');
}
const CAT_RULES = [
  ['Transport', /אנרגיה|דלק|סונול|רכב|תחבורה|חניו|חניה|פנגו|GETT|נסיע/i],
  ['Groceries', /מזון|סופר|מרקט|חקלאית|שוק/],
  ['Food', /מסעד|קפה|בורגר|פיצה/],
  ['Health', /כושר|פארם|בריאות|מרפא|רפוא/],
  ['Shopping', /טיפוח|יופי|אופנה|מספרה|ביגוד|מוצרי/],
  ['Bills', /מוסדות|תקשורת|ביטוח|עיריי|מחשבים|חשמל|מים/],
  ['Fun', /תיירות|פנאי|בילוי|מלון|קולנוע/],
];
const IMP_NOISE = /^(מזהה|כרטיס|Apple|Pay|הוראת|קבע|לא|ב-|-ב|ארצות|הברית\.?|מ|-|\$|₪|\d{1,4}|\d+\/\d+)$/;
async function parseStatement(file){
  const pdf = await pdfjsLib.getDocument({data: await file.arrayBuffer()}).promise;
  let all = '', txs = [];
  const pages = [];
  for(let p = 1; p <= pdf.numPages; p++){
    const tc = await (await pdf.getPage(p)).getTextContent();
    // pdf.js may split text into per-character items: rebuild lines by y-cluster, then join by x with gap detection
    const its = tc.items.filter(i => i.str.trim() && i.transform[4] >= 140);
    its.sort((a,b) => b.transform[5] - a.transform[5] || a.transform[4] - b.transform[4]);
    const clusters = []; let cur = null, curY = null;
    its.forEach(it => {
      if(curY === null || Math.abs(it.transform[5] - curY) > 2.5){ cur = []; clusters.push(cur); curY = it.transform[5]; }
      cur.push(it);
    });
    const lines = clusters.map(items => {
      items.sort((a,b) => a.transform[4] - b.transform[4]);
      let s = '', prevEnd = null;
      items.forEach(it => {
        const x = it.transform[4];
        if(prevEnd !== null && x - prevEnd > 2) s += ' ';
        s += it.str; prevEnd = x + (it.width || 0);
      });
      return s;
    });
    pages.push(lines); all += lines.join('\n');
  }
  // detect whether Hebrew came out visually reversed (e.g. "ןוזמ" instead of "מזון")
  const reversed = ((all.match(/ןוזמ|תודעסמ|ההזמ|סיטרכ|ךיראת/g)||[]).length) >= ((all.match(/מזון|מסעדות|מזהה|כרטיס|תאריך/g)||[]).length);
  pages.flat().forEach(raw => {
    const line = reversed ? fixHeb(raw) : raw;
    const dm = line.match(/(\d{2})\/(\d{2})\/(\d{4})/);
    const ams = [...raw.matchAll(/₪\s*([\d,]+\.\d{2})/g)];
    if(!dm || !ams.length) return;
    const [, dd, mm, yyyy] = dm;
    if(+mm < 1 || +mm > 12 || +yyyy < 2020 || +yyyy > 2035) return;
    const desc = line.replace(/₪\s*[\d,]+\.\d{2}/g, '').replace(/\$\s*[\d,]+\.\d{2}/g, '')
      .replace(/\d{2}\/\d{2}\/\d{2,4}/g, '').split(/\s+/).filter(t => t && !IMP_NOISE.test(t)).join(' ').slice(0, 60).trim();
    txs.push({spent_at: `${yyyy}-${mm}-${dd}`, amount: +ams[0][1].replace(/,/g, ''),
      category: (CAT_RULES.find(([, re]) => re.test(line)) || ['Other'])[0], description: desc || 'Imported charge'});
  });
  return txs;
}
async function handleStatement(files){
  if(!files || !files.length) return;
  const pv = document.getElementById('importPreview');
  pv.innerHTML = '<div class="empty">Reading PDF…</div>';
  try{
    let txs = [];
    for(const f of files) txs = txs.concat(await parseStatement(f));
    if(!txs.length){ pv.innerHTML = '<div class="empty">No charges recognized in this PDF</div>'; return; }
    txs.sort((a,b) => a.spent_at.localeCompare(b.spent_at));
    const {data: existing, error} = await sb.from('expenses').select('spent_at,amount')
      .gte('spent_at', txs[0].spent_at).lte('spent_at', txs[txs.length-1].spent_at);
    if(error) return err(error);
    const have = {};
    (existing||[]).forEach(e => { const k = e.spent_at + '|' + (+e.amount).toFixed(2); have[k] = (have[k]||0) + 1; });
    txs.forEach(t => { const k = t.spent_at + '|' + t.amount.toFixed(2); if(have[k] > 0){ have[k]--; t.dup = true; } });
    // imported charges get the same merchant key as taps, so learned rules apply to them too
    const {data: rules} = await sb.from('merchant_rules').select('merchant_key,category,description');

function drawBurnChart(rows, budget, month){
  const [Y, M] = month.split('-').map(Number);
  const dim = new Date(Y, M, 0).getDate();
  const daily = Array(dim).fill(0);
  rows.forEach(r => { daily[+r.spent_at.slice(8,10) - 1] += +r.amount; });
  let run = 0; const cum = daily.map(v => run += v);
  const isCur = todayStr().slice(0,7) === month;
  const lastDay = isCur ? +todayStr().slice(8,10) : dim;
  const datasets = [{label: 'Spent so far', data: cum.map((v,i) => i < lastDay ? v : null),
    borderColor: '#23221f', backgroundColor: 'rgba(35,34,31,.09)', fill: true, tension: .25, pointRadius: 0, borderWidth: 2}];
  if(isCur && lastDay >= 2 && lastDay < dim){
    const rate = cum[lastDay-1] / lastDay;
    datasets.push({label: 'Projected at current pace', data: Array.from({length: dim}, (_,i) => i < lastDay-1 ? null : +(cum[lastDay-1] + rate*(i-lastDay+1)).toFixed(0)),
      borderColor: '#9b463a', borderDash: [3,4], pointRadius: 0, borderWidth: 1.5, fill: false});
    window._projSpend = cum[lastDay-1] + rate*(dim-lastDay);
  } else window._projSpend = null;
  if(budget > 0) datasets.push({label: 'Ideal pace to budget', data: Array.from({length: dim}, (_,i) => +(budget*(i+1)/dim).toFixed(0)),
    borderColor: '#8a6b22', borderDash: [5,4], pointRadius: 0, borderWidth: 1.5, fill: false});
  mkChart('burnChart', {type: 'line', data: {labels: Array.from({length: dim}, (_,i) => i+1), datasets},
    options: {maintainAspectRatio: false, interaction: {mode: 'index', intersect: false},
      plugins: {legend: {labels: {boxWidth: 18}}}, scales: {y: {beginAtZero: true}}}});
}
async function addExpense(){
  const amount = +exAmount.value; if(!amount) return toast('Enter an amount (negative for a refund)');
  if(!exDate.value) return toast('Pick a date');
  const row = {amount, category: exCat.value, description: exDesc.value.trim() || null, spent_at: exDate.value};
  const ed = window._editEx;
  if(!ed && row.description){ row.merchant = row.description; row.merchant_key = merchantKey(row.description) || null; }
  // snapshot before the write: the learning check asks "what did he change?", so it must
  // compare against the pre-update values, not a row the update may already have touched
  const was = ed ? {category: ed.category, description: ed.description, merchant_key: ed.merchant_key} : null;
  const {error} = ed
    ? await sb.from('expenses').update(row).eq('id', ed.id)
    : await sb.from('expenses').insert(row);
  if(error) return err(error);
  let learned = '';
  if(was && was.merchant_key) learned = await learnMerchant(was.merchant_key, row.category, row.description, was);
  if(ed){ window._editEx = null; toast('Expense updated' + learned); } else toast('Expense added');
  views.money();
}
/* An Apple Pay tap arrives with a raw terminal string ("SHUFERSAL DEAL 1234") and no
   category. The first time Benji fixes one, remember the choice against the normalised
   merchant key so every later tap at that shop lands already named and categorised.
   Same normalisation as the apple-pay Edge Function — keep the two in step. */
function merchantKey(raw){
  return (raw || '').normalize('NFKC').replace(/[^\p{L} ]+/gu, ' ')
    .replace(/\s+/g, ' ').trim().toUpperCase().slice(0, 80);
}
async function learnMerchant(key, category, description, before){
  if(!key) return '';
  const changed = category !== before.category || (description || '') !== (before.description || '');
  if(!changed) return '';
  const {error} = await sb.from('merchant_rules')
    .upsert({merchant_key: key, category, description: description || null, updated_at: new Date().toISOString()},
            {onConflict: 'user_id,merchant_key'});
  if(error){ console.warn('rule not saved', error); return ''; }
  // apply it to any other taps from the same shop that are still sitting uncategorised
  await sb.from('expenses')
    .update({category, description: description || null})
    .eq('merchant_key', key).eq('source', 'applepay').eq('category', 'Other');
  return ' — future ' + (description || key) + ' taps will file as ' + category;
}
/* Merchant rules are learned, so they need a way to be unlearned. */
async function forgetMerchant(key){
  if(!confirm('Forget the rule for this merchant? Future taps there will come in as Other again.')) return;
  const {error} = await sb.from('merchant_rules').delete().eq('merchant_key', key);
  error ? err(error) : (toast('Rule forgotten'), window._moneyKeep = true, views.money());
}

      <div class="card"><h3>Checks cashed</h3>
        <div class="stat">${claimed.length} <small>of ${ms.length}</small></div>
        <div class="progress-track" style="margin-top:10px"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div style="font-size:12.5px;color:var(--muted);margin-top:6px">${NIS(claimed.reduce((s,m)=>s+Number(m.amount),0))} collected</div></div>
      <div class="card"><h3>Not yet cashed</h3>
        <div class="stat" style="${owing.some(m => m.month < cur) ? 'color:var(--red)' : ''}">${NIS(owed)}</div>
        <div style="font-size:12.5px;color:var(--muted);margin-top:6px">${owing.length
          ? (owing.some(m => m.month < cur)
              ? `${owing.filter(m => m.month < cur).length} overdue · oldest ${monthLabel(owing[0].month)}`
              : 'only this month\'s check is still open')
          : 'All due checks are cashed'}</div></div>
      <div class="card"><h3>Lease</h3>
        <div class="stat" style="font-size:19px">${span}</div>
        <div style="font-size:12.5px;color:var(--muted);margin-top:6px">${left} month${left === 1 ? '' : 's'} left${
          L.landlord ? ' · ' + esc(L.landlord) : ''}${L.address ? ' · ' + esc(L.address) : ''}</div></div>
    </div>
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px">
        <h3 style="margin:0">Monthly checks</h3>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn-ghost" onclick="extendLease()">Add 12 months</button>
          <button class="btn-ghost" onclick="deleteLease()">Delete lease</button>
        </div>
      </div>
      ${nextOpen ? `<div style="font-size:12.5px;color:var(--muted);margin-bottom:10px">Next up: ${monthLabel(nextOpen.month)} · ${NIS(nextOpen.amount)}</div>` : ''}
      <div class="list" id="rentList">${ms.length ? ms.map(rentRow).join('') : '<div class="empty">No months yet</div>'}</div>
    </div>`;
}
function rentPill(m){
  const cur = monthKey(todayStr());
  if(m.claimed) return `<span class="pill green">Cashed${m.claimed_on ? ' ' + fmtDate(m.claimed_on) : ''}</span>`;
  if(m.month < cur) return `<span class="pill red">Not cashed</span>`;
  if(m.month === cur) return `<span class="pill amber">This month</span>`;
  return `<span class="pill grey">Upcoming</span>`;
}
function rentRow(m){
  if(window._editRM === m.id) return `
    <div class="row" style="flex-wrap:wrap;align-items:flex-end">
      <div style="flex:1 1 100%;font-weight:600;font-size:14px">${monthLabel(m.month)}</div>
      <div style="flex:1 1 110px"><label class="lbl" for="rmAmt">Amount ₪</label><input type="number" step="0.01" inputmode="decimal" id="rmAmt" value="${m.amount}"></div>
      <div style="flex:1 1 110px"><label class="lbl" for="rmChk">Check no.</label><input id="rmChk" value="${esc(m.check_no || '')}"></div>
      <div style="flex:1 1 140px"><label class="lbl" for="rmDate">Cashed on</label><input type="date" id="rmDate" value="${m.claimed_on || ''}"></div>
      <div style="display:flex;gap:8px">
        <button class="btn" onclick="saveRentMonth('${m.id}')">Save</button>
        <button class="btn-ghost" onclick="window._editRM=null;renderLease()">Cancel</button>
      </div>
      <div style="flex:1 1 100%;font-size:12px;color:var(--muted)">Clear the date to un-mark the check as cashed.</div>
    </div>`;
  return `
    <div class="row">
      <button class="checkbox ${m.claimed ? 'checked' : ''}" title="${m.claimed ? 'Mark as not cashed' : 'Mark as cashed'}" onclick="toggleClaim('${m.id}')">${
        m.claimed ? ICO.tickSm : ''}</button>
      <div class="grow"><div class="title">${monthLabel(m.month)}</div>
        <div class="sub">${NIS(m.amount)}${m.check_no ? ' · check ' + esc(m.check_no) : ''}</div></div>
      ${rentPill(m)}
      <button class="icon-btn" title="Edit month" onclick="window._editRM='${m.id}';renderLease()">${ICO.edit}</button>
    </div>`;
}
async function addLease(){
  const start = lsStart.value; if(!start) return toast('Pick the first month');
  const n = Math.max(1, Math.min(60, +lsMonths.value || 12));
  const rent = +lsRent.value || 0;
  const {data, error} = await sb.from('rent_leases').insert({
    landlord: lsLandlord.value.trim() || null,
    address: lsAddress.value.trim() || null,
    start_month: start + '-01', months: n, monthly_rent: rent,
  }).select().single();
  if(error) return err(error);
  const rows = Array.from({length: n}, (_, i) => ({lease_id: data.id, month: addMonths(start + '-01', i), amount: rent}));
  const {error: e2} = await sb.from('rent_months').insert(rows);
  if(e2) return err(e2);
  toast('Lease created — ' + n + ' months');
  views.rent();
}
async function toggleClaim(id){
  // optimistic: flip locally and repaint just the lease block, so the meter charts aren't rebuilt
  const m = (window._rentMonths || []).find(x => x.id === id); if(!m) return;
  const prev = {claimed: m.claimed, claimed_on: m.claimed_on};
  m.claimed = !m.claimed;
  m.claimed_on = m.claimed ? todayStr() : null;
  renderLease();
  const {error} = await sb.from('rent_months').update({claimed: m.claimed, claimed_on: m.claimed_on}).eq('id', id);
  if(error){ Object.assign(m, prev); renderLease(); return err(error); }
  toast(monthLabel(m.month) + (m.claimed ? ' marked cashed' : ' un-marked'));
}
async function saveRentMonth(id){
  const m = (window._rentMonths || []).find(x => x.id === id); if(!m) return;
  const patch = {
    amount: +rmAmt.value || 0,
    check_no: rmChk.value.trim() || null,
    claimed_on: rmDate.value || null,
    claimed: !!rmDate.value,                    // the cashed date is the source of truth
  };
  const {error} = await sb.from('rent_months').update(patch).eq('id', id);
  if(error) return err(error);
  Object.assign(m, patch);
  window._editRM = null;
  renderLease();
  toast(monthLabel(m.month) + ' updated');
}
async function extendLease(){
  const L = window._lease, ms = window._rentMonths;
  if(!L || !ms.length) return;
  const last = ms[ms.length - 1];
  const amount = Number(last.amount) || Number(L.monthly_rent) || 0;
  const rows = Array.from({length: 12}, (_, i) => ({lease_id: L.id, month: addMonths(last.month, i + 1), amount}));
  const {error} = await sb.from('rent_months').insert(rows);
  if(error) return err(error);
  await sb.from('rent_leases').update({months: ms.length + 12}).eq('id', L.id);
  toast('Added 12 months at ' + NIS(amount));
  views.rent();
}
async function deleteLease(){
  const L = window._lease; if(!L) return;
  if(!confirm('Delete this lease and every month tracked under it? This cannot be undone. Meter readings are kept.')) return;
  const {error} = await sb.from('rent_leases').delete().eq('id', L.id);
  error ? err(error) : views.rent();
}

/* ---- utility meters ---- */
function meterSeries(kind){
  const rows = (window._meters || []).filter(r => r.kind === kind);   // already sorted by read_on
  return rows.map((r, i) => {
    const p = rows[i - 1];
    const used = p ? Number(r.reading) - Number(p.reading) : null;
    const days = p ? Math.max(1, Math.round((new Date(r.read_on + 'T00:00') - new Date(p.read_on + 'T00:00')) / 864e5)) : null;
    return Object.assign({}, r, {used, days, perDay: used == null ? null : used / days});
  });
}
function renderMeters(){
  const el = document.getElementById('meterBlock'); if(!el) return;
  el.innerHTML = `<div class="grid cols2">${Object.keys(METERS).map(meterCard).join('')}</div>`;
  drawMeterCharts();
}
function meterCard(kind){
  const M = METERS[kind], s = meterSeries(kind), latest = s[s.length - 1];
  const recent = s.slice(-6).reverse();
  const head = latest
    ? `<div class="stat">${fmtNum(latest.reading)} <small>${M.unit}</small></div>
       <div style="font-size:12.5px;color:var(--muted);margin-top:5px">read ${fmtDate(latest.read_on)}${
         latest.used == null ? ' · first reading'
         : latest.used < 0 ? ' · <span style="color:var(--red)">lower than the previous reading</span>'
         : ` · <span style="color:var(--text);font-weight:600">+${fmtNum(latest.used)} ${M.unit}</span> over ${latest.days}d (${fmtNum(latest.perDay)}/day)`}</div>`
    : `<div class="empty" style="padding:14px">No readings yet</div>`;
  return `<div class="card">
    <h3>${M.label} meter</h3>
    ${head}
    <form onsubmit="submitGuard(event, () => addReading('${kind}'))" style="margin-top:14px">
      <div class="form-grid">
        <div><label class="lbl" for="rd_${kind}_date">Date</label><input type="date" id="rd_${kind}_date" value="${todayStr()}"></div>
        <div><label class="lbl" for="rd_${kind}_val">Reading (${M.unit})</label><input type="number" step="0.01" inputmode="decimal" enterkeyhint="done" id="rd_${kind}_val" placeholder="meter count"></div>
      </div>
      <button class="btn" type="submit">Log reading</button>
    </form>
    ${s.filter(r => r.used > 0).length >= 2 ? `<div class="chart-box" style="height:170px;margin-top:16px"><canvas id="${M.chart}"></canvas></div>` : ''}
    <div class="list" style="margin-top:14px">${recent.length ? recent.map(r => `
      <div class="row"><div class="grow"><div class="title">${fmtNum(r.reading)} ${M.unit}</div>
        <div class="sub">${fmtDate(r.read_on)}${r.used == null ? '' : r.used < 0 ? ' · reading dropped' : ` · +${fmtNum(r.used)} in ${r.days}d`}</div></div>
        <button class="icon-btn danger" title="Delete reading" onclick="delReading('${r.id}')">${ICO.x}</button></div>`).join('')
      : '<div class="empty">Log the meter count to start tracking usage</div>'}</div>
  </div>`;
}
async function addReading(kind){
  const dateEl = document.getElementById('rd_' + kind + '_date'), valEl = document.getElementById('rd_' + kind + '_val');
  if(!dateEl || !valEl) return;
  if(!dateEl.value) return toast('Pick the reading date');
  if(valEl.value === '' || isNaN(+valEl.value)) return toast('Enter the meter count');
  const {error} = await sb.from('meter_readings').insert({kind, read_on: dateEl.value, reading: +valEl.value});
  if(error) return err(error);
  toast(METERS[kind].label + ' reading saved');
  views.rent();
}
async function delReading(id){
  if(!confirm('Delete this meter reading? This cannot be undone.')) return;
  const {error} = await sb.from('meter_readings').delete().eq('id', id);
  error ? err(error) : views.rent();
}
function drawMeterCharts(){
  Object.keys(METERS).forEach(kind => {
    const M = METERS[kind];
    const s = meterSeries(kind).filter(r => r.used > 0);   // negative deltas mean a swapped/rolled meter — skip
    if(s.length < 2) return;
    mkChart(M.chart, {
      type: 'bar',
      data: {labels: s.map(r => fmtDate(r.read_on)), datasets: [{label: M.unit, data: s.map(r => r.used), backgroundColor: '#4a4741', borderRadius: 5}]},
      options: {maintainAspectRatio: false, plugins: {legend: {display: false}, tooltip: {callbacks: {
        label: c => `${fmtNum(c.parsed.y)} ${M.unit} over ${s[c.dataIndex].days}d · ${fmtNum(s[c.dataIndex].perDay)}/day`}}},
        scales: {y: {beginAtZero: true}}}
    });
  });
}
</script>
</body>
