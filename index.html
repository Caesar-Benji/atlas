<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  /* e-book / paper theme: near-white page, ink-black type, grey hairlines */
  --bg:#f3f2ef; --surface:#fbfaf8; --surface2:#eceae6; --border:#dcd9d3;
  --text:#1a1a18; --muted:#78756e; --accent:#23221f; --accent2:#4a4741;
  --grad:linear-gradient(135deg,#2b2a27,#45423c);
  --on-ink:#faf9f7;
  --red:#9b463a; --amber:#8a6b22; --green:#4a6a44;
  --radius:12px; --shadow:0 1px 2px rgba(26,26,24,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Space Grotesk',system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px 12px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
::placeholder{color:#a5a29b}
h2{font-size:22px;font-weight:700;letter-spacing:-.02em}
.hidden{display:none!important}

/* ---------- Auth ---------- */
#authScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;z-index:1}
.auth-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:36px 32px;box-shadow:var(--shadow);text-align:center}
.auth-card .logo{margin:0 auto 14px}
.auth-card h1{font-size:26px;font-weight:700;letter-spacing:-.03em}
.auth-card .tag{color:var(--muted);font-size:13px;margin:6px 0 24px}
.auth-card form{display:flex;flex-direction:column;gap:12px;text-align:left}
.btn{background:var(--grad);color:var(--on-ink);border:none;border-radius:10px;padding:11px 18px;font-weight:600;font-size:14px;transition:opacity .15s,transform .1s}
.btn:hover{opacity:.9}.btn:active{transform:scale(.98)}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:500}
.btn-ghost:hover{color:var(--text);border-color:var(--accent)}
.auth-switch{margin-top:18px;font-size:13px;color:var(--muted)}
.auth-switch a{color:var(--accent2);cursor:pointer;text-decoration:none;font-weight:600}
.linkish{background:none;border:none;padding:0;font:inherit;color:var(--accent2);font-weight:600;cursor:pointer}
.linkish:hover{text-decoration:underline}
.auth-msg{font-size:13px;margin-top:12px;min-height:18px}
.auth-msg.err{color:var(--red)}.auth-msg.ok{color:var(--green)}

/* logo draw animation */
.logo path{stroke-dasharray:120;stroke-dashoffset:120;animation:draw 1.4s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* login hero: Atlas catching the world (video, multiply-blended onto the card) */
/* the wrapper must paint --surface itself: the heroIn/heroFloat animations make it an
   isolated stacking context, so the multiply below has no backdrop to blend with otherwise */
.hero-anim{position:relative;width:119px;height:200px;margin:0 auto 18px;background:var(--surface);animation:heroIn .9s ease both}
.hero-anim video,.hero-anim img{display:block;width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;pointer-events:none;filter:grayscale(1) contrast(1.08)}
.hero-anim .hero-still{display:none}
.hero-anim.settled{animation:heroFloat 7s ease-in-out infinite}
@keyframes heroIn{from{opacity:0}to{opacity:1}}
@keyframes heroFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.auth-card h1,.auth-card .tag{animation:fadeUp .8s ease 1.7s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){
  .hero-anim,.hero-anim.settled,.auth-card h1,.auth-card .tag,.logo path{animation:none!important;stroke-dashoffset:0}
  .hero-anim .hero-video{display:none}
  .hero-anim .hero-still{display:block}
}

/* ---------- Layout ---------- */
#app{min-height:100vh;position:relative;z-index:1}
main{padding:30px 36px 70px;max-width:1060px;margin:0 auto;width:100%}
.page-head img{height:110px;filter:grayscale(1) contrast(1.06) brightness(1.02)}
.auth-card>img{filter:grayscale(1) contrast(1.06)}
.page-head{display:flex;align-items:center;justify-content:flex-start;margin-bottom:22px;gap:18px;flex-wrap:wrap}

/* ---------- Hub: Atlas centre, sections orbiting the circle ---------- */
/* Everything derives from --figh so the circle, the orbit radius and the stage stay
   locked together at any viewport. Each tile carries its own --tx/--ty (sin/cos of its
   angle, precomputed inline) and is placed at --R from the centre.
   tileIn is opacity-only on purpose: a transform keyframe would clobber that placement. */
#hub{min-height:100vh;display:flex;flex-direction:column;padding:28px 34px 22px;max-width:1320px;margin:0 auto;width:100%}
.hub-top{display:flex;align-items:center;justify-content:space-between;gap:16px;color:var(--muted);font-size:14px;font-weight:600}
.hub-top .hub-date{font-weight:500}
.hub-top .hub-date::before{content:'·';margin:0 8px;opacity:.6}
.hub-meta{display:flex;align-items:center;gap:10px}
/* the greeting sits beside the figure, in the free upper-right of the orbit */
.hub-hello{position:absolute;left:calc(50% + var(--D) / 2 + var(--figh) * .03);top:calc(50% - var(--R) * .4067 - 124px);white-space:nowrap;animation:tileIn .6s ease .1s both}
.hub-greet{font-size:clamp(28px,3.4vw,44px);font-weight:700;letter-spacing:-.03em;line-height:1.05}
.hub-status{color:var(--muted);font-size:14px;margin-top:9px;min-height:18px;display:flex;align-items:center;gap:7px}
.hub-status svg{width:15px;height:15px;flex:none}
.hub-stage{flex:1;display:flex;align-items:center;justify-content:center;padding:10px 0 16px}
.hub-orbit{--figh:clamp(250px,min(calc(100vh - 430px),calc(96vw - 300px)),620px);--D:calc(var(--figh) * .90);--R:calc(var(--D) / 2 + 64px + var(--figh) * .07);
  position:relative;width:calc(var(--R) * 2 + 104px);height:calc(var(--R) * 2 + 104px)}
/* the disc is the figure's stage: a shade darker than the page with a soft vignette, so it reads as a shape and not a hairline */
.hub-circle{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:var(--D);height:var(--D);border-radius:50%;background:radial-gradient(circle at 50% 42%,#e9e7e2 0%,#e2dfd9 62%,#d9d6cf 100%);border:1px solid #d0cdc6;box-shadow:0 0 0 9px var(--bg),0 0 0 10px var(--border),inset 0 2px 14px rgba(26,26,24,.05)}
.hub-col{display:contents}
.tile{position:absolute;left:50%;top:50%;gap:10px;
  transform:translate(-50%,-50%) translate(calc(var(--R) * var(--tx)),calc(var(--R) * var(--ty)));
  display:flex;flex-direction:column;align-items:center;gap:8px;background:transparent;border:none;padding:0;
  animation:tileIn .5s ease both}
.tile .ic{width:68px;height:68px;border-radius:21px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);color:var(--accent);display:flex;align-items:center;justify-content:center;transition:background .18s,color .18s,transform .18s,border-color .18s}
.tile svg{width:26px;height:26px}
.tile b{font-size:13px;font-weight:600;color:var(--accent2);transition:color .18s;text-shadow:0 0 6px var(--bg),0 0 3px var(--bg)}
.tile:hover .ic,.tile:focus-visible .ic{background:var(--grad);border-color:var(--accent);color:var(--on-ink);transform:translateY(-3px)}
.tile:hover b,.tile:focus-visible b{color:var(--text)}
.tile:active .ic{transform:translateY(-1px) scale(.97)}
.hub-col.left .tile:nth-child(1){animation-delay:.04s}
.hub-col.left .tile:nth-child(2){animation-delay:.09s}
.hub-col.left .tile:nth-child(3){animation-delay:.14s}
.hub-col.left .tile:nth-child(4){animation-delay:.19s}
.hub-col.right .tile:nth-child(1){animation-delay:.12s}
.hub-col.right .tile:nth-child(2){animation-delay:.17s}
.hub-col.right .tile:nth-child(3){animation-delay:.22s}
/* the figure is taller than the disc: head above its rim, body fading out below it */
/* pointer-events:none — the figure's box overlaps the tiles beside it; clicks must fall through to them */
.hub-figure{pointer-events:none;position:absolute;left:50%;top:calc(50% - var(--figh) * .63);transform:translateX(-50%);display:flex;align-items:flex-start;justify-content:center;width:calc(var(--figh) * 1.02);height:calc(var(--figh) * 1.36)}
.hub-figure img{position:relative;height:100%;object-fit:contain;filter:grayscale(1) contrast(1.06);animation:figIn .85s ease both;
  -webkit-mask-image:linear-gradient(to bottom,#000 84%,transparent 99%);mask-image:linear-gradient(to bottom,#000 84%,transparent 99%)}
.hub-foot{display:flex;justify-content:center;font-size:10px;color:var(--muted)}
@keyframes tileIn{from{opacity:0}to{opacity:1}}
@keyframes figIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){ .tile,.hub-figure img{animation:none!important} }

/* ---------- Section shell (top bar + main) ---------- */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:4px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--border)}
.home-btn{display:flex;align-items:center;gap:9px;background:transparent;border:none;color:var(--text);font-weight:700;font-size:16px;letter-spacing:-.02em;padding:6px 9px;border-radius:10px;flex-shrink:0;transition:background .15s}
.home-btn:hover{background:var(--surface2)}
.home-btn img{height:26px;filter:grayscale(1) contrast(1.06)}
.tabs{display:flex;gap:3px;flex:1;min-width:0;overflow-x:auto;margin:0 6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:transparent;border:none;color:var(--muted);padding:8px 12px;border-radius:9px;font-size:13.5px;font-weight:600;white-space:nowrap;transition:.15s}
.tab:hover{background:var(--surface2);color:var(--text)}
.tab.active{background:var(--grad);color:var(--on-ink)}

/* ---------- Cards / grids ---------- */
.grid{display:grid;gap:16px}
/* min(...,100%) so a column never exceeds the container on a narrow phone (the old 13px overflow) */
.grid.cols3{grid-template-columns:repeat(auto-fit,minmax(min(210px,100%),1fr))}
.grid.cols2{grid-template-columns:repeat(auto-fit,minmax(min(310px,100%),1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.card h3{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px}
.stat{font-size:28px;font-weight:700;letter-spacing:-.02em}
.stat small{font-size:13px;color:var(--muted);font-weight:500}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:11px 14px}
.row .grow{flex:1;min-width:0}
.row .title{font-weight:600;font-size:14px}
.row .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.row.done .title{text-decoration:line-through;color:var(--muted)}
.icon-btn{background:transparent;border:none;color:var(--muted);padding:5px;border-radius:7px;display:flex}
.icon-btn:hover{color:var(--text);background:var(--border)}
.icon-btn.danger:hover{color:var(--red)}
.pill{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill.red{background:rgba(155,70,58,.12);color:var(--red)}
.pill.amber{background:rgba(138,107,34,.13);color:var(--amber)}
.pill.green{background:rgba(74,106,68,.12);color:var(--green)}
.pill.grey{background:rgba(35,34,31,.08);color:var(--accent)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(140px,100%),1fr));gap:10px;margin-bottom:12px}
.empty{color:var(--muted);font-size:13.5px;padding:18px;text-align:center;border:1px dashed var(--border);border-radius:11px}
.progress-track{height:7px;background:var(--surface2);border-radius:99px;overflow:hidden}
.progress-fill{height:100%;background:var(--grad);border-radius:99px;transition:width .3s}
.chart-box{position:relative;height:240px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:11px 20px;border-radius:11px;font-size:14px;box-shadow:var(--shadow);transition:transform .25s;z-index:50}
#toast.show{transform:translateX(-50%) translateY(0)}
.checkbox{width:19px;height:19px;border-radius:6px;border:2px solid var(--border);background:transparent;flex-shrink:0;display:flex;align-items:center;justify-content:center;padding:0;position:relative}
.checkbox.checked{background:var(--grad);border-color:transparent;color:var(--on-ink)}
.btn:disabled,.btn-ghost:disabled{opacity:.55;pointer-events:none}

.lbl{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.ex-grid{display:grid;grid-template-columns:2fr .9fr .9fr 1.1fr 30px;gap:8px;align-items:center}
.ex-grid input{min-width:0}
.ex-grid .lbl{margin-bottom:0}
.sub-logo{width:28px;height:28px;border-radius:7px;flex-shrink:0;object-fit:contain;background:var(--surface)}
.sub-fallback{width:28px;height:28px;border-radius:7px;flex-shrink:0;background:var(--grad);color:var(--on-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-head h3{margin:0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dow{font-size:10px;font-weight:600;color:var(--muted);text-align:center;padding:4px 0;text-transform:uppercase}
.cal-day{aspect-ratio:1;min-height:40px;padding:2px;display:flex;align-items:center;justify-content:center;position:relative;border-radius:8px;font-size:clamp(11px,3.1vw,13px);line-height:1;cursor:pointer;border:1px solid transparent}
.cal-day:hover{background:var(--surface2)}
.cal-day.other{color:#b8b5ae}
.cal-day.today{border-color:var(--accent)}
.cal-day.selected{background:var(--grad);color:var(--on-ink)}
.cal-dot{position:absolute;bottom:4px;width:4px;height:4px;border-radius:99px;background:var(--accent)}
.cal-day.selected .cal-dot{background:var(--on-ink)}
/* intake program on the calendar: dashed = creatine loading week, corner dot = everything taken that day */
.cal-day.load{border:1px dashed var(--muted)}
.cal-day.load.today{border:1px solid var(--accent)}
.cal-day.took::before,.cal-day.part::before{content:'';position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:99px;box-sizing:border-box}
.cal-day.took::before{background:var(--green)}
.cal-day.part::before{border:1.5px solid var(--amber)}
.cal-day.selected.took::before{background:var(--on-ink)}
.cal-day.selected.part::before{border-color:var(--on-ink)}
.cal-key{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:11.5px;color:var(--muted)}
.cal-key span{display:inline-flex;align-items:center;gap:6px}
.cal-key i{display:inline-block;width:11px;height:11px;border-radius:4px;box-sizing:border-box}
.cal-key i.k-load{border:1px dashed var(--muted)}
.cal-key i.k-took{width:7px;height:7px;border-radius:99px;background:var(--green)}
.cal-key i.k-part{width:7px;height:7px;border-radius:99px;border:1.5px solid var(--amber)}

/* ---- creatine + protein program (Schedule) ---- */
.intake-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px 28px;align-items:start}
.intake-grid h4{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:0 0 8px}
.intake-grid .list{margin-top:12px}
.row.tick{cursor:pointer;flex-wrap:nowrap;-webkit-user-select:none;user-select:none}
.row.tick .grow{flex:1 1 0}
.row.tick:hover{border-color:var(--accent)}
.row.tick.off{cursor:default;opacity:.6}
.row.tick.off:hover{border-color:var(--border)}
.row.tick .checkbox{pointer-events:none}
.plan{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:11px;overflow:hidden;margin-bottom:10px}
.plan-row{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 12px;font-size:13px}
.plan-row+.plan-row{border-top:1px solid var(--border)}
.plan-row.now{background:var(--surface2)}
.plan-row .when{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.plan-row b{display:block;font-weight:600}
.plan-row .what span{color:var(--muted);font-size:12.5px}
.week .dot.pick{cursor:pointer}
.chk{display:flex;align-items:center;gap:9px;font-size:13.5px;margin:0 0 12px;cursor:pointer}
.chk input{width:auto;flex:none;accent-color:var(--accent)}
.form-grid[hidden]{display:none}
@media(max-width:760px){ .intake-grid{grid-template-columns:minmax(0,1fr)} }
@media(max-width:380px){ .plan-row{grid-template-columns:74px minmax(0,1fr) auto;gap:8px;padding:9px 10px} }

/* mobile */
@media(max-width:760px){
  .topbar{padding:8px 12px;gap:2px}
  .home-btn{font-size:0;gap:0;padding:6px}
  .home-btn img{height:24px}
  .tab{padding:8px 10px;font-size:13px}
  #hub{padding:20px 16px 14px}
  .hub-top{font-size:13px;align-items:flex-start}
  .hub-top .hub-date{display:block;margin-top:2px}
  .hub-top .hub-date::before{content:none}
  .hub-hello{position:static;white-space:normal;text-align:center;order:1;flex:0 0 100%;margin:-4px 0 4px}
  .hub-greet{font-size:27px}
  .hub-status{justify-content:center;font-size:13px}
  /* no room to orbit on a phone: Atlas on top with the circle behind him, tiles in two rows */
  .hub-stage{padding:6px 0 10px}
  .hub-orbit{--figh:clamp(210px,34vh,320px);width:100%;height:auto;display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:18px 0;padding-top:calc(var(--figh) * .06)}
  .hub-circle{top:calc(var(--figh) / 2);width:calc(var(--figh) * .95);height:calc(var(--figh) * .95);box-shadow:0 0 0 7px var(--bg),0 0 0 8px var(--border)}
  .hub-col{display:contents}
  .tile{position:static;transform:none!important;flex:0 0 31%;order:2;margin-bottom:6px}
  .hub-figure{position:relative;left:auto;top:auto;transform:none;order:0;flex:0 0 100%;width:auto;height:calc(var(--figh) * 1.2)}
  .hub-circle{top:calc(var(--figh) * .06 + var(--figh) * .5)}
  .tile .ic{width:60px;height:60px;border-radius:18px}
  .cal-grid{gap:2px}
  .cal-day{border-radius:7px}
  .cal-dot{bottom:3px}
  .page-head{gap:12px}
  .page-head img{height:64px;margin-left:auto}
  main{padding:22px 16px 44px}
  .auth-card{padding:28px 22px;max-width:340px}
  .hero-anim{width:98px;height:165px}
  .auth-card h1{font-size:22px}
  h2{font-size:19px}
  .stat{font-size:23px}
  .row{flex-wrap:wrap}
  .row .grow{flex:1 1 140px}
  .btn-ghost{padding:7px 11px}
  .icon-btn{padding:13px;margin:-7px}
  .wo-acts,.row.ex{gap:14px}
  .checkbox::after{content:'';position:absolute;inset:-11px}
  .card{padding:16px}
  .chart-box{height:200px}
  .page-head input[type=month]{max-width:150px}
}
/* six tabs have to fit across a narrow phone */
@media(max-width:420px){ .tab{padding:8px 8px;font-size:12.5px} .hub-col{gap:14px 16px} .tile .ic{width:52px;height:52px;border-radius:16px} .tile svg{width:21px;height:21px} .tile b{font-size:11.5px} }

/* ================= GYM ================= */
.gym-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.gym-top .grow{flex:1;min-width:170px}
.gym-top .big{font-size:18px;font-weight:700;letter-spacing:-.02em}
.gym-top .sub{font-size:12.5px;color:var(--muted);margin-top:3px}
.gym-acts{display:flex;gap:8px;flex-wrap:wrap}

.ex-card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:11px;align-items:center;background:var(--surface2);border:1px solid var(--border);border-radius:13px;padding:11px 12px}
.ex-card+.ex-card{margin-top:9px}
.ex-card.open{border-color:var(--accent)}
/* one card is open at a time: the wheels scroll vertically, so a page full of them would swallow every swipe */
.ex-head{display:flex;align-items:center;gap:11px;min-width:0;background:none;border:none;padding:0;color:inherit;text-align:left;font-size:inherit}
.ex-ico{width:54px;height:54px;flex:none;border-radius:12px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--accent)}
.ex-ico img{width:42px;height:42px;object-fit:contain}
.ex-body{display:block;flex:1;min-width:0}
.ex-name{display:block;font-weight:600;font-size:14.5px;line-height:1.2}
.ex-last{display:block;font-size:11.5px;color:var(--muted);margin-top:3px}
.ex-last b{font-size:13px;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}
.ex-chev{flex:none;display:flex;color:var(--muted);transition:transform .15s}
.ex-card.open .ex-chev{transform:rotate(90deg)}
.ex-steps{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr 1.6fr;gap:8px;max-width:440px}
.ex-steps.cardio{grid-template-columns:1fr 1.6fr;max-width:320px}

/* scroll wheel: a snap-scrolling column, the row resting in the middle band is the value */
.wheel{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:6px 4px 4px;text-align:center;min-width:0}
.wheel .lbl{margin-bottom:2px;font-size:10px}
.wheel-win{position:relative;display:flex;height:102px}
.wheel-win::before{content:'';position:absolute;left:2px;right:2px;top:34px;height:34px;border-radius:8px;background:var(--surface2);pointer-events:none}
.wheel-col{position:relative;flex:1;min-width:0;height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none;touch-action:pan-y;outline:none;border-radius:8px;
  -webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,.22),#000 36%,#000 64%,rgba(0,0,0,.22));mask-image:linear-gradient(to bottom,rgba(0,0,0,.22),#000 36%,#000 64%,rgba(0,0,0,.22))}
.wheel-col::-webkit-scrollbar{display:none}
.wheel-col:focus-visible{box-shadow:inset 0 0 0 2px var(--accent)}
.wheel-pad,.wheel-row{height:34px}
.wheel-row{scroll-snap-align:center;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;cursor:pointer;-webkit-user-select:none;user-select:none}
.wheel-row.on{font-size:19px;font-weight:700;color:var(--text)}
/* kg = whole + fraction side by side. In the band they close up and read as one number ("62" ".5");
   above and below they stand apart behind a hairline, so "61" next to ".25" isn't mistaken for 61.25 */
.wheel-col.int{flex:1.25}
.wheel-col.int .wheel-row{justify-content:flex-end;padding-right:9px}
.wheel-col.frac .wheel-row{justify-content:flex-start;padding-left:9px}
.wheel-col.int .wheel-row.on{padding-right:1px}
.wheel-col.frac .wheel-row.on{padding-left:1px}
.wheel-win.two{background:linear-gradient(var(--border),var(--border)) 55.56% 0/1px 100% no-repeat}
.btn.ico{display:inline-flex;align-items:center;justify-content:center;gap:7px}
.ex-vol{font-size:11px;color:var(--muted);text-align:right;white-space:nowrap}

.rest{display:flex;align-items:center;gap:7px;background:var(--surface2);border:1px solid var(--border);border-radius:99px;padding:4px 4px 4px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.rest.run{border-color:var(--accent);color:var(--text)}
.rest .t{font-variant-numeric:tabular-nums;min-width:44px}
.rest.ding{animation:restDing .5s ease 3}
@keyframes restDing{0%,100%{background:var(--surface2)}50%{background:rgba(74,106,68,.22)}}

.week{display:flex;gap:5px}
.week>div{flex:1;text-align:center;min-width:0}
.week .d{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.week .dot{height:32px;border-radius:9px;border:1px solid var(--border);background:var(--surface2);margin-top:5px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--muted)}
.week .dot.on{background:var(--accent);border-color:var(--accent);color:var(--on-ink)}
.week .dot.today{border-color:var(--accent);border-width:2px}
.week .dot svg{width:15px;height:15px}

.sheet-bg{position:fixed;inset:0;background:rgba(26,26,24,.38);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .15s ease}
.sheet{background:var(--surface);border:1px solid var(--border);border-radius:18px;width:100%;max-width:640px;max-height:86vh;display:flex;flex-direction:column;box-shadow:0 16px 48px rgba(26,26,24,.22);animation:sheetIn .2s ease}
@keyframes sheetIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet-head{padding:15px 17px 12px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:10px}
.sheet-head .top{display:flex;align-items:center;gap:10px}
.sheet-head h3{flex:1;margin:0}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:99px;padding:6px 13px;font-size:12.5px;font-weight:600;white-space:nowrap}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--on-ink)}
.sheet-body{flex:1;overflow-y:auto;padding:14px 17px 18px;-webkit-overflow-scrolling:touch}
.sheet-foot{display:flex;align-items:center;gap:12px;padding:12px 17px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--border)}
.sheet-foot .n{flex:1;font-size:13px;color:var(--muted)}
.sheet-foot .btn{min-width:132px}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px}
.pick{background:var(--surface2);border:1px solid var(--border);border-radius:13px;padding:11px 6px 9px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;position:relative;transition:transform .1s,border-color .15s;color:var(--text)}
.pick:hover{border-color:var(--accent)}
.pick:active{transform:scale(.95)}
.pick img{width:44px;height:44px;object-fit:contain}
.pick b{font-size:11.5px;font-weight:600;line-height:1.25}
.pick.added{border-color:var(--accent);background:var(--surface)}
.pick .tick{position:absolute;top:5px;right:5px;width:17px;height:17px;border-radius:50%;background:var(--accent);color:var(--on-ink);display:none;align-items:center;justify-content:center}
.pick .tick svg{width:10px;height:10px;color:var(--on-ink)}
.pick.added .tick{display:flex}
.pick-sec{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:17px 0 9px}
.pick-sec:first-child{margin-top:0}

.wo-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 11px;align-items:center;background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:10px 12px}
.wo-row .grow{min-width:0}
.wo-row .sub{overflow-wrap:anywhere}
.wo-icos{display:flex;flex:none}
.wo-icos img{width:28px;height:28px;object-fit:contain;background:var(--surface);border:1px solid var(--border);border-radius:50%;padding:3px}
.wo-icos img+img{margin-left:-7px}
.wo-acts{display:flex;gap:2px;flex:none}
.pr-ico{width:34px;height:34px;flex:none;object-fit:contain}
.tap-tag{display:inline-flex;align-items:center;font-size:10.5px;font-weight:600;color:var(--muted);border:1px solid var(--border);border-radius:99px;padding:1px 7px 1px 5px;margin-left:6px;text-transform:uppercase;letter-spacing:.04em;vertical-align:1px}

@media(max-width:560px){
  .ex-card{gap:9px;padding:10px}.ex-head{gap:9px}
  .ex-ico{width:46px;height:46px}.ex-ico img{width:36px;height:36px}
  .pick-grid{grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
  .sheet-bg{padding:0;align-items:flex-end}
  .sheet{max-width:none;border-radius:18px 18px 0 0;max-height:92vh}
  /* three wheels share ~320px: sets/reps are 1-2 digits, kg is two columns ("102" ".75") — give kg the room */
  .ex-steps{gap:6px;grid-template-columns:1fr 1fr 1.7fr;max-width:none}
  .ex-steps.cardio{grid-template-columns:1fr 1.7fr;max-width:none}
  .wo-row{grid-template-columns:auto minmax(0,1fr)}
  .wo-acts{grid-column:1/-1;justify-content:flex-end}
  .gym-acts{width:100%}.gym-acts .btn,.gym-acts .btn-ghost{flex:1}
}
@media(max-width:380px){
  .ex-card{gap:8px;padding:9px}.ex-head{gap:8px}
  .ex-ico{width:42px;height:42px}.ex-ico img{width:33px;height:33px}
  .wheel-row.on{font-size:18px}
}

/* ================= MONEY ================= */
.scope-pick{display:flex;gap:6px;align-items:center;margin-left:auto;flex-wrap:wrap}
.scope-pick button{border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:99px;padding:6px 13px;font-size:12.5px;font-weight:600}
.scope-pick button.on{background:var(--accent);border-color:var(--accent);color:var(--on-ink)}
.scope-pick input{width:auto;padding:6px 10px;font-size:12.5px}
.scope-pick input:disabled{opacity:.45}

.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));gap:12px;margin-bottom:16px}
/* .mstat, not .stat: .stat is the bare big number used on Rent and must stay unboxed */
.mstat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.mstat .lbl{margin-bottom:6px}
.mstat .v{font-size:23px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.mstat .s{font-size:12px;color:var(--muted);margin-top:5px;min-height:16px}
.mstat .s.warn{color:var(--red)}.mstat .s.good{color:var(--green)}

.insight{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;padding:12px 0}
.insight+.insight{border-top:1px solid var(--border)}
.insight .ico{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2);color:var(--muted)}
.insight .ico svg{width:18px;height:18px}
.insight.warn .ico{background:rgba(155,70,58,.11);color:var(--red)}
.insight.good .ico{background:rgba(74,106,68,.12);color:var(--green)}
.insight .t{font-weight:600;font-size:14.5px;line-height:1.3}
.insight .b{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.45}

.mer-ico{width:38px;height:38px;flex:none;border-radius:10px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center}
.mer-ico svg{width:23px;height:23px}
.row.ex{gap:11px}
.row.ex .sub .dot{opacity:.5;padding:0 2px}
.pill.cat{background:color-mix(in srgb, var(--cc) 13%, transparent);color:var(--cc)}
.row.oth{gap:11px}
.row.oth select{width:auto;max-width:160px;font-size:13px;padding:7px 9px}

.cat-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px}
.cat-legend .lg{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.cat-legend .lg i{width:10px;height:10px;border-radius:3px;flex:none}
.cat-legend .lg b{color:var(--text);font-weight:600}

/* Hebrew merchant names next to Latin dates: isolate each run or bidi reorders the line */
bdi{unicode-bidi:isolate}

@media(max-width:560px){
  .stat-row{grid-template-columns:1fr 1fr;gap:10px}
  .mstat{padding:12px}.mstat .v{font-size:19px}
  .scope-pick{width:100%}.scope-pick input{flex:1}
  .mer-ico{width:34px;height:34px}.mer-ico svg{width:20px;height:20px}
  .row.oth{flex-wrap:wrap}.row.oth select{max-width:none;width:100%}
  .insight{grid-template-columns:28px 1fr;gap:10px}
  .insight .ico{width:28px;height:28px}.insight .ico svg{width:15px;height:15px}
}

/* ---------- House: floor-plan designer ---------- */
main.wide{max-width:1500px}
.hd-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.hd-bar select{width:auto;max-width:220px;padding:8px 10px;font-weight:600}
.hd-sep{width:1px;height:22px;background:var(--border);margin:0 4px}
.hd-ib{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:38px;height:38px;padding:0 9px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--accent2);font-size:13px;font-weight:600}
.hd-ib svg{width:17px;height:17px}
.hd-ib:hover{border-color:var(--accent);color:var(--text)}
.hd-ib.on{background:var(--grad);border-color:var(--accent);color:var(--on-ink)}
.hd-ib:disabled{opacity:.4;pointer-events:none}
.hd-add-m{display:none}
.hd-saved{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.hd-saved.bad{color:var(--red);font-weight:600}
.hd-wrap{display:grid;grid-template-columns:236px minmax(0,1fr) 270px;gap:14px;align-items:start}
.hd-side{padding:12px;position:sticky;top:70px;height:max(460px,calc(100vh - 230px));overflow-y:auto;overscroll-behavior:contain}
.hd-cats{flex-wrap:wrap;margin-bottom:10px}
.hd-cats button{padding:5px 10px;font-size:12px}
.hd-lib-list{display:flex;flex-direction:column;gap:4px}
.hd-lib-it{display:flex;align-items:center;gap:10px;background:transparent;border:1px solid transparent;border-radius:10px;padding:6px 7px;text-align:left;color:var(--text);transition:background .12s,border-color .12s}
.hd-lib-it:hover{background:var(--surface2);border-color:var(--border)}
.hd-lib-it .pv{flex:none;width:46px;height:38px;display:flex;align-items:center;justify-content:center;background:var(--surface2);border-radius:8px}
.hd-lib-it .pv svg{width:38px;height:30px}
.hd-lib-it .nm{display:flex;flex-direction:column;font-size:13px;font-weight:600;line-height:1.25}
.hd-lib-it small{font-size:11px;color:var(--muted);font-weight:500}
.sheet .hd-lib-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.hd-stage{position:relative;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--bg);height:calc(100vh - 230px);min-height:460px}
#hdSvg{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
#hdSvg:active{cursor:grabbing}
#hdSvg.measuring{cursor:crosshair}
#hdSvg .hd-it,#hdSvg .hd-op{cursor:move}
#hdSvg [data-t=room]{cursor:pointer}
.hd-tip{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--accent);color:var(--on-ink);font-size:12px;font-weight:600;padding:5px 11px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .15s}
.hd-tip.show{opacity:1}
.hd-insp{padding:16px;position:sticky;top:70px;max-height:max(460px,calc(100vh - 230px));overflow-y:auto;overscroll-behavior:contain}
.hd-form{display:flex;flex-direction:column;gap:10px}
.hd-form input,.hd-form select{padding:8px 10px}
.hd-2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hd-2 .btn-ghost{width:100%}
.hd-rot{display:grid;grid-template-columns:38px 1fr 38px;gap:6px}
.hd-big{margin-top:12px;font-size:14px;font-weight:600}
.hd-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:14px 0 10px}
.hd-stats div{background:var(--surface2);border-radius:10px;padding:9px 8px;display:flex;flex-direction:column}
.hd-stats b{font-size:17px}
.hd-stats span{font-size:11px;color:var(--muted)}
.hd-warn{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.hd-rooms{display:flex;flex-direction:column;gap:2px;margin:6px 0 4px}
.hd-rooms button{display:flex;justify-content:space-between;align-items:baseline;gap:8px;background:transparent;border:none;border-bottom:1px solid var(--border);padding:8px 2px;text-align:left;color:var(--text);font-size:13px;font-weight:600}
.hd-rooms button:hover{color:var(--accent)}
.hd-rooms small{color:var(--muted);font-weight:500;font-size:11.5px;white-space:nowrap}
.hd-hint{font-size:12px;color:var(--muted);line-height:1.5;margin:10px 0}
.hd-acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.hd-acts .btn-ghost{display:inline-flex;align-items:center;gap:6px}
.hd-acts svg{width:14px;height:14px}
.btn-ghost.danger:hover{color:var(--red);border-color:var(--red)}
.hd-start{max-width:640px}
.hd-start p{margin:-4px 0 14px}
@media(max-width:1180px){
  .hd-wrap{grid-template-columns:210px minmax(0,1fr)}
  .hd-insp{grid-column:1 / -1;position:static;max-height:none}
}
@media(max-width:900px){
  .hd-wrap{grid-template-columns:minmax(0,1fr)}
  .hd-side{display:none}
  .hd-add-m{display:inline-flex}
  .hd-stage{height:62vh;min-height:340px}
}
@media(max-width:560px){
  .hd-bar select{max-width:none;flex:1 1 140px}
  .hd-sep{display:none}
  .hd-saved{flex-basis:100%;margin-left:0;order:9}
  .hd-ib{min-width:36px;height:36px;padding:0 8px}
}
/* v40: rendered board look */
.hd-stage{background:#f4f3f0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.6)}
#hdSvg.render{background:#f4f3f0}
.hd-zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 4px 14px rgba(26,26,24,.10);overflow:hidden}
.hd-zoom button{width:38px;height:38px;border:none;background:transparent;color:var(--accent2);display:flex;align-items:center;justify-content:center}
.hd-zoom button+button{border-top:1px solid var(--border)}
.hd-zoom button:hover{background:var(--surface2);color:var(--text)}
.hd-zoom svg{width:17px;height:17px}
.hd-lib-it .pv{background:#dcdad5;box-shadow:inset 0 1px 2px rgba(26,26,24,.08)}
.hd-lib-it .pv svg{filter:drop-shadow(-1.5px -2px 1.5px rgba(20,20,18,.28))}
@media(max-width:560px){ .hd-ib span{display:none} .hd-add-m span{display:inline} .hd-zoom{right:8px;bottom:8px} .hd-zoom button{width:34px;height:34px} }
/* v42: live 3D view */
#hd3Canvas{display:none;width:100%;height:100%;touch-action:none;cursor:grab}
#hd3Canvas:active{cursor:grabbing}
.hd-stage.is3d{background:#e7e2da}
.hd-stage.is3d #hdSvg{display:none}
.hd-stage.is3d #hd3Canvas{display:block}
.hd3-labels,.hd3-ui{display:none}
.hd-stage.is3d .hd3-labels{display:block;position:absolute;inset:0;pointer-events:none;overflow:hidden}
.hd3-labels span{position:absolute;transform:translate(-50%,-50%);font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#2a2927;text-align:center;white-space:nowrap;text-shadow:0 0 3px rgba(255,255,255,.95),0 0 8px rgba(255,255,255,.7)}
.hd3-labels small{display:block;font-size:10px;font-weight:500;letter-spacing:0;text-transform:none;color:#55524c}
.hd-stage.is3d .hd3-ui{display:flex;position:absolute;left:12px;top:12px;right:12px;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.hd3-ui>*{pointer-events:auto}
.hd3-walls{background:rgba(251,250,248,.92);border:1px solid var(--border);border-radius:99px;padding:3px;box-shadow:0 4px 14px rgba(26,26,24,.08)}
.hd3-walls button{border:none;padding:5px 11px}
.hd3-turn{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:0 4px 14px rgba(26,26,24,.10)}
.hd3-turn button{width:38px;height:36px;border:none;background:transparent;color:var(--accent2);display:flex;align-items:center;justify-content:center}
.hd3-turn button+button{border-left:1px solid var(--border)}
.hd3-turn button:hover{background:var(--surface2);color:var(--text)}
.hd3-turn svg{width:17px;height:17px}
.hd-stage.is3d .hd-tip{display:none}

// the year is shown only when it isn't the current one — 13 months of history made "21 Sep" ambiguous
const fmtDate = d => { const x = new Date(d + 'T00:00');

const fmtDT = d => new Date(d).toLocaleString('en-GB', {weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
let charts = {};
function mkChart(id, cfg){ if(!window.Chart) return; if(charts[id]) charts[id].destroy(); const el = document.getElementById(id); if(!el) return; charts[id] = new Chart(el, cfg); }
/* PostgREST returns at most 1000 rows per request. Tables that are read whole (expenses,
   workout_sets) page through in 1000s so nothing silently drops off the end. */
async function fetchAll(mkQuery){
  const PAGE = 1000; let from = 0, rows = [];
  while(true){
    const {data, error} = await mkQuery().range(from, from + PAGE - 1);
    if(error) return {data: null, error};
    rows = rows.concat(data || []);
    if(!data || data.length < PAGE) return {data: rows, error: null};
    from += PAGE;
  }
}
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600); }
function err(e){ console.error(e); toast(e && e.message || 'Something went wrong'); }
// safety net: surface any uncaught error/rejection via the toast instead of vanishing silently
window.addEventListener('unhandledrejection', e => { e.preventDefault(); err(e.reason || new Error('Something went wrong')); });
window.addEventListener('error', e => { if(e.error) err(e.error); });
// shared submit handler: prevents default, disables the submit button while the async call is in flight
async function submitGuard(e, fn){
  e.preventDefault();
  const btn = e.submitter || e.target.querySelector('[type=submit]');
  if(btn){ if(btn.disabled) return; btn.disabled = true; }
  try{ await fn(); }
  catch(ex){ err(ex); }
  finally{ if(btn) btn.disabled = false; }
}

if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// ---------- login hero video ----------
// Plays the catch once, then holds the last frame with a slow float.

function heroFallback(){
  const v = document.getElementById('heroVideo');

// if a file is dropped outside the import box, don't let the browser navigate away to the PDF
window.addEventListener('dragover', e => e.preventDefault());

/* ================= AUTH ================= */
let signupMode = false;
function toggleAuthMode(){
  signupMode = !signupMode;
  document.getElementById('authSubmit').textContent = signupMode ? 'Create account' : 'Sign in';
  document.getElementById('authPassword').autocomplete = signupMode ? 'new-password' : 'current-password';
  document.getElementById('authSwitch').innerHTML = signupMode
    ? 'Have an account? <button class="linkish" type="button" onclick="toggleAuthMode()">Sign in</button>'
    : 'No account? <button class="linkish" type="button" onclick="toggleAuthMode()">Sign up</button>';
}
document.getElementById('authForm').addEventListener('submit', async e => {
  e.preventDefault();
  const email = authEmail.value.trim(), password = authPassword.value;
  const msg = document.getElementById('authMsg');
  msg.className = 'auth-msg'; msg.textContent = signupMode ? 'Creating account…' : 'Signing in…';
  const {error} = signupMode
    ? await sb.auth.signUp({email, password})

['signOutBtn','signOutHub'].forEach(id => document.getElementById(id).addEventListener('click', () => sb.auth.signOut()));
async function forgotPassword(){

  const {error} = await sb.auth.resetPasswordForEmail(email);

/* password reset: the email link lands here with a recovery session and PASSWORD_RECOVERY fires.
   Stay on the auth card and ask for the new password instead of dropping into the app. */
document.getElementById('recoverForm').addEventListener('submit', e => submitGuard(e, async () => {
  const {error} = await sb.auth.updateUser({password: document.getElementById('newPassword').value});
  if(error) return err(error);
  window._recovering = false;
  ['authForm','authSwitch','authForgot'].forEach(id => document.getElementById(id).classList.remove('hidden'));
  document.getElementById('recoverForm').classList.add('hidden');
  toast('Password updated');
  const {data: {session}} = await sb.auth.getSession();
  if(session){
    document.getElementById('authScreen').classList.add('hidden'); document.getElementById('app').classList.remove('hidden');
    if(!window._booted){ window._booted = true; go('home'); }
  }
}));
sb.auth.onAuthStateChange((ev, session) => {
  if(ev === 'PASSWORD_RECOVERY'){
    window._recovering = true;
    ['authForm','authSwitch','authForgot'].forEach(id => document.getElementById(id).classList.add('hidden'));
    document.getElementById('recoverForm').classList.remove('hidden');
    document.getElementById('authScreen').classList.remove('hidden');
    document.getElementById('app').classList.add('hidden');
    return;
  }
  if(window._recovering) return;
  document.getElementById('authScreen').classList.toggle('hidden', !!session);
  document.getElementById('app').classList.toggle('hidden', !session);
  // only route on real sign-in — TOKEN_REFRESHED fires hourly and must not wipe forms mid-typing
  if(session && !window._booted){ window._booted = true; go(location.hash.slice(1) || 'home'); }
  if(!session) window._booted = false;
});

/* ================= ROUTER ================= */
const views = {};
/* Views render asynchronously: they paint #main, then await Supabase. If the user
   navigates (or triggers a re-render) while a query is in flight, #main has already
   been rewritten and that render's element ids no longer exist — writing into them
   threw "null is not an object". Every render takes a token and bails out if a newer
   render has started in the meantime. */
let _renderSeq = 0;
const renderStart = () => ++_renderSeq;
const stale = seq => seq !== _renderSeq;
window.addEventListener('hashchange', () => { const t = location.hash.slice(1) || 'home'; if(t !== window._curTab) go(t); });
/* 'home' is the hub — Atlas centred with the six sections orbiting him.
   Every other tab hides the hub and swaps in the section shell (top bar + #main). */
function go(tab){
  if(tab !== 'home' && !views[tab]) tab = 'home';
  window._curTab = tab;
  location.hash = tab;
  const home = tab === 'home';
  document.getElementById('hub').classList.toggle('hidden', !home);
  document.getElementById('shell').classList.toggle('hidden', home);
  window.scrollTo(0, 0);
  // bumping the token here cancels any section render still awaiting Supabase
  if(home){ renderStart(); renderHub(); return; }
  document.querySelectorAll('.tab[data-tab]').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.getElementById('main').classList.toggle('wide', tab === 'house');
  views[tab]();
}
document.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => go(b.dataset.tab)));
document.getElementById('homeBtn').addEventListener('click', () => go('home'));

/* hub chrome: greeting, date, clock */
function renderHub(){
  const h = new Date().getHours();
  document.getElementById('hubDay').textContent = h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
  document.getElementById('hubDate').textContent =
    new Date().toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'long'});
  tickClock();
  hubStatus();
}
/* one quiet line under the greeting: when you last trained, and what today holds */
async function hubStatus(){
  const el = document.getElementById('hubStatus'); if(!el) return;
  const seq = renderStart();
  const dayStart = new Date(); dayStart.setHours(0,0,0,0);
  const dayEnd = new Date(dayStart); dayEnd.setDate(dayEnd.getDate() + 1);
  const [wo, ev] = await Promise.all([
    sb.from('workouts').select('workout_date').order('workout_date', {ascending:false}).limit(1),
    sb.from('events').select('id', {count:'exact', head:true}).gte('starts_at', dayStart.toISOString()).lt('starts_at', dayEnd.toISOString()).eq('done', false),
  ]);
  if(stale(seq) || wo.error || ev.error) return;
  const parts = [];
  const last = wo.data && wo.data[0] && wo.data[0].workout_date;
  if(last){
    const days = Math.round((new Date(todayStr()) - new Date(last)) / 864e5);
    parts.push(days === 0 ? 'Trained today' : days === 1 ? 'Trained yesterday' : `Last workout ${days} days ago`);
  } else parts.push('No workouts yet');
  const n = ev.count || 0;
  parts.push(n ? `${n} event${n === 1 ? '' : 's'} today` : 'Nothing scheduled today');
  el.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>${parts.join(' · ')}`;
}
function tickClock(){
  const el = document.getElementById('hubClock');
  if(el) el.textContent = new Date().toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'});
}
setInterval(tickClock, 1000);

/* ================= SCHEDULE ================= */
views.schedule = async function(){
  const seq = renderStart();
  const ed = window._editEv;
  const edD = ed ? new Date(ed.starts_at) : null;
  document.getElementById('main').innerHTML = `
    <div class="page-head"><h2>Schedule</h2><img src="hero-schedule.png" alt="" onerror="this.remove()"></div>
    <div class="card" style="margin-bottom:16px" id="intakeCard"><h3>Creatine and protein</h3><div class="empty">Loading…</div></div>
    <div class="card" style="margin-bottom:16px"><h3>${ed ? 'Edit event' : 'Add event'}</h3>
      <form onsubmit="submitGuard(event, addEvent)">
      <div class="form-grid">
        <div style="grid-column:1/-1"><label class="lbl" for="evTitle">Event title — what's happening?</label>
          <input id="evTitle" placeholder="e.g. Dentist appointment" enterkeyhint="done" value="${ed ? esc(ed.title) : ''}"></div>
        <div><label class="lbl" for="evDate">Date</label><input id="evDate" type="date" value="${ed ? edD.toLocaleDateString('en-CA') : (window._selDate || todayStr())}"></div>
        <div><label class="lbl" for="evTime">Start time</label><input id="evTime" type="time" value="${ed ? edD.toTimeString().slice(0,5) : '09:00'}"></div>

        ${ed ? '<button class="btn-ghost" type="button" onclick="window._editEv=null;views.schedule()">Cancel</button>' : ''}
      </div>
      </form>
    </div>
    <div class="grid cols2">
      <div class="card" id="calCard"></div>
      <div class="card"><h3 id="evListTitle">Upcoming</h3><div class="list" id="evList"><div class="empty">Loading…</div></div></div>
    </div>`;
  window._intakeEdit = false;
  const since = new Date(Date.now() - 400 * 864e5).toLocaleDateString('en-CA');
  const [{data, error}, plan, logs] = await Promise.all([
    sb.from('events').select('*').order('starts_at'),
    sb.from('user_settings').select('intake_plan').maybeSingle(),
    sb.from('intake_log').select('day,creatine_slots,protein_done').gte('day', since).order('day'),
  ]);
  if(stale(seq)) return;
  // the program card fails on its own: a problem there must not take the calendar down with it
  window._intakeErr = plan.error || logs.error || null;
  window._intakePlan = plan.data ? plan.data.intake_plan : null;
  window._intakeLogs = Object.fromEntries((logs.data || []).map(r => [r.day, {creatine_slots: r.creatine_slots || [], protein_done: !!r.protein_done}]));
  renderIntake();
  if(error) return err(error);
  window._events = data;
  renderCalendar();
  renderEvList();
};

/* ---------- creatine + protein program ----------
   The plan (start date, loading week, dose times, protein target) is one jsonb value in
   user_settings.intake_plan. What was actually taken is one intake_log row per day:
   creatine_slots = which of that day's doses were ticked (0-based), protein_done = the protein tick.
   Everything a day asks for is derived from the plan, so changing the plan never rewrites history. */
const INTAKE_DEF = {load_days: 7, load_times: ['08:00', '12:00', '16:00', '20:00'], time: '08:00', dose: 5, protein: 140};
function intakePlan(){ const p = window._intakePlan; return p && p.start ? {...INTAKE_DEF, ...p} : null; }
const dsAdd = (ds, n) => { const d = new Date(ds + 'T00:00'); d.setDate(d.getDate() + n); return d.toLocaleDateString('en-CA'); };
const dsDiff = (a, b) => Math.round((new Date(a + 'T00:00') - new Date(b + 'T00:00')) / 864e5);   // rounded: a DST night is 23 or 25 hours
/* what the program asks for on a day; null before it starts */
function intakeDay(ds){
  const p = intakePlan(); if(!p) return null;
  const n = dsDiff(ds, p.start); if(n < 0) return null;
  const loading = n < p.load_days;
  return {n, loading, times: loading ? p.load_times : [p.time]};
}
function intakeState(ds){
  const d = intakeDay(ds); if(!d) return null;
  const log = (window._intakeLogs || {})[ds];
  const slots = log ? log.creatine_slots.filter(i => i < d.times.length) : [], protein = !!(log && log.protein_done);
  const done = slots.length + (protein ? 1 : 0), total = d.times.length + 1;
  return {...d, slots, protein, done, total, complete: done === total};
}
function renderIntake(){
  const c = document.getElementById('intakeCard'); if(!c) return;
  if(window._intakeErr){ c.innerHTML = `<h3>Creatine and protein</h3><div class="empty">Couldn't load the program — ${esc(window._intakeErr.message)}</div>`; return; }
  const p = intakePlan();
  if(!p || window._intakeEdit){ c.innerHTML = intakeForm(p); return; }
  const today = todayStr(), ds = window._selDate || today, st = intakeState(ds), future = ds > today;

          return tick(on, i, `Creatine ${p.dose} g`, `${esc(t)} · ${st.loading ? 'dose ' + (i + 1) + ' of ' + st.times.length : 'with a meal or a shake'}`, ds === today && !on && nowHM >= t); }).join('')}
        ${tick(st.protein, "'p'", `Protein ${p.protein} g`, `Whole day · about ${perMeal} g at each of 4 meals`, false)}</div>`;

      <div class="dot pick${on ? ' on' : ''}${s === today ? ' today' : ''}" role="button" tabindex="0" title="${fmtDate(s)}${w ? ' — ' + w.done + ' of ' + w.total + ' taken' : ''}"
        onclick="calPick('${s}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();calPick('${s}')}">${on ? ICO.tick : w && w.done ? w.done + '/' + w.total : +s.slice(8)}</div></div>`;

  const plan = (p.load_days ? `<div class="plan-row${inLoad ? ' now' : ''}"><span class="when">${fmtDate(p.start)} – ${fmtDate(loadEnd)}</span>
        <span class="what"><b>Loading week</b><span>${p.load_times.length} × ${p.dose} g creatine at ${p.load_times.map(esc).join(', ')}</span></span>${pill(inLoad, started && !inLoad)}</div>` : '')
    + `<div class="plan-row${started && !inLoad ? ' now' : ''}"><span class="when">From ${fmtDate(dsAdd(p.start, p.load_days))}</span>

      <div class="plan-row"><span class="when">Every day</span>
        <span class="what"><b>Protein</b><span>${p.protein} g, about ${perMeal} g per meal</span></span><span></span></div>`;

  c.innerHTML = `<h3>Creatine and protein — ${ds === today ? 'today' : fmtDate(ds)}${ds === today ? '' :
      ` <button class="linkish" type="button" style="font-size:11px;margin-left:8px;text-transform:none;letter-spacing:0" onclick="calPick('${ds}')">back to today</button>`}</h3>
    <div class="intake-grid">
      <div>${day}</div>

        <div class="week" style="margin-bottom:16px">${week}</div>
        <h4>Program</h4><div class="plan">${plan}</div>
        <button class="linkish" type="button" style="font-size:12.5px" onclick="window._intakeEdit=true;renderIntake()">Edit program</button></div>
    </div>`;
}

let _intakeQ = Promise.resolve();
function intakeTick(ds, key){

  const row = {creatine_slots: old ? old.creatine_slots.slice() : [], protein_done: old ? old.protein_done : false};
  if(key === 'p') row.protein_done = !row.protein_done;
  else { const at = row.creatine_slots.indexOf(key); at >= 0 ? row.creatine_slots.splice(at, 1) : row.creatine_slots.push(key); row.creatine_slots.sort(); }

  pause:'<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M7 4h4v16H7zM13 4h4v16h-4z"/></svg>',
};
const gnum = n => (+n || 0).toLocaleString('en-GB', {maximumFractionDigits: 2});   // quarter-kilo plates: 8.75, not 8.8
function exSum(it){ return isCardio(it.ex) ? 0 : (+it.sets || 0) * (+it.reps || 0) * (+it.kg || 0); }
function draftVol(){ return (gymDraft ? gymDraft.items : []).reduce((a, it) => a + exSum(it), 0); }
function draftSets(){ return (gymDraft ? gymDraft.items : []).reduce((a, it) => a + (+it.sets || 0), 0); }

/* most recent logged numbers for an exercise, so a repeat session is pre-filled */
function lastFor(name){
  const dateOf = window._woDates || {};
  let best = null;
  (window._allSets || []).forEach(s => {
    if(exCanon(s.exercise) !== name) return;
    const d = dateOf[s.workout_id]; if(!d) return;
    if(!best || d > best.date) best = {date: d, sets: +s.sets || 1, reps: +s.reps || 0, kg: +s.weight_kg || 0};
  });
  return best;
}
function recentExercises(){
  const dateOf = window._woDates || {}, seen = {};
  (window._allSets || []).forEach(s => {
    const d = dateOf[s.workout_id], n = exCanon(s.exercise);
    if(d && (!seen[n] || d > seen[n])) seen[n] = d;
  });
  return Object.keys(seen).sort((a, b) => seen[b].localeCompare(seen[a]));
}

function exToggle(i){ _exOpen = _exOpen === i ? -1 : i; renderExList(); }

/* ---------- scroll wheels ----------
   Each number is a snap-scrolling column; whichever row rests in the middle band is the value.
   Kg is two columns read as one number (whole + fraction), so 8.75 or 62.5 is two short flicks
   instead of a long scroll through every quarter-kilo. */
const r2 = n => Math.round(n * 100) / 100;
const wRange = (lo, hi) => Array.from({length: hi - lo + 1}, (_, n) => lo + n);
function wheelCol(i, k, part, vals, cur, label, fmt){
  if(!vals.includes(cur)) vals = vals.concat(cur).sort((a, b) => a - b);   // an off-grid logged value stays selectable
  const at = vals.indexOf(cur);
  return `<div class="wheel-col ${part}" tabindex="0" role="spinbutton" aria-label="${label}" aria-valuenow="${cur}"
    data-i="${i}" data-k="${k}" data-p="${part}" data-at="${at}"
    onscroll="wheelScroll(this)" onclick="wheelTap(event,this)" onkeydown="wheelKey(event,this)"><div class="wheel-pad"></div>${
    vals.map((v, n) => `<div class="wheel-row${n === at ? ' on' : ''}" data-v="${v}">${fmt ? fmt(v) : v}</div>`).join('')
    }<div class="wheel-pad"></div></div>`;
}
function wheel(i, k, label){
  const it = gymDraft.items[i], cardio = isCardio(it.ex), v = Math.max(0, +it[k] || 0);
  let cols;
  if(k === 'kg'){
    const whole = Math.floor(v), frac = r2(v - whole);
    cols = wheelCol(i, k, 'int', wRange(0, Math.max(cardio ? 99 : 300, whole)), whole, label)
      + wheelCol(i, k, 'frac', cardio ? wRange(0, 9).map(n => n / 10) : [0, .25, .5, .75], frac, label + ' fraction',
          n => '.' + (String(n).split('.')[1] || '0'));
  } else {
    const lo = k === 'sets' || !cardio ? 1 : 0, hi = k === 'sets' ? 12 : cardio ? 240 : 60;
    cols = wheelCol(i, k, '', wRange(lo, Math.max(hi, Math.ceil(v))), k === 'sets' ? Math.max(1, v) : v, label);
  }
  return `<div class="wheel"><div class="lbl">${label}</div><div class="wheel-win${k === 'kg' ? ' two' : ''}">${cols}</div></div>`;
}
const wheelH = el => (el._rows[0] && el._rows[0].offsetHeight) || 34;
function wheelsInit(){
  document.querySelectorAll('#exList .wheel-col').forEach(el => {
    el._rows = el.querySelectorAll('.wheel-row'); el._n = +el.dataset.at;
    el.scrollTop = el._n * wheelH(el);
    el.addEventListener('wheel', wheelNotch, {passive: false});
  });
}
function wheelGo(el, n, smooth){
  n = Math.max(0, Math.min(el._rows.length - 1, n));
  el.scrollTo({top: n * wheelH(el), behavior: smooth ? 'smooth' : 'auto'});
}
function wheelScroll(el){
  if(el._raf) return;
  el._raf = requestAnimationFrame(() => { el._raf = 0; wheelRead(el); });
}
function wheelRead(el){
  if(!el._rows || !el.isConnected) return;
  const n = Math.max(0, Math.min(el._rows.length - 1, Math.round(el.scrollTop / wheelH(el))));
  if(n === el._n) return;
  if(el._rows[el._n]) el._rows[el._n].classList.remove('on');
  el._rows[n].classList.add('on'); el._n = n;
  const it = gymDraft && gymDraft.items[+el.dataset.i]; if(!it) return;
  const v = +el._rows[n].dataset.v, k = el.dataset.k, p = el.dataset.p, cur = Math.max(0, +it[k] || 0);
  it[k] = p === 'int' ? r2(v + cur - Math.floor(cur)) : p === 'frac' ? r2(Math.floor(cur) + v) : v;
  el.setAttribute('aria-valuenow', v);
  draftSave(); sessTotals();
}
function wheelTap(e, el){
  const row = e.target.closest('.wheel-row'); if(!row || !el._rows) return;
  wheelGo(el, [...el._rows].indexOf(row), true);
}
function wheelKey(e, el){
  const d = {ArrowUp: -1, ArrowDown: 1, PageUp: -5, PageDown: 5}[e.key];
  if(!d || !el._rows) return;
  e.preventDefault(); wheelGo(el, el._n + d);
}
/* a notched mouse wheel moves ~100px a click, which is three rows; step one row per notch instead.
   Trackpads and touch send small deltas and are left to native snap scrolling. */
function wheelNotch(e){
  if(e.deltaMode === 0 && Math.abs(e.deltaY) < 50) return;
  e.preventDefault(); wheelGo(this, this._n + Math.sign(e.deltaY));
}
function sessTotals(){
  const el = document.getElementById('sessTotals'); if(!el || !gymDraft) return;
  const n = gymDraft.items.length, vol = draftVol();
  el.innerHTML = `<span id="sessElapsed"></span>${n} exercise${n === 1 ? '' : 's'} · ${draftSets()} sets${vol ? ' · ' + gnum(vol) + ' kg volume' : ''}`;
  paintTick();
}
/* self-clearing tickers: the router replaces #main without telling us */
function startTick(){ clearInterval(_gymTick); _gymTick = setInterval(paintTick, 1000); paintTick(); }
function paintTick(){
  const el = document.getElementById('sessElapsed');
  if(!el){ clearInterval(_gymTick); _gymTick = null; return; }
  if(!gymDraft || !gymDraft.started || gymDraft.id){ el.textContent = draftPending() ? 'Not started · ' : ''; return; }
  const s = Math.max(0, Math.floor((Date.now() - gymDraft.started) / 1000));
  el.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') + ' · ';
}

/* ---------- rest timer ---------- */
/* the timer stores an end timestamp, not a countdown: iOS suspends intervals while the
   phone is locked, and a tick-based counter would come back frozen where it was */
const restLeft = () => _rest ? Math.max(0, Math.ceil((_rest.end - Date.now()) / 1000)) : 90;
function restStart(sec){ _rest = {end: Date.now() + sec * 1000, h: setInterval(restTick, 500)}; }
function restDing(){
  try{ navigator.vibrate && navigator.vibrate([200, 100, 200]); }catch(e){}
  try{
    const ac = window._ac || (window._ac = new (window.AudioContext || window.webkitAudioContext)());
    [0, .25].forEach(t => { const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.value = 880; g.gain.value = .15; o.connect(g); g.connect(ac.destination);
      o.start(ac.currentTime + t); o.stop(ac.currentTime + t + .18); });
  }catch(e){}
}
function restPaint(){
  const c = document.getElementById('restChip');
  if(!c){ if(_rest){ clearInterval(_rest.h); _rest = null; } return; }
  const left = restLeft();
  c.className = 'rest' + (_rest ? ' run' : '');
  c.innerHTML = `<span class="t">${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}</span>
    <button class="icon-btn" type="button" title="${_rest ? 'Stop' : 'Start'} rest timer" onclick="restToggle()">${_rest ? ICO.pause : ICO.play}</button>
    <button class="icon-btn" type="button" title="Add 30 seconds" onclick="restPlus()">+30</button>`;
}
function restToggle(){
  if(_rest){ clearInterval(_rest.h); _rest = null; }
  else { restStart(90); try{ window._ac && window._ac.resume(); }catch(e){} }
  restPaint();
}
function restPlus(){ if(_rest) _rest.end += 30000; else restStart(120); restPaint(); }
function restTick(){
  if(!document.getElementById('restChip')){ clearInterval(_rest.h); _rest = null; return; }
  if(restLeft() <= 0){
    clearInterval(_rest.h); _rest = null; restPaint();
    const c = document.getElementById('restChip');
    if(c){ c.classList.add('ding'); setTimeout(() => c.classList.remove('ding'), 1600); }
    restDing(); toast('Rest over — next set');
    return;
  }
  restPaint();
}

/* ---------- session lifecycle ---------- */
/* Start workout only opens the picker; the session clock begins when Start is pressed */
function startSession(){
  gymDraft = {date: todayStr(), notes: '', items: [], started: null};
  _exOpen = 0; draftSave(); renderSession(); openPicker();
}
function beginSession(){
  if(!gymDraft) return;
  if(!gymDraft.items.length) return toast('Pick at least one exercise first');
  gymDraft.started = Date.now(); _exOpen = 0; draftSave();
  document.removeEventListener('keydown', pickEsc);
  const bg = document.getElementById('pickBg'); if(bg) bg.remove();
  renderSession(); window.scrollTo({top: 0, behavior: 'smooth'});
  toast('Workout started');
}
function addEx(name){
  if(!gymDraft) gymDraft = {date: todayStr(), notes: '', items: [], started: null};
  const l = lastFor(name);
  const cardio = isCardio(name);
  gymDraft.items.push(l ? {ex: name, sets: l.sets, reps: l.reps, kg: l.kg}
    : cardio ? {ex: name, sets: 1, reps: 30, kg: 0} : {ex: name, sets: 3, reps: 10, kg: 0});
  draftSave();
}
function discardSession(){
  if(gymDraft && gymDraft.items.length && !confirm('Discard this session? Nothing will be saved.')) return;
  gymDraft = null; draftSave(); renderSession();
}
async function finishSession(){
  const d = gymDraft; if(!d) return;
  const rows = d.items.filter(it => it.ex).map(it => ({
    exercise: it.ex, sets: Math.max(1, +it.sets || 1), reps: +it.reps || 0, weight_kg: +it.kg || 0}));
  if(!rows.length) return toast('Add at least one exercise');
  if(!d.date) return toast('Pick a date');
  const btn = document.getElementById('finishBtn');
  if(btn){ if(btn.disabled) return; btn.disabled = true; }
  try{
    const notes = (d.notes || '').trim() || null;
    if(d.id){
      if(d.date !== d.origDate){
        const {data: clash, error: eC} = await sb.from('workouts').select('id').eq('workout_date', d.date).neq('id', d.id).limit(1);
        if(eC) return err(eC);
        if(clash && clash.length) return toast('A workout already exists on ' + fmtDate(d.date) + ' — edit that one instead');
      }
      const {error} = await sb.from('workouts').update({workout_date: d.date, notes}).eq('id', d.id);
      if(error) return err(error);
      // insert replacements first, then drop the old rows by id — a failed insert never loses data
      const {error: e2} = await sb.from('workout_sets').insert(rows.map((r, i) => ({...r, workout_id: d.id, set_number: i + 1})));
      if(e2) return err(e2);
      const oldIds = (d.oldSetIds || []).filter(Boolean);
      if(oldIds.length){
        const {error: e3} = await sb.from('workout_sets').delete().in('id', oldIds);
        if(e3) return err(e3);
      }
      gymDraft = null; draftSave();
      toast('Workout updated'); return views.gym();
    }
    // one workout per day: append to an existing session on that date
    const {data: existingRows, error: e0} = await sb.from('workouts').select('id,notes').eq('workout_date', d.date).limit(1);
    if(e0) return err(e0);
    const existing = existingRows && existingRows[0];
    let woId, offset = 0;
    if(existing){
      woId = existing.id;
      offset = (window._allSets || []).filter(s => s.workout_id === woId).length;
      if(notes && notes !== existing.notes)
        await sb.from('workouts').update({notes: existing.notes ? existing.notes + ' · ' + notes : notes}).eq('id', woId);
    } else {
      const {data: wo, error} = await sb.from('workouts').insert({workout_date: d.date, notes}).select().single();
      if(error) return err(error);
      woId = wo.id;
    }
    const {error: e2} = await sb.from('workout_sets').insert(rows.map((r, i) => ({...r, workout_id: woId, set_number: offset + i + 1})));
    if(e2) return err(e2);
    gymDraft = null; draftSave();
    toast(existing ? 'Added to ' + fmtDate(d.date) + ' session' : 'Workout saved');
    return views.gym();
  } finally { if(btn) btn.disabled = false; }
}
/* an in-progress session is never replaced silently */
function draftBusy(){
  return gymDraft && gymDraft.items.length && !confirm(gymDraft.id
    ? 'You are editing another workout — drop those changes?'
    : 'A session is in progress — replace it? Its exercises will be lost.');
}
function editWorkout(id){
  const w = (window._gymWos || []).find(w => w.id === id); if(!w) return;
  if(gymDraft && gymDraft.id === id) return window.scrollTo({top: 0, behavior: 'smooth'});
  if(draftBusy()) return;
  const ss = (window._allSets || []).filter(s => s.workout_id === id);
  gymDraft = {id, origDate: w.workout_date, date: w.workout_date, notes: w.notes || '',
    oldSetIds: ss.map(s => s.id),
    items: ss.map(s => ({ex: exCanon(s.exercise), sets: +s.sets || 1, reps: +s.reps || 0, kg: +s.weight_kg || 0}))};
  _exOpen = 0; draftSave(); renderSession(); window.scrollTo({top: 0, behavior: 'smooth'});
}
function repeatWorkout(id){
  const ss = (window._allSets || []).filter(s => s.workout_id === id);
  if(!ss.length) return toast('That session had no exercises');
  if(draftBusy()) return;
  gymDraft = {date: todayStr(), notes: '', started: null,
    items: ss.map(s => ({ex: exCanon(s.exercise), sets: +s.sets || 1, reps: +s.reps || 0, kg: +s.weight_kg || 0}))};
  _exOpen = 0; draftSave(); renderSession(); window.scrollTo({top: 0, behavior: 'smooth'});
  toast('Loaded ' + ss.length + ' exercise' + (ss.length === 1 ? '' : 's') + ' — press Start when you begin');
}
async function delWorkout(id){
  if(!confirm('Delete this workout and all its exercises? This cannot be undone.')) return;
  const {error: eS} = await sb.from('workout_sets').delete().eq('workout_id', id);
  if(eS) return err(eS);
  const {error} = await sb.from('workouts').delete().eq('id', id);
  if(error) return err(error);
  if(gymDraft && gymDraft.id === id){ gymDraft = null; draftSave(); }
  views.gym();
}

/* ---------- exercise picker ---------- */
function openPicker(){
  if(document.getElementById('pickBg')) return;
  _pickQ = ''; _pickN = gymDraft ? gymDraft.items.length : 0;
  const wait = draftPending();
  document.body.insertAdjacentHTML('beforeend', `
    <div class="sheet-bg" id="pickBg" onclick="if(event.target===this)closePicker()">
      <div class="sheet" role="dialog" aria-label="${wait ? 'Choose exercises' : 'Add exercise'}">
        <div class="sheet-head">
          <div class="top"><h3>${wait ? 'Choose exercises' : 'Add exercise'}</h3>
            <button class="icon-btn" type="button" title="Close" onclick="closePicker()">${ICO.x}</button></div>
          <input id="pickQ" placeholder="Search exercises…" autocomplete="off" enterkeyhint="search" oninput="_pickQ=this.value;paintPicker()">
          <div class="seg" id="pickSeg"></div>
        </div>
        <div class="sheet-body" id="pickBody"></div>
        <div class="sheet-foot"><span class="n" id="pickCount"></span>

            ? `<button class="btn ico" type="button" id="pickGo" onclick="beginSession()">${ICO.play}Start</button>`
            : `<button class="btn" type="button" id="pickGo" onclick="closePicker()">Done</button>`}</div>
      </div></div>`);
  document.getElementById('pickSeg').innerHTML = ['All'].concat(EX_GROUPS)
    .map(g => `<button type="button" class="${g === _pickG ? 'on' : ''}" onclick="pickGroup('${g}')">${g}</button>`).join('');
  document.addEventListener('keydown', pickEsc);

}
function pickEsc(e){ if(e.key === 'Escape') closePicker(); }
function closePicker(){
  document.removeEventListener('keydown', pickEsc);
  const bg = document.getElementById('pickBg'); if(bg) bg.remove();
  // backing out of a brand-new workout with nothing picked leaves no empty session behind
  if(draftPending() && !gymDraft.items.length){ gymDraft = null; draftSave(); return renderSession(); }
  // mid-session, open the card of the exercise that was just added
  if(gymDraft && !draftPending() && gymDraft.items.length > _pickN) _exOpen = _pickN;
  renderExList(); sessTotals();
}
function pickGroup(g){
  _pickG = g;
  [...document.querySelectorAll('#pickSeg button')].forEach(b => b.classList.toggle('on', b.textContent === g));
  paintPicker();
}
function paintPicker(){
  const body = document.getElementById('pickBody'); if(!body) return;
  const q = _pickQ.trim().toLowerCase();
  const inSession = new Set((gymDraft ? gymDraft.items : []).map(x => x.ex));
  const card = name => {
    const i = EX_CAT.findIndex(e => e[0] === name);
    return `<button class="pick${inSession.has(name) ? ' added' : ''}" type="button" onclick="pickTap(${i})">
      <span class="tick">${ICO.tick}</span>${exIcon(name)}<b>${esc(name)}</b></button>`;
  };
  let html = '';
  if(!q && _pickG === 'All'){
    const recent = recentExercises().filter(n => EX_BY_NAME[n]).slice(0, 8);
    if(recent.length) html += `<div class="pick-sec">Recent</div><div class="pick-grid">${recent.map(card).join('')}</div>`;
  }
  for(const g of (_pickG === 'All' ? EX_GROUPS : [_pickG])){
    const list = EX_CAT.filter(e => e[1] === g && (!q || e[0].toLowerCase().includes(q)));
    if(list.length) html += `<div class="pick-sec">${g}</div><div class="pick-grid">${list.map(e => card(e[0])).join('')}</div>`;
  }
  if(!html) html = `<div class="empty">Nothing matches “${esc(_pickQ)}”.<br>
    <button class="btn-ghost" type="button" style="margin-top:10px" onclick="pickCustom()">Add “${esc(_pickQ)}” as a custom exercise</button></div>`;
  body.innerHTML = html;
  const n = gymDraft ? gymDraft.items.length : 0, cnt = document.getElementById('pickCount'), go = document.getElementById('pickGo');
  if(cnt) cnt.textContent = n ? n + ' exercise' + (n === 1 ? '' : 's') + ' selected' : 'Tap the exercises you plan to do';
  if(go && draftPending()) go.disabled = !n;
}
function pickTap(i){
  const name = EX_CAT[i][0];
  const at = (gymDraft ? gymDraft.items : []).findIndex(x => x.ex === name);
  if(at >= 0){ gymDraft.items.splice(at, 1); draftSave(); toast(name + ' removed'); }
  else { addEx(name); toast(name + ' added'); }
  paintPicker();
}
function pickCustom(){
  const name = _pickQ.trim(); if(!name) return;
  addEx(name); toast(name + ' added');
  _pickQ = ''; const q = document.getElementById('pickQ'); if(q) q.value = '';
  paintPicker();
}

/* ---------- week strip, history, PRs, chart ---------- */
function renderWeek(){
  const el = document.getElementById('weekStrip'); if(!el) return;
  const dates = new Set(Object.values(window._woDates || {}));
  const today = todayStr(), t = new Date(today + 'T00:00');
  // the week starts on Sunday, like the Schedule calendar (and the Israeli working week)
  const sun = new Date(t); sun.setDate(t.getDate() - t.getDay());
  let n = 0, h = '';
  for(let i = 0; i < 7; i++){
    const d = new Date(sun); d.setDate(sun.getDate() + i);
    const s = d.toLocaleDateString('en-CA'), on = dates.has(s); if(on) n++;
    h += `<div><div class="d">${['Su','Mo','Tu','We','Th','Fr','Sa'][i]}</div>
      <div class="dot${on ? ' on' : ''}${s === today ? ' today' : ''}" title="${s}">${on ? ICO.tick : d.getDate()}</div></div>`;
  }
  el.innerHTML = `<div class="week">${h}</div>`;
  const c = document.getElementById('weekCount');
  if(c) c.textContent = n + ' session' + (n === 1 ? '' : 's');
}
function renderHistory(){
  const el = document.getElementById('woList'); if(!el) return;
  const byWo = {};
  (window._allSets || []).forEach(s => (byWo[s.workout_id] = byWo[s.workout_id] || []).push(s));
  el.innerHTML = (window._gymWos || []).length ? window._gymWos.map(w => {
    const ss = byWo[w.id] || [];
    const summary = ss.map(s => `${esc(exCanon(s.exercise))} ${setLabel(s)}`).join(' · ') || 'no exercises';
    const icos = ss.slice(0, 4).map(s => exIcon(exCanon(s.exercise))).join('');
    return `<div class="wo-row">
      ${icos ? `<div class="wo-icos">${icos}</div>` : ''}
      <div class="grow"><div class="title">${fmtDate(w.workout_date)}${w.notes ? ' · ' + esc(w.notes) : ''}</div>
        <div class="sub">${summary}</div></div>
      <div class="wo-acts">
        <button class="icon-btn" type="button" title="Repeat this session today" onclick="repeatWorkout('${w.id}')">${ICO.redo}</button>
        <button class="icon-btn" type="button" title="Edit workout" onclick="editWorkout('${w.id}')">${ICO.edit}</button>
        <button class="icon-btn danger" type="button" title="Delete workout" onclick="delWorkout('${w.id}')">${ICO.x}</button>
      </div></div>`;
  }).join('') : '<div class="empty">No workouts yet — start your first session above</div>';
}
function renderPRs(){
  const el = document.getElementById('prList'); if(!el) return;
  const dateOf = window._woDates || {}, best = {};
  (window._allSets || []).forEach(s => {
    const d = dateOf[s.workout_id]; if(!d) return;
    const n = exCanon(s.exercise);
    if(isCardio(n) || !(+s.weight_kg > 0)) return;   // records are about load: no cardio, no bodyweight-only rows
    if(!best[n] || +s.weight_kg > +best[n].weight_kg ||
      (+s.weight_kg === +best[n].weight_kg && d < best[n].date))
      best[n] = {weight_kg: s.weight_kg, reps: s.reps, date: d};
  });
  const prs = Object.entries(best).sort((a, b) => b[1].weight_kg - a[1].weight_kg);
  const fresh = d => (new Date(todayStr()) - new Date(d)) / 864e5 <= 14;
  el.innerHTML = prs.length ? prs.map(([ex, p]) => `
    <div class="row">${exIcon(ex, 'pr-ico')}<div class="grow"><div class="title">${esc(ex)}</div>
      <div class="sub">${gnum(p.weight_kg)}kg × ${p.reps} reps · ${fmtDate(p.date)}</div></div>
      ${fresh(p.date) ? '<span class="pill green">NEW PR</span>' : ''}</div>`).join('')
    : '<div class="empty">Log workouts to start setting records</div>';
}
function drawGymChart(){
  const selEl = document.getElementById('exSelect'); if(!selEl) return;
  const ex = selEl.value, metric = (document.getElementById('exMetric') || {}).value || 'max';
  const cardio = isCardio(ex);
  const mEl = document.getElementById('exMetric');
  if(mEl){ mEl.options[0].text = cardio ? 'minutes' : 'top weight'; mEl.options[1].text = cardio ? 'distance' : 'volume'; }
  const dateOf = window._woDates || {}, byDate = {};
  (window._allSets || []).filter(s => exCanon(s.exercise) === ex).forEach(s => {
    const d = dateOf[s.workout_id]; if(!d) return;
    byDate[d] = cardio
      ? (byDate[d] || 0) + (metric === 'vol' ? +s.weight_kg || 0 : +s.reps || 0)
      : metric === 'vol'
        ? (byDate[d] || 0) + (+s.sets || 1) * (+s.reps || 0) * (+s.weight_kg || 0)
        : Math.max(byDate[d] || 0, +s.weight_kg);
  });
  const labels = Object.keys(byDate).sort();
  mkChart('gymChart', {type: 'line',
    data: {labels: labels.map(fmtDate), datasets: [{label: cardio ? (metric === 'vol' ? 'Distance (km)' : 'Minutes') : metric === 'vol' ? 'Volume (kg)' : 'Top weight (kg)',
      data: labels.map(d => byDate[d]), borderColor: '#23221f', backgroundColor: 'rgba(35,34,31,.09)',
      fill: true, tension: .35, pointBackgroundColor: '#4a4741'}]},
    options: {maintainAspectRatio: false, plugins: {legend: {display: false}}, scales: {y: {beginAtZero: metric === 'vol'}}}});
}
