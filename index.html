<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atlas — Your life, organized</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2323221f'/%3E%3Cstop offset='1' stop-color='%234a4741'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M24 6 L40 42 M24 6 L8 42 M13 30 Q24 22 35 30' fill='none' stroke='url(%23g)' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  /* e-book / paper theme: near-white page, ink-black type, grey hairlines */
  --bg:#f3f2ef; --surface:#fbfaf8; --surface2:#eceae6; --border:#dcd9d3;
  --text:#1a1a18; --muted:#78756e; --accent:#23221f; --accent2:#4a4741;
  --grad:linear-gradient(135deg,#2b2a27,#45423c);
  --on-ink:#faf9f7;
  --red:#9b463a; --amber:#8a6b22; --green:#4a6a44;
  --radius:12px; --shadow:0 1px 2px rgba(26,26,24,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Space Grotesk',system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px 12px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
::placeholder{color:#a5a29b}
h2{font-size:22px;font-weight:700;letter-spacing:-.02em}
.hidden{display:none!important}

/* ---------- Auth ---------- */
#authScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;z-index:1}
.auth-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:36px 32px;box-shadow:var(--shadow);text-align:center}
.auth-card .logo{margin:0 auto 14px}
.auth-card h1{font-size:26px;font-weight:700;letter-spacing:-.03em}
.auth-card .tag{color:var(--muted);font-size:13px;margin:6px 0 24px}
.auth-card form{display:flex;flex-direction:column;gap:12px;text-align:left}
.btn{background:var(--grad);color:var(--on-ink);border:none;border-radius:10px;padding:11px 18px;font-weight:600;font-size:14px;transition:opacity .15s,transform .1s}
.btn:hover{opacity:.9}.btn:active{transform:scale(.98)}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:500}
.btn-ghost:hover{color:var(--text);border-color:var(--accent)}
.auth-switch{margin-top:18px;font-size:13px;color:var(--muted)}
.auth-switch a{color:var(--accent2);cursor:pointer;text-decoration:none;font-weight:600}
.auth-msg{font-size:13px;margin-top:12px;min-height:18px}
.auth-msg.err{color:var(--red)}.auth-msg.ok{color:var(--green)}

/* logo draw animation */
.logo path{stroke-dasharray:120;stroke-dashoffset:120;animation:draw 1.4s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* login hero: Atlas catching the world (video, multiply-blended onto the card) */
/* the wrapper must paint --surface itself: the heroIn/heroFloat animations make it an
   isolated stacking context, so the multiply below has no backdrop to blend with otherwise */
.hero-anim{position:relative;width:119px;height:200px;margin:0 auto 18px;background:var(--surface);animation:heroIn .9s ease both}
.hero-anim video,.hero-anim img{display:block;width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;pointer-events:none;filter:grayscale(1) contrast(1.08)}
.hero-anim .hero-still{display:none}
.hero-anim.settled{animation:heroFloat 7s ease-in-out infinite}
@keyframes heroIn{from{opacity:0}to{opacity:1}}
@keyframes heroFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.auth-card h1,.auth-card .tag{animation:fadeUp .8s ease 1.7s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){
  .hero-anim,.hero-anim.settled,.auth-card h1,.auth-card .tag,.logo path{animation:none!important;stroke-dashoffset:0}
  .hero-anim .hero-video{display:none}
  .hero-anim .hero-still{display:block}
}

/* ---------- Layout ---------- */
#app{min-height:100vh;position:relative;z-index:1}
main{padding:30px 36px 70px;max-width:1060px;margin:0 auto;width:100%}
.page-head img{filter:grayscale(1) contrast(1.06) brightness(1.02)}
.auth-card>img{filter:grayscale(1) contrast(1.06)}
.page-head{display:flex;align-items:center;justify-content:flex-start;margin-bottom:22px;gap:18px;flex-wrap:wrap}

/* ---------- Hub: Atlas centre, sections orbiting the circle ---------- */
/* Everything derives from --figh so the circle, the orbit radius and the stage stay
   locked together at any viewport. Each tile carries its own --tx/--ty (sin/cos of its
   angle, precomputed inline) and is placed at --R from the centre.
   tileIn is opacity-only on purpose: a transform keyframe would clobber that placement. */
#hub{min-height:100vh;display:flex;flex-direction:column;padding:28px 34px 22px;max-width:1320px;margin:0 auto;width:100%}
.hub-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.hub-greet{display:inline-block;font-size:clamp(26px,3.2vw,40px);font-weight:700;letter-spacing:-.035em;line-height:1.08;
  color:#9c988f;
  text-shadow:
    .02em .02em 0 #8b8780, .04em .04em 0 #817d76, .06em .06em 0 #77736d, .08em .08em 0 #6d6a64,
    .10em .11em .05em rgba(26,26,24,.32),
    .2em .26em .28em rgba(26,26,24,.18),
    .38em .52em .66em rgba(26,26,24,.10)}
@supports ((-webkit-background-clip:text) or (background-clip:text)){
  .hub-greet{background:linear-gradient(147deg,#c4c0b8 0%,#a9a59d 42%,#8f8b83 72%,#807c75 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent}
}
.hub-date{color:var(--muted);font-size:14px;margin-top:8px;letter-spacing:.01em}
.hub-meta{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;font-weight:600}
.hub-stage{flex:1;display:flex;align-items:center;justify-content:center;padding:10px 0 16px}
.hub-orbit{--figh:clamp(250px,min(calc(100vh - 430px),calc(96vw - 300px)),620px);--D:calc(var(--figh) * .90);--R:calc(var(--D) / 2 + 64px + var(--figh) * .07);
  position:relative;width:calc(var(--R) * 2 + 104px);height:calc(var(--R) * 2 + 104px)}
.hub-circle{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:var(--D);height:var(--D);border-radius:50%;background:var(--surface2);border:1px solid var(--border);box-shadow:0 0 0 9px var(--bg),0 0 0 10px var(--border)}
.hub-col{display:contents}
.tile{position:absolute;left:50%;top:50%;gap:10px;
  transform:translate(-50%,-50%) translate(calc(var(--R) * var(--tx)),calc(var(--R) * var(--ty)));
  display:flex;flex-direction:column;align-items:center;gap:8px;background:transparent;border:none;padding:0;
  animation:tileIn .5s ease both}
.tile .ic{width:68px;height:68px;border-radius:21px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);color:var(--accent);display:flex;align-items:center;justify-content:center;transition:background .18s,color .18s,transform .18s,border-color .18s}
.tile svg{width:26px;height:26px}
.tile b{font-size:13px;font-weight:600;color:var(--muted);transition:color .18s;text-shadow:0 0 6px var(--bg),0 0 3px var(--bg)}
.tile:hover .ic,.tile:focus-visible .ic{background:var(--grad);border-color:var(--accent);color:var(--on-ink);transform:translateY(-3px)}
.tile:hover b,.tile:focus-visible b{color:var(--text)}
.tile:active .ic{transform:translateY(-1px) scale(.97)}
.hub-col.left .tile:nth-child(1){animation-delay:.04s}
.hub-col.left .tile:nth-child(2){animation-delay:.09s}
.hub-col.left .tile:nth-child(3){animation-delay:.14s}
.hub-col.left .tile:nth-child(4){animation-delay:.19s}
.hub-col.right .tile:nth-child(1){animation-delay:.07s}
.hub-col.right .tile:nth-child(2){animation-delay:.12s}
.hub-col.right .tile:nth-child(3){animation-delay:.17s}
.hub-figure{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) translate(calc(var(--figh) * -.025),calc(var(--figh) * -.07));display:flex;align-items:center;justify-content:center;width:calc(var(--figh) * .66);height:var(--figh)}
.hub-shadow{position:absolute;left:47%;bottom:calc(var(--figh) * -.025);transform:translateX(-50%);width:calc(var(--figh) * .54);height:calc(var(--figh) * .075);border-radius:50%;background:radial-gradient(ellipse at center,rgba(26,26,24,.20),rgba(26,26,24,.08) 50%,rgba(26,26,24,0) 74%)}
.hub-figure img{position:relative;height:var(--figh);object-fit:contain;filter:grayscale(1) contrast(1.06);animation:figIn .85s ease both}
.hub-foot{display:flex;justify-content:center;font-size:10px;color:var(--muted)}
@keyframes tileIn{from{opacity:0}to{opacity:1}}
@keyframes figIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){ .tile,.hub-figure img{animation:none!important} }

/* ---------- Section shell (top bar + main) ---------- */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:4px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--border)}
.home-btn{display:flex;align-items:center;gap:9px;background:transparent;border:none;color:var(--text);font-weight:700;font-size:16px;letter-spacing:-.02em;padding:6px 9px;border-radius:10px;flex-shrink:0;transition:background .15s}
.home-btn:hover{background:var(--surface2)}
.home-btn img{height:26px;filter:grayscale(1) contrast(1.06)}
.tabs{display:flex;gap:3px;flex:1;min-width:0;overflow-x:auto;margin:0 6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:transparent;border:none;color:var(--muted);padding:8px 12px;border-radius:9px;font-size:13.5px;font-weight:600;white-space:nowrap;transition:.15s}
.tab:hover{background:var(--surface2);color:var(--text)}
.tab.active{background:var(--grad);color:var(--on-ink)}

/* ---------- Cards / grids ---------- */
.grid{display:grid;gap:16px}
.grid.cols3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.grid.cols2{grid-template-columns:repeat(auto-fit,minmax(310px,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.card h3{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px}
.stat{font-size:28px;font-weight:700;letter-spacing:-.02em}
.stat small{font-size:13px;color:var(--muted);font-weight:500}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:11px 14px}
.row .grow{flex:1;min-width:0}
.row .title{font-weight:600;font-size:14px}
.row .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.row.done .title{text-decoration:line-through;color:var(--muted)}
.icon-btn{background:transparent;border:none;color:var(--muted);padding:5px;border-radius:7px;display:flex}
.icon-btn:hover{color:var(--text);background:var(--border)}
.icon-btn.danger:hover{color:var(--red)}
.pill{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill.red{background:rgba(155,70,58,.12);color:var(--red)}
.pill.amber{background:rgba(138,107,34,.13);color:var(--amber)}
.pill.green{background:rgba(74,106,68,.12);color:var(--green)}
.pill.indigo{background:rgba(35,34,31,.08);color:var(--accent)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.empty{color:var(--muted);font-size:13.5px;padding:18px;text-align:center;border:1px dashed var(--border);border-radius:11px}
.progress-track{height:7px;background:var(--surface2);border-radius:99px;overflow:hidden}
.progress-fill{height:100%;background:var(--grad);border-radius:99px;transition:width .3s}
.chart-box{position:relative;height:240px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:11px 20px;border-radius:11px;font-size:14px;box-shadow:var(--shadow);transition:transform .25s;z-index:50}
#toast.show{transform:translateX(-50%) translateY(0)}
.checkbox{width:19px;height:19px;border-radius:6px;border:2px solid var(--border);background:transparent;flex-shrink:0;display:flex;align-items:center;justify-content:center;padding:0;position:relative}
.checkbox.checked{background:var(--grad);border-color:transparent;color:var(--on-ink)}
.btn:disabled,.btn-ghost:disabled{opacity:.55;pointer-events:none}

.lbl{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.ex-grid{display:grid;grid-template-columns:2fr .9fr .9fr 1.1fr 30px;gap:8px;align-items:center}
.ex-grid input{min-width:0}
.ex-grid .lbl{margin-bottom:0}
.sub-logo{width:28px;height:28px;border-radius:7px;flex-shrink:0;object-fit:contain;background:var(--surface)}
.sub-fallback{width:28px;height:28px;border-radius:7px;flex-shrink:0;background:var(--grad);color:var(--on-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-head h3{margin:0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dow{font-size:10px;font-weight:600;color:var(--muted);text-align:center;padding:4px 0;text-transform:uppercase}
.cal-day{aspect-ratio:1;min-height:40px;padding:2px;display:flex;align-items:center;justify-content:center;position:relative;border-radius:8px;font-size:clamp(11px,3.1vw,13px);line-height:1;cursor:pointer;border:1px solid transparent}
.cal-day:hover{background:var(--surface2)}
.cal-day.other{color:#b8b5ae}
.cal-day.today{border-color:var(--accent)}
.cal-day.selected{background:var(--grad);color:var(--on-ink)}
.cal-dot{position:absolute;bottom:4px;width:4px;height:4px;border-radius:99px;background:var(--accent)}
.cal-day.selected .cal-dot{background:var(--on-ink)}

/* mobile */
@media(max-width:760px){
  .topbar{padding:8px 12px;gap:2px}
  .home-btn{font-size:0;gap:0;padding:6px}
  .home-btn img{height:24px}
  .tab{padding:8px 10px;font-size:13px}
  #hub{padding:20px 16px 14px}
  .hub-greet{font-size:25px}
  .hub-date{font-size:13px;margin-top:5px}
  /* no room to orbit on a phone: Atlas on top with the circle behind him, tiles in two rows */
  .hub-stage{padding:6px 0 10px}
  .hub-orbit{--figh:clamp(210px,34vh,320px);width:100%;height:auto;display:flex;flex-direction:column;align-items:center;gap:18px}
  .hub-circle{top:calc(var(--figh) / 2);width:calc(var(--figh) * .95);height:calc(var(--figh) * .95);box-shadow:0 0 0 7px var(--bg),0 0 0 8px var(--border)}
  .hub-col{display:flex;flex-direction:row;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:20px 24px}
  .tile{position:static;transform:none!important}
  .hub-figure{position:relative;left:auto;top:auto;transform:none;order:0;width:auto;height:auto}
  .hub-col.left{order:1}
  .hub-col.right{order:2}
  .tile .ic{width:60px;height:60px;border-radius:18px}
  .cal-grid{gap:2px}
  .cal-day{border-radius:7px}
  .cal-dot{bottom:3px}
  .page-head{gap:12px}
  .page-head img{height:64px;margin-left:auto}
  main{padding:22px 16px 44px}
  .auth-card{padding:28px 22px;max-width:340px}
  .hero-anim{width:98px;height:165px}
  .auth-card h1{font-size:22px}
  h2{font-size:19px}
  .stat{font-size:23px}
  .row{flex-wrap:wrap}
  .row .grow{flex:1 1 140px}
  .btn-ghost{padding:7px 11px}
  .icon-btn{padding:13px;margin:-7px}
  .checkbox::after{content:'';position:absolute;inset:-11px}
  .card{padding:16px}
  .chart-box{height:200px}
  .page-head input[type=month]{max-width:150px}
}
/* seven tabs have to fit across a narrow phone */
@media(max-width:420px){ .tab{padding:8px 8px;font-size:12.5px} .hub-col{gap:14px 16px} .tile .ic{width:52px;height:52px;border-radius:16px} .tile svg{width:21px;height:21px} .tile b{font-size:11.5px} }
</style>
</head>
<body>

<!-- ============ AUTH ============ -->
<div id="authScreen">
  <div class="auth-card">
    <div class="hero-anim" id="heroAnim">
      <video class="hero-video" id="heroVideo" src="hero-atlas-catch.mp4" poster="hero-atlas-poster.png"
        width="286" height="480" autoplay muted playsinline preload="auto"
        disablepictureinpicture aria-hidden="true"
        onerror="heroFallback()"></video>
      <img class="hero-still" src="hero-atlas-poster.png" alt="Atlas catching the Earth"
        onerror="document.getElementById('heroAnim').remove();document.querySelector('.auth-card .logo').style.display='inline'">
    </div>
    <svg class="logo" style="display:none" width="56" height="56" viewBox="0 0 48 48" fill="none">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#23221f"/><stop offset="1" stop-color="#4a4741"/>
      </linearGradient></defs>
      <path d="M24 6 L40 42 M24 6 L8 42 M13 30 Q24 22 35 30" stroke="url(#lg)" stroke-width="3.5" stroke-linecap="round"/>
    </svg>
    <h1>Atlas</h1>
    <div class="tag">Your life, organized.</div>
    <form id="authForm">
      <input type="email" id="authEmail" placeholder="Email" required autocomplete="email">
      <input type="password" id="authPassword" placeholder="Password" required minlength="6" autocomplete="current-password">
      <button class="btn" type="submit" id="authSubmit">Sign in</button>
    </form>
    <div class="auth-msg" id="authMsg"></div>
    <div class="auth-switch" id="authSwitch">No account? <a onclick="toggleAuthMode()">Sign up</a></div>
    <div class="auth-switch" style="margin-top:8px"><a onclick="forgotPassword()">Forgot password?</a></div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <!-- ---------- HUB (home) ---------- -->
  <section id="hub" class="hidden">
    <div class="hub-top">
      <div>
        <div class="hub-greet" id="hubGreet">Hello</div>
        <div class="hub-date" id="hubDate"></div>
      </div>
      <div class="hub-meta">
        <span id="hubClock"></span>
        <button class="icon-btn" id="signOutHub" title="Sign out" aria-label="Sign out"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
      </div>
    </div>
    <div class="hub-stage">
     <div class="hub-orbit">
      <div class="hub-circle"></div>
      <div class="hub-col left">
        <button class="tile" data-tab="dashboard" style="--tx:-0.6691;--ty:-0.7431"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg></span><b>Dashboard</b></button>
        <button class="tile" data-tab="schedule" style="--tx:-0.9717;--ty:-0.2363"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 9h18"/></svg></span><b>Schedule</b></button>
        <button class="tile" data-tab="gym" style="--tx:-0.9356;--ty:0.353"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/></svg></span><b>Gym</b></button>
        <button class="tile" data-tab="money" style="--tx:-0.5736;--ty:0.8192"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M15 9.5c0-1.4-1.3-2.5-3-2.5s-3 1.1-3 2.5 1.3 2.2 3 2.5 3 1.1 3 2.5-1.3 2.5-3 2.5-3-1.1-3-2.5"/></svg></span><b>Money</b></button>

   been rewritten and that render's element ids no longer exist — writing into them
   threw "null is not an object". Every render takes a token and bails out if a newer
   render has started in the meantime. */
let _renderSeq = 0;
const renderStart = () => ++_renderSeq;
const stale = seq => seq !== _renderSeq;
window.addEventListener('hashchange', () => { const t = location.hash.slice(1) || 'home'; if(t !== window._curTab) go(t); });
/* 'home' is the hub — Atlas centred with the seven sections orbiting him.
   Every other tab hides the hub and swaps in the section shell (top bar + #main). */
function go(tab){
  if(tab !== 'home' && !views[tab]) tab = 'home';
  window._curTab = tab;
  location.hash = tab;
  const home = tab === 'home';
  document.getElementById('hub').classList.toggle('hidden', !home);
  document.getElementById('shell').classList.toggle('hidden', home);
  window.scrollTo(0, 0);
  // bumping the token here cancels any section render still awaiting Supabase
  if(home){ renderStart(); renderHub(); return; }
  document.querySelectorAll('.tab[data-tab]').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  views[tab]();
}

function renderCalendar(){
  const m = window._calMonth || todayStr().slice(0,7);
  window._calMonth = m;
  const [Y, M] = m.split('-').map(Number);
  const first = new Date(Y, M-1, 1);

  const byDate = {};
  (window._events||[]).forEach(e => { const d = new Date(e.starts_at).toLocaleDateString('en-CA'); (byDate[d] = byDate[d] || []).push(e); });
  let cells = '';
  for(let i = 0; i < 42; i++){
    const d = new Date(start); d.setDate(start.getDate() + i);
    const ds = d.toLocaleDateString('en-CA');
    const cls = ['cal-day', d.getMonth() !== M-1 ? 'other' : '', ds === todayStr() ? 'today' : '', ds === window._selDate ? 'selected' : ''].join(' ');

  }
  document.getElementById('calCard').innerHTML = `
    <div class="cal-head">
      <button class="btn-ghost" title="Previous month" onclick="calShift(-1)">‹</button>

}

async function saveWorkout(){
  const rows = collectExRows();
  if(!rows.length) return toast('Add at least one exercise');
  const date = woDate.value, notes = woNotes.value.trim() || null;
  if(!date) return toast('Pick a date');
  const ed = window._editWo;
  if(ed){
    if(date !== ed.workout_date){
      const {data: clash, error: eC} = await sb.from('workouts').select('id').eq('workout_date', date).neq('id', ed.id).limit(1);
      if(eC) return err(eC);
      if(clash && clash.length) return toast('A workout already exists on ' + fmtDate(date) + ' — edit that one instead');
    }
    const {error} = await sb.from('workouts').update({workout_date: date, notes}).eq('id', ed.id);
    if(error) return err(error);
    // insert the replacement sets first, then delete the old ones by id — a failed insert never loses data
    const {error: e2} = await sb.from('workout_sets').insert(rows.map((r, i) => ({...r, workout_id: ed.id, set_number: i+1})));
    if(e2) return err(e2);
    const oldIds = (ed.sets || []).map(s => s.id).filter(Boolean);
    if(oldIds.length){
      const {error: e3} = await sb.from('workout_sets').delete().in('id', oldIds);
      if(e3) return err(e3);
    }
    window._editWo = null;
    toast('Workout updated'); return views.gym();
  }
  // one workout per day: append to an existing workout on the same date (tolerate accidental duplicates — take the first)
  const {data: existingRows, error: e0} = await sb.from('workouts').select('id,notes').eq('workout_date', date).limit(1);
  if(e0) return err(e0);
  const existing = existingRows && existingRows[0];
  let woId, offset = 0;
  if(existing){
    woId = existing.id;
    offset = (window._gymSets || []).filter(s => s.workout_id === woId).length;
    if(notes && notes !== existing.notes)
      await sb.from('workouts').update({notes: existing.notes ? existing.notes + ' · ' + notes : notes}).eq('id', woId);
  } else {
    const {data: wo, error} = await sb.from('workouts').insert({workout_date: date, notes}).select().single();
    if(error) return err(error);
    woId = wo.id;
  }
  const {error: e2} = await sb.from('workout_sets').insert(rows.map((r, i) => ({...r, workout_id: woId, set_number: offset + i + 1})));
  e2 ? err(e2) : (toast(existing ? 'Added to ' + fmtDate(date) + ' workout' : 'Workout saved'), views.gym());
}

/* ---- PDF statement import ---- */
function fixHeb(s){
  const heb = /[֐-׿]/, out = [], run = [];
  const flush = () => { if(run.length){ out.push(...run.map(t => [...t].reverse().join('')).reverse()); run.length = 0; } };
  s.split(/\s+/).forEach(t => { if(heb.test(t)) run.push(t); else { flush(); out.push(t); } });
  flush(); return out.join(' ');
}
const CAT_RULES = [
  ['Transport', /אנרגיה|דלק|סונול|רכב|תחבורה|חניו|חניה|פנגו|GETT|נסיע/i],
  ['Groceries', /מזון|סופר|מרקט|חקלאית|שוק/],
  ['Food', /מסעד|קפה|בורגר|פיצה/],
  ['Health', /כושר|פארם|בריאות|מרפא|רפוא/],
  ['Shopping', /טיפוח|יופי|אופנה|מספרה|ביגוד|מוצרי/],
  ['Bills', /מוסדות|תקשורת|ביטוח|עיריי|מחשבים|חשמל|מים/],
  ['Fun', /תיירות|פנאי|בילוי|מלון|קולנוע/],
];
const IMP_NOISE = /^(מזהה|כרטיס|Apple|Pay|הוראת|קבע|לא|ב-|-ב|ארצות|הברית\.?|מ|-|\$|₪|\d{1,4}|\d+\/\d+)$/;
async function parseStatement(file){
  const pdf = await pdfjsLib.getDocument({data: await file.arrayBuffer()}).promise;
  let all = '', txs = [];
  const pages = [];
  for(let p = 1; p <= pdf.numPages; p++){
    const tc = await (await pdf.getPage(p)).getTextContent();
    // pdf.js may split text into per-character items: rebuild lines by y-cluster, then join by x with gap detection
    const its = tc.items.filter(i => i.str.trim() && i.transform[4] >= 140);
    its.sort((a,b) => b.transform[5] - a.transform[5] || a.transform[4] - b.transform[4]);
    const clusters = []; let cur = null, curY = null;
    its.forEach(it => {
      if(curY === null || Math.abs(it.transform[5] - curY) > 2.5){ cur = []; clusters.push(cur); curY = it.transform[5]; }
      cur.push(it);
    });
    const lines = clusters.map(items => {
      items.sort((a,b) => a.transform[4] - b.transform[4]);
      let s = '', prevEnd = null;
      items.forEach(it => {
        const x = it.transform[4];
        if(prevEnd !== null && x - prevEnd > 2) s += ' ';
        s += it.str; prevEnd = x + (it.width || 0);
      });
      return s;
    });
    pages.push(lines); all += lines.join('\n');
  }
  // detect whether Hebrew came out visually reversed (e.g. "ןוזמ" instead of "מזון")
  const reversed = ((all.match(/ןוזמ|תודעסמ|ההזמ|סיטרכ|ךיראת/g)||[]).length) >= ((all.match(/מזון|מסעדות|מזהה|כרטיס|תאריך/g)||[]).length);
  pages.flat().forEach(raw => {
    const line = reversed ? fixHeb(raw) : raw;
    const dm = line.match(/(\d{2})\/(\d{2})\/(\d{4})/);
    const ams = [...raw.matchAll(/₪\s*([\d,]+\.\d{2})/g)];
    if(!dm || !ams.length) return;
    const [, dd, mm, yyyy] = dm;
    if(+mm < 1 || +mm > 12 || +yyyy < 2020 || +yyyy > 2035) return;
    const desc = line.replace(/₪\s*[\d,]+\.\d{2}/g, '').replace(/\$\s*[\d,]+\.\d{2}/g, '')
      .replace(/\d{2}\/\d{2}\/\d{2,4}/g, '').split(/\s+/).filter(t => t && !IMP_NOISE.test(t)).join(' ').slice(0, 60).trim();
    txs.push({spent_at: `${yyyy}-${mm}-${dd}`, amount: +ams[0][1].replace(/,/g, ''),
      category: (CAT_RULES.find(([, re]) => re.test(line)) || ['Other'])[0], description: desc || 'Imported charge'});
  });
  return txs;
}
async function handleStatement(files){
  if(!files || !files.length) return;
  const pv = document.getElementById('importPreview');
  pv.innerHTML = '<div class="empty">Reading PDF…</div>';
  try{
    let txs = [];
    for(const f of files) txs = txs.concat(await parseStatement(f));
    if(!txs.length){ pv.innerHTML = '<div class="empty">No charges recognized in this PDF</div>'; return; }
    txs.sort((a,b) => a.spent_at.localeCompare(b.spent_at));
    const {data: existing, error} = await sb.from('expenses').select('spent_at,amount')
      .gte('spent_at', txs[0].spent_at).lte('spent_at', txs[txs.length-1].spent_at);
    if(error) return err(error);
    const have = {};
    (existing||[]).forEach(e => { const k = e.spent_at + '|' + (+e.amount).toFixed(2); have[k] = (have[k]||0) + 1; });
    txs.forEach(t => { const k = t.spent_at + '|' + t.amount.toFixed(2); if(have[k] > 0){ have[k]--; t.dup = true; } });
    window._parsedTxs = txs;
    const news = txs.filter(t => !t.dup).length;
    pv.innerHTML = `<div style="margin:12px 0 8px;font-size:13.5px">Found <b>${txs.length}</b> charges · <b>${news}</b> new · ${txs.length - news} already logged</div>
      <div class="list" style="max-height:320px;overflow:auto">` + txs.map((t,i) => `
      <div class="row" style="${t.dup ? 'opacity:.55' : ''}">
        ${t.dup ? '<span class="pill indigo">already logged</span>' : `<input type="checkbox" id="imp${i}" checked style="width:auto" title="Untick to skip this charge">`}
        <div class="grow"><div class="title">${NIS(t.amount)}
          ${t.dup ? `<span class="pill indigo" style="margin-left:6px">${t.category}</span>`
            : `<select id="impcat${i}" title="Category — fix the guess before importing" style="width:auto;display:inline-block;padding:3px 6px;font-size:12px;margin-left:6px">${CATS.map(c => `<option${c === t.category ? ' selected' : ''}>${c}</option>`).join('')}</select>`}</div>
        <div class="sub">${esc(t.description)} · ${fmtDate(t.spent_at)}</div></div>
      </div>`).join('') + `</div>
      ${news ? `<button class="btn" style="margin-top:12px" onclick="importParsed(this)">Add ${news} expenses</button>` : ''}`;
  }catch(e){ err(e); pv.innerHTML = '<div class="empty">Could not read this PDF — ' + esc(e.message || e) + '</div>'; }
}
async function importParsed(btn){
  if(btn){ if(btn.disabled) return; btn.disabled = true; }
  try{
    const rows = (window._parsedTxs || []).map((t,i) => (!t.dup && document.getElementById('imp'+i)?.checked)
      ? {spent_at: t.spent_at, amount: t.amount, category: document.getElementById('impcat'+i)?.value || t.category, description: t.description} : null).filter(Boolean);

function drawBurnChart(rows, budget, month){
  const [Y, M] = month.split('-').map(Number);
  const dim = new Date(Y, M, 0).getDate();
  const daily = Array(dim).fill(0);
  rows.forEach(r => { daily[+r.spent_at.slice(8,10) - 1] += +r.amount; });
  let run = 0; const cum = daily.map(v => run += v);
  const isCur = todayStr().slice(0,7) === month;
  const lastDay = isCur ? +todayStr().slice(8,10) : dim;
  const datasets = [{label: 'Spent so far', data: cum.map((v,i) => i < lastDay ? v : null),
    borderColor: '#23221f', backgroundColor: 'rgba(35,34,31,.09)', fill: true, tension: .25, pointRadius: 0, borderWidth: 2}];
  if(isCur && lastDay >= 2 && lastDay < dim){
    const rate = cum[lastDay-1] / lastDay;
    datasets.push({label: 'Projected at current pace', data: Array.from({length: dim}, (_,i) => i < lastDay-1 ? null : +(cum[lastDay-1] + rate*(i-lastDay+1)).toFixed(0)),
      borderColor: '#9b463a', borderDash: [3,4], pointRadius: 0, borderWidth: 1.5, fill: false});
    window._projSpend = cum[lastDay-1] + rate*(dim-lastDay);
  } else window._projSpend = null;
  if(budget > 0) datasets.push({label: 'Ideal pace to budget', data: Array.from({length: dim}, (_,i) => +(budget*(i+1)/dim).toFixed(0)),
    borderColor: '#8a6b22', borderDash: [5,4], pointRadius: 0, borderWidth: 1.5, fill: false});
  mkChart('burnChart', {type: 'line', data: {labels: Array.from({length: dim}, (_,i) => i+1), datasets},
    options: {maintainAspectRatio: false, interaction: {mode: 'index', intersect: false},
      plugins: {legend: {labels: {boxWidth: 18}}}, scales: {y: {beginAtZero: true}}}});
}

function choreDueDays(c){
  if(!c.last_done) return 0;
  const next = new Date(c.last_done + 'T00:00'); next.setDate(next.getDate() + c.frequency_days);
  return Math.round((next - new Date(todayStr() + 'T00:00')) / 864e5);
}
function chorePill(c){
  const d = choreDueDays(c);
  if(d < 0) return `<span class="pill red">Overdue ${-d}d</span>`;
  if(d === 0) return `<span class="pill amber">Due today</span>`;
  return `<span class="pill green">in ${d}d</span>`;
}

      </div>
      ${nextOpen ? `<div style="font-size:12.5px;color:var(--muted);margin-bottom:10px">Next up: ${monthLabel(nextOpen.month)} · ${NIS(nextOpen.amount)}</div>` : ''}
      <div class="list" id="rentList">${ms.length ? ms.map(rentRow).join('') : '<div class="empty">No months yet</div>'}</div>
    </div>`;
}
function rentPill(m){
  const cur = monthKey(todayStr());
  if(m.claimed) return `<span class="pill green">Cashed${m.claimed_on ? ' ' + fmtDate(m.claimed_on) : ''}</span>`;
  if(m.month < cur) return `<span class="pill red">Not cashed</span>`;
  if(m.month === cur) return `<span class="pill amber">This month</span>`;
  return `<span class="pill indigo">Upcoming</span>`;
}
function rentRow(m){
  if(window._editRM === m.id) return `
    <div class="row" style="flex-wrap:wrap;align-items:flex-end">
      <div style="flex:1 1 100%;font-weight:600;font-size:14px">${monthLabel(m.month)}</div>
      <div style="flex:1 1 110px"><label class="lbl" for="rmAmt">Amount ₪</label><input type="number" step="0.01" inputmode="decimal" id="rmAmt" value="${m.amount}"></div>
      <div style="flex:1 1 110px"><label class="lbl" for="rmChk">Check no.</label><input id="rmChk" value="${esc(m.check_no || '')}"></div>
      <div style="flex:1 1 140px"><label class="lbl" for="rmDate">Cashed on</label><input type="date" id="rmDate" value="${m.claimed_on || ''}"></div>
      <div style="display:flex;gap:8px">
        <button class="btn" onclick="saveRentMonth('${m.id}')">Save</button>
        <button class="btn-ghost" onclick="window._editRM=null;renderLease()">Cancel</button>
      </div>
      <div style="flex:1 1 100%;font-size:12px;color:var(--muted)">Clear the date to un-mark the check as cashed.</div>
    </div>`;
  return `
    <div class="row">
      <button class="checkbox ${m.claimed ? 'checked' : ''}" title="${m.claimed ? 'Mark as not cashed' : 'Mark as cashed'}" onclick="toggleClaim('${m.id}')">${
        m.claimed ? '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M4 12.5l5.5 5.5L20 7"/></svg>' : ''}</button>
      <div class="grow"><div class="title">${monthLabel(m.month)}</div>
        <div class="sub">${NIS(m.amount)}${m.check_no ? ' · check ' + esc(m.check_no) : ''}</div></div>
      ${rentPill(m)}
      <button class="icon-btn" title="Edit month" onclick="window._editRM='${m.id}';renderLease()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21l4-1L20 7l-3-3L4 17l-1 4zM14 5l3 3"/></svg></button>
    </div>`;
}
async function addLease(){
  const start = lsStart.value; if(!start) return toast('Pick the first month');
  const n = Math.max(1, Math.min(60, +lsMonths.value || 12));
  const rent = +lsRent.value || 0;
  const {data, error} = await sb.from('rent_leases').insert({
    landlord: lsLandlord.value.trim() || null,
    address: lsAddress.value.trim() || null,
    start_month: start + '-01', months: n, monthly_rent: rent,
  }).select().single();
  if(error) return err(error);
  const rows = Array.from({length: n}, (_, i) => ({lease_id: data.id, month: addMonths(start + '-01', i), amount: rent}));
  const {error: e2} = await sb.from('rent_months').insert(rows);
  if(e2) return err(e2);
  toast('Lease created — ' + n + ' months');
  views.rent();
}
async function toggleClaim(id){
  // optimistic: flip locally and repaint just the lease block, so the meter charts aren't rebuilt
  const m = (window._rentMonths || []).find(x => x.id === id); if(!m) return;
  const prev = {claimed: m.claimed, claimed_on: m.claimed_on};
  m.claimed = !m.claimed;
  m.claimed_on = m.claimed ? todayStr() : null;
  renderLease();
  const {error} = await sb.from('rent_months').update({claimed: m.claimed, claimed_on: m.claimed_on}).eq('id', id);
  if(error){ Object.assign(m, prev); renderLease(); return err(error); }
  toast(monthLabel(m.month) + (m.claimed ? ' marked cashed' : ' un-marked'));
}
async function saveRentMonth(id){
  const m = (window._rentMonths || []).find(x => x.id === id); if(!m) return;
  const patch = {
    amount: +rmAmt.value || 0,
    check_no: rmChk.value.trim() || null,
    claimed_on: rmDate.value || null,
    claimed: !!rmDate.value,                    // the cashed date is the source of truth
  };
  const {error} = await sb.from('rent_months').update(patch).eq('id', id);
  if(error) return err(error);
  Object.assign(m, patch);
  window._editRM = null;
  renderLease();
  toast(monthLabel(m.month) + ' updated');
}
async function extendLease(){
  const L = window._lease, ms = window._rentMonths;
  if(!L || !ms.length) return;
  const last = ms[ms.length - 1];
  const amount = Number(last.amount) || Number(L.monthly_rent) || 0;
  const rows = Array.from({length: 12}, (_, i) => ({lease_id: L.id, month: addMonths(last.month, i + 1), amount}));
  const {error} = await sb.from('rent_months').insert(rows);
  if(error) return err(error);
  await sb.from('rent_leases').update({months: ms.length + 12}).eq('id', L.id);
  toast('Added 12 months at ' + NIS(amount));
  views.rent();
}
async function deleteLease(){
  const L = window._lease; if(!L) return;
  if(!confirm('Delete this lease and every month tracked under it? This cannot be undone. Meter readings are kept.')) return;
  const {error} = await sb.from('rent_leases').delete().eq('id', L.id);
  error ? err(error) : views.rent();
}

/* ---- utility meters ---- */
function meterSeries(kind){
  const rows = (window._meters || []).filter(r => r.kind === kind);   // already sorted by read_on
  return rows.map((r, i) => {
    const p = rows[i - 1];
    const used = p ? Number(r.reading) - Number(p.reading) : null;
    const days = p ? Math.max(1, Math.round((new Date(r.read_on + 'T00:00') - new Date(p.read_on + 'T00:00')) / 864e5)) : null;
    return Object.assign({}, r, {used, days, perDay: used == null ? null : used / days});
  });
}
function renderMeters(){
  const el = document.getElementById('meterBlock'); if(!el) return;
  el.innerHTML = `<div class="grid cols2">${Object.keys(METERS).map(meterCard).join('')}</div>`;
  drawMeterCharts();
}
function meterCard(kind){
  const M = METERS[kind], s = meterSeries(kind), latest = s[s.length - 1];
  const recent = s.slice(-6).reverse();
  const head = latest
    ? `<div class="stat">${fmtNum(latest.reading)} <small>${M.unit}</small></div>
       <div style="font-size:12.5px;color:var(--muted);margin-top:5px">read ${fmtDate(latest.read_on)}${
         latest.used == null ? ' · first reading'
         : latest.used < 0 ? ' · <span style="color:var(--red)">lower than the previous reading</span>'
         : ` · <span style="color:var(--text);font-weight:600">+${fmtNum(latest.used)} ${M.unit}</span> over ${latest.days}d (${fmtNum(latest.perDay)}/day)`}</div>`
    : `<div class="empty" style="padding:14px">No readings yet</div>`;
  return `<div class="card">
    <h3>${M.label} meter</h3>
    ${head}
    <form onsubmit="submitGuard(event, () => addReading('${kind}'))" style="margin-top:14px">
      <div class="form-grid">
        <div><label class="lbl" for="rd_${kind}_date">Date</label><input type="date" id="rd_${kind}_date" value="${todayStr()}"></div>
        <div><label class="lbl" for="rd_${kind}_val">Reading (${M.unit})</label><input type="number" step="0.01" inputmode="decimal" enterkeyhint="done" id="rd_${kind}_val" placeholder="meter count"></div>
      </div>
      <button class="btn" type="submit">Log reading</button>
    </form>
    ${s.filter(r => r.used > 0).length >= 2 ? `<div class="chart-box" style="height:170px;margin-top:16px"><canvas id="${M.chart}"></canvas></div>` : ''}
    <div class="list" style="margin-top:14px">${recent.length ? recent.map(r => `
      <div class="row"><div class="grow"><div class="title">${fmtNum(r.reading)} ${M.unit}</div>
        <div class="sub">${fmtDate(r.read_on)}${r.used == null ? '' : r.used < 0 ? ' · reading dropped' : ` · +${fmtNum(r.used)} in ${r.days}d`}</div></div>
        <button class="icon-btn danger" title="Delete reading" onclick="delReading('${r.id}')">✕</button></div>`).join('')
      : '<div class="empty">Log the meter count to start tracking usage</div>'}</div>
  </div>`;
}
async function addReading(kind){
  const dateEl = document.getElementById('rd_' + kind + '_date'), valEl = document.getElementById('rd_' + kind + '_val');
  if(!dateEl || !valEl) return;
  if(!dateEl.value) return toast('Pick the reading date');
  if(valEl.value === '' || isNaN(+valEl.value)) return toast('Enter the meter count');
  const {error} = await sb.from('meter_readings').insert({kind, read_on: dateEl.value, reading: +valEl.value});
  if(error) return err(error);
  toast(METERS[kind].label + ' reading saved');
  views.rent();
}
async function delReading(id){
  if(!confirm('Delete this meter reading? This cannot be undone.')) return;
  const {error} = await sb.from('meter_readings').delete().eq('id', id);
  error ? err(error) : views.rent();
}
function drawMeterCharts(){
  Object.keys(METERS).forEach(kind => {
    const M = METERS[kind];
    const s = meterSeries(kind).filter(r => r.used > 0);   // negative deltas mean a swapped/rolled meter — skip
    if(s.length < 2) return;
    mkChart(M.chart, {
      type: 'bar',
      data: {labels: s.map(r => fmtDate(r.read_on)), datasets: [{label: M.unit, data: s.map(r => r.used), backgroundColor: '#4a4741', borderRadius: 5}]},
      options: {maintainAspectRatio: false, plugins: {legend: {display: false}, tooltip: {callbacks: {
        label: c => `${fmtNum(c.parsed.y)} ${M.unit} over ${s[c.dataIndex].days}d · ${fmtNum(s[c.dataIndex].perDay)}/day`}}},
        scales: {y: {beginAtZero: true}}}
    });
  });
}
