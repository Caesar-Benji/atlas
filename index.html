  const by = {};
  all.filter(x => +x.amount > 0 && x.merchant_key).forEach(x => {
    const v = by[x.merchant_key] || (by[x.merchant_key] = {name: x.description || x.merchant, cat: x.category, months: {}, dates: []});
    const m = x.spent_at.slice(0, 7);
    v.months[m] = (v.months[m] || 0) + +x.amount;
    v.dates.push(x.spent_at);
  });
  return Object.entries(by).map(([key, v]) => {
    const vals = Object.values(v.months), n = vals.length;
    const lo = Math.min(...vals), hi = Math.max(...vals);
    return {key, name: v.name, cat: v.cat, months: n, lo, hi,
      avg: vals.reduce((a, b) => a + b, 0) / n,
      last: v.dates.sort().pop(),
      steady: n >= 5 && hi <= lo * 1.35};
  }).filter(x => x.steady).sort((a, b) => b.avg - a.avg);
}

/* Lessons learned — computed from the data every render, so they can't go stale.
   Each generator returns null when it has nothing honest to say. */
function moneyInsights(all){
  const pos = all.filter(x => +x.amount > 0);
  if(pos.length < 20) return [];
  const tot = pos.reduce((s, x) => s + +x.amount, 0);
  const byMonth = {};
  pos.forEach(x => { const m = x.spent_at.slice(0, 7); byMonth[m] = (byMonth[m] || 0) + +x.amount; });
  const ms = completeMonths(Object.keys(byMonth).sort(), pos);
  const out = [];

  if(ms.length >= 6){
    const h = Math.floor(ms.length / 2);
    const older = ms.slice(0, h).reduce((s, m) => s + byMonth[m], 0);
    const recent = ms.slice(-h).reduce((s, m) => s + byMonth[m], 0);
    const d = older ? Math.round((recent - older) / older * 100) : 0;
    if(Math.abs(d) >= 8) out.push({w: 100, tone: d > 0 ? 'warn' : 'good', ico: 'trend',
      t: `Spending is ${d > 0 ? 'up' : 'down'} ${Math.abs(d)}%`,
      b: `The last ${h} months came to ${NIS(recent)}, against ${NIS(older)} for the ${h} before.`});
  }
  const fx = fixedCommitments(all);
  if(fx.length){
    const per = fx.reduce((s, f) => s + f.avg, 0);
    out.push({w: 90, tone: 'neutral', ico: 'lock',
      t: `${NIS(per)} a month leaves before you buy anything`,
      b: `${fx.length} standing commitments — ${fx.slice(0, 3).map(f => bidi(f.name)).join(', ')}${fx.length > 3 ? ' and others' : ''} — or ${NIS(per * 12)} a year.`});
  }
  const byCat = {};
  pos.forEach(x => byCat[x.category] = (byCat[x.category] || 0) + +x.amount);
  // 'Other' is the leftovers bucket, not a spending habit — naming it as the biggest
  // category is noise, so it is excluded from this insight
  const top = Object.entries(byCat).filter(([c]) => c !== 'Other').sort((a, b) => b[1] - a[1])[0];
  if(top && pct(top[1], tot) >= 18) out.push({w: 80, tone: 'neutral', ico: 'pie',
    t: `${top[0]} is ${pct(top[1], tot)}% of everything`,
    b: `${NIS(top[1])} across the period — your largest single category by a clear margin.`});

  const unc = pos.filter(x => x.category === 'Other');
  if(unc.length && pct(unc.reduce((s,x)=>s+ +x.amount,0), tot) >= 12) out.push({w: 75, tone: 'neutral', ico: 'pie',
    t: `${pct(unc.reduce((s,x)=>s+ +x.amount,0), tot)}% of your spend is still uncategorised`,
    b: `${NIS(unc.reduce((s,x)=>s+ +x.amount,0))} across ${unc.length} charges. The panel below files a whole merchant in one go.`});

  const small = pos.filter(x => +x.amount < 50);
  if(small.length >= 20){
    const st = small.reduce((s, x) => s + +x.amount, 0);
    out.push({w: 70, tone: 'warn', ico: 'drip',
      t: `${small.length} charges under ₪50 add up to ${NIS(st)}`,
      b: `That's ${pct(small.length, pos.length)}% of your transactions and ${pct(st, tot)}% of the money — individually none of them feel like a decision.`});
  }
  const byMer = {};
  pos.forEach(x => { const k = x.merchant_key || x.description; if(!k) return;
    const v = byMer[k] || (byMer[k] = {n: 0, s: 0, name: x.description}); v.n++; v.s += +x.amount; });
  const freq = Object.values(byMer).sort((a, b) => b.n - a.n)[0];
  if(freq && freq.n >= 10) out.push({w: 60, tone: 'neutral', ico: 'repeat',
    t: `${bidi(freq.name)} — ${freq.n} visits`,
    b: `${NIS(freq.s)} in total, averaging ${NIS(freq.s / freq.n)} a time. Your most frequent merchant.`});

  // a single expensive week (a trip) reads very differently from steady spending
  const byDay = {};
  pos.forEach(x => byDay[x.spent_at] = (byDay[x.spent_at] || 0) + +x.amount);
  const days = Object.keys(byDay).sort();
  let best = null;
  for(let i = 0; i < days.length; i++){
    const end = new Date(days[i] + 'T00:00'); end.setDate(end.getDate() + 7);   // a 7-day window
    const win = days.filter(d => d >= days[i] && new Date(d + 'T00:00') < end);
    const s = win.reduce((a, d) => a + byDay[d], 0);
    if(!best || s > best.s) best = {s, from: days[i], to: win[win.length - 1]};
  }
  const avgMonth = ms.length ? ms.reduce((s, m) => s + byMonth[m], 0) / ms.length : tot;
  if(best && best.s > avgMonth * 0.6) out.push({w: 55, tone: 'neutral', ico: 'peak',
    t: `Your most expensive week cost ${NIS(best.s)}`,
    b: `${fmtDate(best.from)} to ${fmtDate(best.to)} — about ${Math.round(best.s / avgMonth * 100)}% of a typical month, in one stretch.`});

  // a recurring charge that quietly grew (usually a USD-priced subscription)
  fx.forEach(f => {
    const rows = all.filter(x => x.merchant_key === f.key && +x.amount > 0).sort((a, b) => a.spent_at.localeCompare(b.spent_at));
    if(rows.length < 5) return;
    const first = +rows[0].amount, last = +rows[rows.length - 1].amount;
    if(first > 0 && last > first * 1.08) out.push({w: 50, tone: 'warn', ico: 'up',
      t: `${bidi(f.name)} crept up ${Math.round((last - first) / first * 100)}%`,
      b: `${NIS(first)} → ${NIS(last)} over the period without you doing anything. Usually a price set in dollars.`});
  });
  const refunds = all.filter(x => +x.amount < 0);
  if(refunds.length) out.push({w: 40, tone: 'good', ico: 'back',
    t: `${NIS(Math.abs(refunds.reduce((s, x) => s + +x.amount, 0)))} came back`,
    b: `${refunds.length} refund${refunds.length === 1 ? '' : 's'} landed in the period — already netted off the totals above.`});

  return out.sort((a, b) => b.w - a.w).slice(0, 6);
}

/* Months that aren't fully covered by the data distort averages and trends:
   the current month is always partial, and the first month of history usually is too. */
function completeMonths(months, all){
  const cur = todayStr().slice(0,7);
  const first = months[0];
  const firstDay = first ? Math.min(...all.filter(x => x.spent_at.startsWith(first)).map(x => +x.spent_at.slice(8,10))) : 1;
  return months.filter(m => m !== cur && !(m === first && firstDay > 5));
}

function statTile(label, value, sub, tone){
  return `<div class="mstat"><div class="lbl">${label}</div><div class="v">${value}</div>
    <div class="s${tone?' '+tone:''}">${sub || ''}</div></div>`;
}
function renderMoStats(all, shown, scope, month){
  const el = document.getElementById('moStats'); if(!el) return;
  // net of refunds, the same basis as the month total and the budget bar
  const byMonth = {};
  all.forEach(x => { const m = x.spent_at.slice(0,7); byMonth[m] = (byMonth[m]||0) + +x.amount; });
  const ms = Object.keys(byMonth).sort();
  const full = completeMonths(ms, all);
  const avg = full.length ? full.reduce((s,m) => s + byMonth[m], 0) / full.length : 0;
  const cur = shown.reduce((s,x) => s + +x.amount, 0);
  const prevM = (() => { const d = new Date(month+'-01T00:00'); d.setMonth(d.getMonth()-1); return d.toLocaleDateString('en-CA').slice(0,7); })();
  const prev = byMonth[prevM] || 0;
  const d = prev ? Math.round((cur - prev)/prev*100) : null;
  const byCat = {}; shown.forEach(x => byCat[x.category] = (byCat[x.category]||0) + +x.amount);
  const top = Object.entries(byCat).sort((a,b) => b[1]-a[1])[0];
  const partial = scope !== 'year' && month === todayStr().slice(0,7);
  el.innerHTML = [
    statTile(scope==='year' ? 'All time' : (partial ? 'This month so far' : 'That month'), NIS(cur),
      scope==='year' ? `${ms.length} months of history`
        : (partial ? `day ${new Date().getDate()} — month still running`
           : (d===null ? '' : `${d>0?'▲':'▼'} ${Math.abs(d)}% vs ${new Date(prevM+'-01T00:00').toLocaleDateString('en-GB',{month:'short'})}`)),
      (scope==='year'||partial||d===null) ? '' : (d>0 ? 'warn' : 'good')),
    statTile('Average month', NIS(avg), full.length ? `over ${full.length} full month${full.length === 1 ? '' : 's'}` : 'no full month yet'),
    statTile('Charges', shown.length, scope==='year' ? `${Object.keys(byCat).length} categories` : (partial ? 'this month' : 'that month')),
    statTile('Biggest slice', top ? top[0] : '—', top ? `${NIS(top[1])} · ${pct(top[1], cur)}%` : ''),
  ].join('');
}

/* ---- PDF statement import ---- */
function fixHeb(s){
  const heb = /[֐-׿]/, out = [], run = [];
  const flush = () => { if(run.length){ out.push(...run.map(t => [...t].reverse().join('')).reverse()); run.length = 0; } };
  s.split(/\s+/).forEach(t => { if(heb.test(t)) run.push(t); else { flush(); out.push(t); } });
  flush(); return out.join(' ');
}
const CAT_RULES = [
  ['Transport', /אנרגיה|דלק|סונול|רכב|תחבורה|חניו|חניה|פנגו|GETT|נסיע/i],
  ['Groceries', /מזון|סופר|מרקט|חקלאית|שוק/],
  ['Food', /מסעד|קפה|בורגר|פיצה/],
  ['Health', /כושר|פארם|בריאות|מרפא|רפוא/],
  ['Shopping', /טיפוח|יופי|אופנה|מספרה|ביגוד|מוצרי/],
  ['Bills', /מוסדות|תקשורת|ביטוח|עיריי|מחשבים|חשמל|מים/],
  ['Fun', /תיירות|פנאי|בילוי|מלון|קולנוע/],
];
const IMP_NOISE = /^(מזהה|כרטיס|Apple|Pay|הוראת|קבע|לא|ב-|-ב|ארצות|הברית\.?|מ|-|\$|₪|\d{1,4}|\d+\/\d+)$/;
async function parseStatement(file){
  const pdf = await pdfjsLib.getDocument({data: await file.arrayBuffer()}).promise;
  let all = '', txs = [];
  const pages = [];
  for(let p = 1; p <= pdf.numPages; p++){
    const tc = await (await pdf.getPage(p)).getTextContent();
    // pdf.js may split text into per-character items: rebuild lines by y-cluster, then join by x with gap detection
    const its = tc.items.filter(i => i.str.trim() && i.transform[4] >= 140);
    its.sort((a,b) => b.transform[5] - a.transform[5] || a.transform[4] - b.transform[4]);
    const clusters = []; let cur = null, curY = null;
    its.forEach(it => {
      if(curY === null || Math.abs(it.transform[5] - curY) > 2.5){ cur = []; clusters.push(cur); curY = it.transform[5]; }
      cur.push(it);
    });
    const lines = clusters.map(items => {
      items.sort((a,b) => a.transform[4] - b.transform[4]);
      let s = '', prevEnd = null;
      items.forEach(it => {
        const x = it.transform[4];
        if(prevEnd !== null && x - prevEnd > 2) s += ' ';
        s += it.str; prevEnd = x + (it.width || 0);
      });
      return s;
    });
    pages.push(lines); all += lines.join('\n');
  }
  // detect whether Hebrew came out visually reversed (e.g. "ןוזמ" instead of "מזון")
  const reversed = ((all.match(/ןוזמ|תודעסמ|ההזמ|סיטרכ|ךיראת/g)||[]).length) >= ((all.match(/מזון|מסעדות|מזהה|כרטיס|תאריך/g)||[]).length);
  pages.flat().forEach(raw => {
    const line = reversed ? fixHeb(raw) : raw;
    const dm = line.match(/(\d{2})\/(\d{2})\/(\d{4})/);
    const ams = [...raw.matchAll(/₪\s*([\d,]+\.\d{2})/g)];
    if(!dm || !ams.length) return;
    const [, dd, mm, yyyy] = dm;
    if(+mm < 1 || +mm > 12 || +yyyy < 2020 || +yyyy > 2035) return;
    const desc = line.replace(/₪\s*[\d,]+\.\d{2}/g, '').replace(/\$\s*[\d,]+\.\d{2}/g, '')
      .replace(/\d{2}\/\d{2}\/\d{2,4}/g, '').split(/\s+/).filter(t => t && !IMP_NOISE.test(t)).join(' ').slice(0, 60).trim();
    txs.push({spent_at: `${yyyy}-${mm}-${dd}`, amount: +ams[0][1].replace(/,/g, ''),
      category: (CAT_RULES.find(([, re]) => re.test(line)) || ['Other'])[0], description: desc || 'Imported charge'});
  });
  return txs;
}
async function handleStatement(files){
  if(!files || !files.length) return;
  const pv = document.getElementById('importPreview');
  pv.innerHTML = '<div class="empty">Reading PDF…</div>';
  try{
    let txs = [];
    for(const f of files) txs = txs.concat(await parseStatement(f));
    if(!txs.length){ pv.innerHTML = '<div class="empty">No charges recognized in this PDF</div>'; return; }
    txs.sort((a,b) => a.spent_at.localeCompare(b.spent_at));
    const {data: existing, error} = await sb.from('expenses').select('spent_at,amount')
      .gte('spent_at', txs[0].spent_at).lte('spent_at', txs[txs.length-1].spent_at);
    if(error) return err(error);
    const have = {};
    (existing||[]).forEach(e => { const k = e.spent_at + '|' + (+e.amount).toFixed(2); have[k] = (have[k]||0) + 1; });
    txs.forEach(t => { const k = t.spent_at + '|' + t.amount.toFixed(2); if(have[k] > 0){ have[k]--; t.dup = true; } });
    // imported charges get the same merchant key as taps, so learned rules apply to them too
    const {data: rules} = await sb.from('merchant_rules').select('merchant_key,category,description');
    const ruleBy = Object.fromEntries((rules || []).map(r => [r.merchant_key, r]));
    txs.forEach(t => {
      t.merchant = t.description; t.merchant_key = merchantKey(t.description) || null;
      const r = t.merchant_key && ruleBy[t.merchant_key];
      if(r){ t.category = r.category || t.category; if(r.description) t.description = r.description; }
    });
    window._parsedTxs = txs;
    const news = txs.filter(t => !t.dup).length;
    pv.innerHTML = `<div style="margin:12px 0 8px;font-size:13.5px">Found <b>${txs.length}</b> charges · <b>${news}</b> new · ${txs.length - news} already logged</div>
      <div class="list" style="max-height:320px;overflow:auto">` + txs.map((t,i) => `
      <div class="row" style="${t.dup ? 'opacity:.55' : ''}">
        ${t.dup ? '<span class="pill grey">already logged</span>' : `<input type="checkbox" id="imp${i}" checked style="width:auto" title="Untick to skip this charge">`}
        <div class="grow"><div class="title">${NIS(t.amount)}
          ${t.dup ? `<span class="pill grey" style="margin-left:6px">${t.category}</span>`
            : `<select id="impcat${i}" title="Category — fix the guess before importing" style="width:auto;display:inline-block;padding:3px 6px;font-size:12px;margin-left:6px">${CATS.map(c => `<option${c === t.category ? ' selected' : ''}>${c}</option>`).join('')}</select>`}</div>
        <div class="sub">${esc(t.description)} · ${fmtDate(t.spent_at)}</div></div>
      </div>`).join('') + `</div>
      ${news ? `<button class="btn" style="margin-top:12px" onclick="importParsed(this)">Add ${news} expenses</button>` : ''}`;
  }catch(e){ err(e); pv.innerHTML = '<div class="empty">Could not read this PDF — ' + esc(e.message || e) + '</div>'; }
}

  if(btn){ if(btn.disabled) return; btn.disabled = true; }

    if(!rows.length) return toast('Nothing selected');

    if(error) return err(error);

  finally{ if(btn) btn.disabled = false; }
}
function drawBurnChart(rows, budget, month){
  const [Y, M] = month.split('-').map(Number);
  const dim = new Date(Y, M, 0).getDate();
  const daily = Array(dim).fill(0);
  rows.forEach(r => { daily[+r.spent_at.slice(8,10) - 1] += +r.amount; });
  let run = 0; const cum = daily.map(v => run += v);
  const isCur = todayStr().slice(0,7) === month;
  const lastDay = isCur ? +todayStr().slice(8,10) : dim;
  const datasets = [{label: 'Spent so far', data: cum.map((v,i) => i < lastDay ? v : null),
    borderColor: '#23221f', backgroundColor: 'rgba(35,34,31,.09)', fill: true, tension: .25, pointRadius: 0, borderWidth: 2}];
  if(isCur && lastDay >= 2 && lastDay < dim){
    const rate = cum[lastDay-1] / lastDay;
    datasets.push({label: 'Projected at current pace', data: Array.from({length: dim}, (_,i) => i < lastDay-1 ? null : +(cum[lastDay-1] + rate*(i-lastDay+1)).toFixed(0)),
      borderColor: '#9b463a', borderDash: [3,4], pointRadius: 0, borderWidth: 1.5, fill: false});
    window._projSpend = cum[lastDay-1] + rate*(dim-lastDay);
  } else window._projSpend = null;
  if(budget > 0) datasets.push({label: 'Ideal pace to budget', data: Array.from({length: dim}, (_,i) => +(budget*(i+1)/dim).toFixed(0)),
    borderColor: '#8a6b22', borderDash: [5,4], pointRadius: 0, borderWidth: 1.5, fill: false});
  mkChart('burnChart', {type: 'line', data: {labels: Array.from({length: dim}, (_,i) => i+1), datasets},
    options: {maintainAspectRatio: false, interaction: {mode: 'index', intersect: false},
      plugins: {legend: {labels: {boxWidth: 18}}}, scales: {y: {beginAtZero: true}}}});
}
async function addExpense(){
  const amount = +exAmount.value; if(!amount) return toast('Enter an amount (negative for a refund)');
  if(!exDate.value) return toast('Pick a date');
  const row = {amount, category: exCat.value, description: exDesc.value.trim() || null, spent_at: exDate.value};
  const ed = window._editEx;
  if(!ed && row.description){ row.merchant = row.description; row.merchant_key = merchantKey(row.description) || null; }
  // snapshot before the write: the learning check asks "what did he change?", so it must
  // compare against the pre-update values, not a row the update may already have touched
  const was = ed ? {category: ed.category, description: ed.description, merchant_key: ed.merchant_key} : null;
  const {error} = ed
    ? await sb.from('expenses').update(row).eq('id', ed.id)
    : await sb.from('expenses').insert(row);
  if(error) return err(error);
  let learned = '';
  if(was && was.merchant_key) learned = await learnMerchant(was.merchant_key, row.category, row.description, was);
  if(ed){ window._editEx = null; toast('Expense updated' + learned); } else toast('Expense added');
  views.money();
}
/* An Apple Pay tap arrives with a raw terminal string ("SHUFERSAL DEAL 1234") and no
   category. The first time Benji fixes one, remember the choice against the normalised
   merchant key so every later tap at that shop lands already named and categorised.
   Same normalisation as the apple-pay Edge Function — keep the two in step. */
function merchantKey(raw){
  return (raw || '').normalize('NFKC').replace(/[^\p{L} ]+/gu, ' ')
    .replace(/\s+/g, ' ').trim().toUpperCase().slice(0, 80);
}
async function learnMerchant(key, category, description, before){
  if(!key) return '';
  const changed = category !== before.category || (description || '') !== (before.description || '');
  if(!changed) return '';
  const {error} = await sb.from('merchant_rules')
    .upsert({merchant_key: key, category, description: description || null, updated_at: new Date().toISOString()},
            {onConflict: 'user_id,merchant_key'});
  if(error){ console.warn('rule not saved', error); return ''; }
  // apply it to any other taps from the same shop that are still sitting uncategorised
  await sb.from('expenses')
    .update({category, description: description || null})
    .eq('merchant_key', key).eq('source', 'applepay').eq('category', 'Other');
  return ' — future ' + (description || key) + ' taps will file as ' + category;
}
/* Merchant rules are learned, so they need a way to be unlearned. */
async function forgetMerchant(key){
  if(!confirm('Forget the rule for this merchant? Future taps there will come in as Other again.')) return;
  const {error} = await sb.from('merchant_rules').delete().eq('merchant_key', key);
  error ? err(error) : (toast('Rule forgotten'), window._moneyKeep = true, views.money());
}

/* ================= CHORES ================= */
function choreDueDays(c){
  if(!c.last_done) return 0;
  const next = new Date(c.last_done + 'T00:00'); next.setDate(next.getDate() + c.frequency_days);
  return Math.round((next - new Date(todayStr() + 'T00:00')) / 864e5);
}
function chorePill(c){
  const d = choreDueDays(c);
  if(d < 0) return `<span class="pill red">Overdue ${-d}d</span>`;
  if(d === 0) return `<span class="pill amber">Due today</span>`;
  return `<span class="pill green">in ${d}d</span>`;
}

/* ================= RENT ================= */
/* Two independent things live here:
   1. the lease — one row per rented month, ticked off when the owner actually cashes that check
   2. the utility meters — a dated log of readings, with consumption derived between them
   Meters work with or without a lease, so they render either way. */
const METERS = {
  electricity: {label: 'Electricity', unit: 'kWh', chart: 'chartElec'},
  water:       {label: 'Water',       unit: 'm³',  chart: 'chartWater'},
};
const monthKey = iso => iso.slice(0, 8) + '01';                 // any ISO date -> 1st of that month
const monthLabel = m => new Date(m + 'T00:00').toLocaleDateString('en-GB', {month: 'short', year: 'numeric'});
const fmtNum = n => Number(n).toLocaleString('en-IL', {maximumFractionDigits: 2});
function addMonths(iso, n){
  const d = new Date(iso + 'T00:00'); d.setDate(1); d.setMonth(d.getMonth() + n);
  return d.toLocaleDateString('en-CA').slice(0, 8) + '01';
}

views.rent = async function(){

async function addLease(){

  const prev = {claimed: m.claimed, claimed_on: m.claimed_on};

async function extendLease(){

  const rows = Array.from({length: 12}, (_, i) => ({lease_id: L.id, month: addMonths(last.month, i + 1), amount}));
  const {error} = await sb.from('rent_months').insert(rows);

async function deleteLease(){

/* ---- utility meters ---- */
function meterSeries(kind){
  const rows = (window._meters || []).filter(r => r.kind === kind);   // already sorted by read_on
  return rows.map((r, i) => {
    const p = rows[i - 1];
    const used = p ? Number(r.reading) - Number(p.reading) : null;
    const days = p ? Math.max(1, Math.round((new Date(r.read_on + 'T00:00') - new Date(p.read_on + 'T00:00')) / 864e5)) : null;
    return Object.assign({}, r, {used, days, perDay: used == null ? null : used / days});
  });
}
function renderMeters(){
  const el = document.getElementById('meterBlock'); if(!el) return;
  el.innerHTML = `<div class="grid cols2">${Object.keys(METERS).map(meterCard).join('')}</div>`;
  drawMeterCharts();
}
function meterCard(kind){
  const M = METERS[kind], s = meterSeries(kind), latest = s[s.length - 1];
  const recent = s.slice(-6).reverse();

       <div style="font-size:12.5px;color:var(--muted);margin-top:5px">read ${fmtDate(latest.read_on)}${
         latest.used == null ? ' · first reading'
         : latest.used < 0 ? ' · <span style="color:var(--red)">lower than the previous reading</span>'
         : ` · <span style="color:var(--text);font-weight:600">+${fmtNum(latest.used)} ${M.unit}</span> over ${latest.days}d (${fmtNum(latest.perDay)}/day)`}</div>`
    : `<div class="empty" style="padding:14px">No readings yet</div>`;
  return `<div class="card">
    <h3>${M.label} meter</h3>
    ${head}
    <form onsubmit="submitGuard(event, () => addReading('${kind}'))" style="margin-top:14px">
      <div class="form-grid">
        <div><label class="lbl" for="rd_${kind}_date">Date</label><input type="date" id="rd_${kind}_date" value="${todayStr()}"></div>
        <div><label class="lbl" for="rd_${kind}_val">Reading (${M.unit})</label><input type="number" step="0.01" inputmode="decimal" enterkeyhint="done" id="rd_${kind}_val" placeholder="meter count"></div>
      </div>
      <button class="btn" type="submit">Log reading</button>
    </form>
    ${s.filter(r => r.used > 0).length >= 2 ? `<div class="chart-box" style="height:170px;margin-top:16px"><canvas id="${M.chart}"></canvas></div>` : ''}
    <div class="list" style="margin-top:14px">${recent.length ? recent.map(r => `
      <div class="row"><div class="grow"><div class="title">${fmtNum(r.reading)} ${M.unit}</div>
        <div class="sub">${fmtDate(r.read_on)}${r.used == null ? '' : r.used < 0 ? ' · reading dropped' : ` · +${fmtNum(r.used)} in ${r.days}d`}</div></div>
        <button class="icon-btn danger" title="Delete reading" onclick="delReading('${r.id}')">${ICO.x}</button></div>`).join('')
      : '<div class="empty">Log the meter count to start tracking usage</div>'}</div>
  </div>`;
}
async function addReading(kind){
  const dateEl = document.getElementById('rd_' + kind + '_date'), valEl = document.getElementById('rd_' + kind + '_val');
  if(!dateEl || !valEl) return;
  if(!dateEl.value) return toast('Pick the reading date');
  if(valEl.value === '' || isNaN(+valEl.value)) return toast('Enter the meter count');
  const {error} = await sb.from('meter_readings').insert({kind, read_on: dateEl.value, reading: +valEl.value});

async function delReading(id){

  error ? err(error) : views.rent();

function drawMeterCharts(){
  Object.keys(METERS).forEach(kind => {
    const M = METERS[kind];
    const s = meterSeries(kind).filter(r => r.used > 0);   // negative deltas mean a swapped/rolled meter — skip
    if(s.length < 2) return;
    mkChart(M.chart, {
      type: 'bar',
      data: {labels: s.map(r => fmtDate(r.read_on)), datasets: [{label: M.unit, data: s.map(r => r.used), backgroundColor: '#4a4741', borderRadius: 5}]},
      options: {maintainAspectRatio: false, plugins: {legend: {display: false}, tooltip: {callbacks: {
        label: c => `${fmtNum(c.parsed.y)} ${M.unit} over ${s[c.dataIndex].days}d · ${fmtNum(s[c.dataIndex].perDay)}/day`}}},
        scales: {y: {beginAtZero: true}}}
    });
  });
}
/* ================= HOUSE (top-down floor-plan designer) =================

  {cat:'Living', items:[['sofa','Sofa, 3-seat',220,95],['sofa','Sofa, 2-seat',160,90],['lsofa','Corner sofa',270,170],['armchair','Armchair',85,85],

/* ---------- item symbols: local coords, centred, front = +y. Returned markup is ink line art. ---------- */
function hdSym(type, w, d){
  const L = 'fill="none" stroke="' + HD_INK + '" vector-effect="non-scaling-stroke" stroke-width="1.1"';
  const F = 'fill="' + HD_FLOOR + '" stroke="' + HD_INK + '" vector-effect="non-scaling-stroke" stroke-width="1.5"';
  const x0 = -w/2, y0 = -d/2, r = (x, y, ww, hh, rx, a) => `<rect x="${x}" y="${y}" width="${Math.max(ww,0)}" height="${Math.max(hh,0)}" rx="${rx||0}" ${a||L}/>`;
  const ln = (x1, y1, x2, y2) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" ${L}/>`;
  const ci = (cx, cy, rr, a) => `<circle cx="${cx}" cy="${cy}" r="${rr}" ${a||L}/>`;
  const base = r(x0, y0, w, d, Math.min(4, w/10, d/10), F);
  switch(type){
    case 'bed': {
      const n = w >= 130 ? 2 : 1, pw = (w - 12 - (n-1)*6) / n, out = [base];
      for(let i = 0; i < n; i++) out.push(r(x0 + 6 + i*(pw+6), y0 + 7, pw, Math.min(32, d*.16), 6));
      const by = y0 + Math.min(52, d*.27);
      out.push(r(x0 + 2, by, w - 4, d - (by - y0) - 2, 3));
      out.push(`<path d="M${x0+2} ${by+22} L${x0+w*.35} ${by} " ${L}/>`);
      return out.join('');
    }
    case 'sofa': case 'armchair': {
      const bk = Math.min(24, d*.25), arm = Math.min(18, w*.14), out = [base];
      out.push(r(x0, y0, w, bk, 3), r(x0, y0, arm, d, 3), r(x0 + w - arm, y0, arm, d, 3));
      const n = type === 'armchair' ? 1 : w > 190 ? 3 : 2, sw = (w - 2*arm) / n;
      for(let i = 1; i < n; i++) out.push(ln(x0 + arm + i*sw, y0 + bk, x0 + arm + i*sw, y0 + d - 4));
      return out.join('');
    }
    case 'lsofa': {
      const dp = Math.min(95, d*.56), cw = Math.min(95, w*.36), bk = 22;
      const p = `M${x0} ${y0} H${x0+w} V${y0+d} H${x0+w-cw} V${y0+dp} H${x0} Z`;
      return `<path d="${p}" ${F}/>` + `<path d="M${x0} ${y0+bk} H${x0+w-bk} V${y0+d}" ${L}/>` +
        ln(x0+w-cw, y0+bk, x0+w-cw, y0+dp) + ln(x0+(w-cw)/2, y0+bk, x0+(w-cw)/2, y0+dp) + r(x0, y0, 16, dp, 3);
    }
    case 'table': case 'desk': {
      const out = [base, r(x0+4, y0+4, w-8, d-8, 2)];
      if(type === 'desk') out.push(r(-Math.min(30, w*.25), y0+6, Math.min(60, w*.5), 5, 1));
      return out.join('');
    }
    case 'round': return `<ellipse cx="0" cy="0" rx="${w/2}" ry="${d/2}" ${F}/><ellipse cx="0" cy="0" rx="${w/2-4}" ry="${d/2-4}" ${L}/>`;
    case 'stool': return ci(0, 0, Math.min(w, d)/2, F) + ci(0, 0, Math.min(w, d)/2 - 5);
    case 'chair': return r(x0+3, y0+8, w-6, d-10, 4, F) + r(x0, y0, w, 8, 3, F);
    case 'ochair': { const rr = Math.min(w, d)/2; return ci(0, 3, rr - 4, F) + `<path d="M${-rr+4} ${-rr*.35} Q0 ${-rr-6} ${rr-4} ${-rr*.35}" ${L} stroke-width="2.2"/>`; }
    case 'nightstand': case 'dresser': {
      const out = [base], n = type === 'nightstand' ? 1 : Math.max(2, Math.round(w/45));
      for(let i = 1; i < n; i++) out.push(ln(x0 + i*w/n, y0+3, x0 + i*w/n, y0+d-3));
      out.push(ln(x0+3, y0+d-6, x0+w-3, y0+d-6));
      return out.join('');
    }
    case 'wardrobe': {
      const out = [base], n = Math.max(2, Math.round(w/50));
      for(let i = 1; i < n; i++) out.push(ln(x0 + i*w/n, y0+3, x0 + i*w/n, y0+d-3));
      out.push(ln(x0+3, y0+d-4, x0+w-3, y0+d-4), ln(x0+4, y0+d*.4, x0+w-4, y0+d*.4));
      return out.join('');
    }
    case 'tvunit': return base + r(-w*.32, y0+4, w*.64, 5, 1, F) + ln(x0+w/3, y0+12, x0+w/3, y0+d-3) + ln(x0+2*w/3, y0+12, x0+2*w/3, y0+d-3);
    case 'shelf': { const out = [base], n = Math.max(2, Math.round(w/30)); for(let i = 1; i < n; i++) out.push(ln(x0 + i*w/n, y0+2, x0 + i*w/n, y0+d-2)); return out.join(''); }
    case 'rug': return r(x0, y0, w, d, 2, `fill="#efede8" stroke="${HD_MUTED}" vector-effect="non-scaling-stroke" stroke-width="1" stroke-dasharray="4 3"`) + r(x0+8, y0+8, w-16, d-16, 1);
    case 'plant': {
      const rr = Math.min(w, d)/2, out = [ci(0, 0, rr*.55, F)];
      for(let i = 0; i < 6; i++){ const a = i*Math.PI/3, ex = Math.cos(a)*rr, ey = Math.sin(a)*rr;
        out.push(`<path d="M0 0 Q${Math.cos(a+.5)*rr*.7} ${Math.sin(a+.5)*rr*.7} ${ex} ${ey} Q${Math.cos(a-.5)*rr*.7} ${Math.sin(a-.5)*rr*.7} 0 0" ${L}/>`); }
      return out.join('');
    }
    case 'counter': return base + ln(x0+3, y0+d-5, x0+w-3, y0+d-5);
    case 'sink': return base + r(x0+8, y0+10, w-16, d-18, 7) + ci(0, y0+5, 2.5);
    case 'stove': { const rx = w/4, ry = d/4, rr = Math.min(w, d)*.15; return base + ci(-rx, -ry, rr) + ci(rx, -ry, rr*.8) + ci(-rx, ry, rr*.8) + ci(rx, ry, rr); }
    case 'fridge': return base + ln(x0+3, y0+d-7, x0+w-3, y0+d-7) + ln(x0+w*.35, y0+d-7, x0+w*.35, y0+d);
    case 'washer': return base + ci(0, 2, Math.min(w, d)*.32) + ci(0, 2, Math.min(w, d)*.2) + ln(x0+4, y0+8, x0+w-4, y0+8);
    case 'toilet': return r(x0, y0, w, Math.min(20, d*.28), 3, F) + `<ellipse cx="0" cy="${y0 + d*.62}" rx="${w*.44}" ry="${d*.36}" ${F}/>` + `<ellipse cx="0" cy="${y0 + d*.64}" rx="${w*.28}" ry="${d*.22}" ${L}/>`;
    case 'basin': return base + `<ellipse cx="0" cy="3" rx="${w*.36}" ry="${d*.3}" ${L}/>` + ci(0, y0+5, 2);
    case 'tub': return base + r(x0+7, y0+7, w-14, d-14, Math.min(d, w)*.3) + ci(x0+20, 0, 3);
    case 'shower': return base + ln(x0+3, y0+3, x0+w-3, y0+d-3) + ln(x0+w-3, y0+3, x0+3, y0+d-3) + ci(0, 0, 4, F);
    case 'bike': return ci(x0+d*.4, 0, d*.4) + ci(x0+w-d*.4, 0, d*.4) + ln(x0+d*.4, 0, x0+w-d*.4, 0) + ln(x0+w*.6, -d*.45, x0+w*.6, d*.45);
    default: return base + ln(x0+4, y0+4, x0+w-4, y0+d-4) + ln(x0+w-4, y0+4, x0+4, y0+d-4);
  }
}
function hdPreview(type, w, d){
  if(type.startsWith('room-')) return `<svg viewBox="0 0 40 30"><rect x="3" y="3" width="34" height="24" fill="#fbfaf8" stroke="${HD_INK}" stroke-width="3"/></svg>`;
  if(type === 'open-door') return `<svg viewBox="0 0 40 30"><path d="M4 26H36" stroke="${HD_INK}" stroke-width="3"/><path d="M10 26V6M10 6A20 20 0 0 1 30 26" fill="none" stroke="${HD_INK}" stroke-width="1.4"/></svg>`;
  if(type === 'open-window') return `<svg viewBox="0 0 40 30"><rect x="4" y="11" width="32" height="8" fill="#fbfaf8" stroke="${HD_INK}" stroke-width="1.4"/><path d="M4 15H36" stroke="${HD_INK}" stroke-width="1.2"/></svg>`;
  if(type === 'open-slider') return `<svg viewBox="0 0 40 30"><path d="M4 13H24M16 17H36" stroke="${HD_INK}" stroke-width="2.4"/><path d="M4 21H36" stroke="${HD_INK}" stroke-width="1"/></svg>`;
  const m = Math.max(w, d) * .06;
  return `<svg viewBox="${-w/2-m} ${-d/2-m} ${w+2*m} ${d+2*m}">${hdSym(type, w, d)}</svg>`;
}

/* ---------- geometry ---------- */
const hdRot = (x, y, deg) => { const a = deg * Math.PI/180, c = Math.cos(a), s = Math.sin(a); return [x*c - y*s, x*s + y*c]; };
function hdCorners(o){   // o = {x,y,w,d,rot} centred box
  return [[-1,-1],[1,-1],[1,1],[-1,1]].map(([sx, sy]) => { const [a, b] = hdRot(sx*o.w/2, sy*o.d/2, o.rot||0); return [o.x + a, o.y + b]; });
}
function hdOverlap(A, B, eps = 0.6){   // separating-axis test on two convex quads
  for(const P of [A, B]) for(let i = 0; i < 4; i++){
    const [x1, y1] = P[i], [x2, y2] = P[(i+1) % 4], nx = y1 - y2, ny = x2 - x1, len = Math.hypot(nx, ny) || 1;
    let a1 = Infinity, a2 = -Infinity, b1 = Infinity, b2 = -Infinity;
    for(const [x, y] of A){ const p = (x*nx + y*ny)/len; a1 = Math.min(a1, p); a2 = Math.max(a2, p); }
    for(const [x, y] of B){ const p = (x*nx + y*ny)/len; b1 = Math.min(b1, p); b2 = Math.max(b2, p); }
    if(a2 <= b1 + eps || b2 <= a1 + eps) return false;
  }
  return true;
}
const hdBoxQ = (x, y, w, h) => [[x, y], [x+w, y], [x+w, y+h], [x, y+h]];
function hdAABB(o){ const c = hdCorners(o), xs = c.map(p => p[0]), ys = c.map(p => p[1]);
  return {x1: Math.min(...xs), y1: Math.min(...ys), x2: Math.max(...xs), y2: Math.max(...ys)}; }
/* every wall as a segment: apartment outline (thick) + each room's four edges */
function hdWalls(P){
  const segs = [], add = (x, y, w, h, th, outer) => {
    segs.push({h:1, c:y, a:x, b:x+w, th, outer}, {h:1, c:y+h, a:x, b:x+w, th, outer},
              {h:0, c:x, a:y, b:y+h, th, outer}, {h:0, c:x+w, a:y, b:y+h, th, outer}); };
  add(0, 0, P.W, P.H, HD_OUTER, true);
  P.rooms.forEach(r => add(r.x, r.y, r.w, r.h, HD_WALL, false));
  return segs;
}
const hdWallQuad = s => s.h ? hdBoxQ(s.a, s.c - s.th/2, s.b - s.a, s.th) : hdBoxQ(s.c - s.th/2, s.a, s.th, s.b - s.a);
/* door swing footprint: the len x len square on the swing side, hinged at one jamb */
function hdSwingQuad(o){ return hdCorners({x: o.x + hdRot(0, o.len/2 + (o.th||HD_WALL)/2, o.rot)[0], y: o.y + hdRot(0, o.len/2 + (o.th||HD_WALL)/2, o.rot)[1], w: o.len, d: o.len, rot: o.rot}); }
/* fit check: red = hits a wall / another item / outside the apartment, amber = inside a door's swing */
function hdConflicts(P){
  const res = {}, walls = hdWalls(P).map(hdWallQuad), soft = t => t === 'rug';
  const Q = P.items.map(it => ({it, q: hdCorners(it)}));
  Q.forEach(({it, q}) => {
    if(q.some(([x, y]) => x < -0.5 || y < -0.5 || x > P.W + .5 || y > P.H + .5)){ res[it.id] = {lvl:'red', why:'Sticks out of the apartment'}; return; }
    if(walls.some(w => hdOverlap(q, w))){ res[it.id] = {lvl:'red', why:'Runs into a wall'}; return; }
  });
  for(let i = 0; i < Q.length; i++) for(let j = i+1; j < Q.length; j++){
    const a = Q[i], b = Q[j];
    if(soft(a.it.type) || soft(b.it.type)) continue;
    if(hdOverlap(a.q, b.q)){
      res[a.it.id] = res[a.it.id] || {lvl:'red', why:'Overlaps ' + b.it.name};
      res[b.it.id] = res[b.it.id] || {lvl:'red', why:'Overlaps ' + a.it.name};
    }
  }
  P.opens.filter(o => o.kind === 'door').forEach(o => {
    const s = hdSwingQuad(o);
    Q.forEach(({it, q}) => { if(!soft(it.type) && !res[it.id] && hdOverlap(q, s, 2)) res[it.id] = {lvl:'amber', why:'Blocks a door swing'}; });
  });
  // rooms: must sit inside the outline; overlapping another room is almost always a slip
  P.rooms.forEach((r, i) => {
    if(r.x < -.5 || r.y < -.5 || r.x + r.w > P.W + .5 || r.y + r.h > P.H + .5){ res[r.id] = {lvl:'red', why:'Outside the apartment'}; return; }
    const hit = P.rooms.find((b, j) => j !== i && Math.min(r.x + r.w, b.x + b.w) - Math.max(r.x, b.x) > HD_WALL/2 && Math.min(r.y + r.h, b.y + b.h) - Math.max(r.y, b.y) > HD_WALL/2);
    if(hit) res[r.id] = {lvl:'amber', why:'Overlaps ' + hit.name};
  });
  // doors and windows must sit on a wall
  P.opens.forEach(o => { if(!hdOnWall(P, o)) res[o.id] = {lvl:'red', why:'Not on a wall'}; });
  return res;
}
/* the wall segment an opening currently sits on (axis matches, on the line, fully inside the segment) */
function hdOnWall(P, o){
  const horiz = ((o.rot || 0) % 180) === 0;
  return hdWalls(P).find(s => !!s.h === horiz && Math.abs((s.h ? o.y : o.x) - s.c) < 1 &&
    (s.h ? o.x : o.y) - o.len/2 >= s.a - 1 && (s.h ? o.x : o.y) + o.len/2 <= s.b + 1) || null;
}
/* openings riding on a room's edges (not the outer wall) move with the room when it moves or resizes */
function hdAttached(P, r){
  const out = [];
  P.opens.forEach(o => {
    const horiz = ((o.rot || 0) % 180) === 0;
    if(horiz){
      if(Math.abs(o.y) < 1 || Math.abs(o.y - P.H) < 1 || o.x < r.x - 1 || o.x > r.x + r.w + 1) return;
      if(Math.abs(o.y - r.y) < 1) out.push({o, e: 'n', off: o.x - r.x});
      else if(Math.abs(o.y - (r.y + r.h)) < 1) out.push({o, e: 's', off: o.x - r.x});
    } else {
      if(Math.abs(o.x) < 1 || Math.abs(o.x - P.W) < 1 || o.y < r.y - 1 || o.y > r.y + r.h + 1) return;
      if(Math.abs(o.x - r.x) < 1) out.push({o, e: 'w', off: o.y - r.y});
      else if(Math.abs(o.x - (r.x + r.w)) < 1) out.push({o, e: 'e', off: o.y - r.y});
    }
  });
  return out;
}
function hdCarry(att, r){
  const cl = (v, a, b) => Math.min(Math.max(v, a), Math.max(a, b));
  att.forEach(({o, e, off}) => {
    if(e === 'n' || e === 's'){ o.y = e === 'n' ? r.y : r.y + r.h; o.x = Math.round(cl(r.x + off, r.x + o.len/2, r.x + r.w - o.len/2)); }
    else { o.x = e === 'w' ? r.x : r.x + r.w; o.y = Math.round(cl(r.y + off, r.y + o.len/2, r.y + r.h - o.len/2)); }
  });
}

/* ---------- state, undo, save ---------- */
const hdP = () => HD && HD.cur && HD.cur.data;
function hdNormalise(d){
  d = d || {};
  return {W: +d.W || 900, H: +d.H || 700, rooms: d.rooms || [], items: d.items || [], opens: d.opens || []};
}
function hdPush(){ if(!HD) return; HD.undo.push(JSON.stringify(hdP())); if(HD.undo.length > 80) HD.undo.shift(); HD.redo = []; hdUndoBtns(); }
function hdUndo(redo){
  const from = redo ? HD.redo : HD.undo, to = redo ? HD.undo : HD.redo;
  if(!from.length) return;
  to.push(JSON.stringify(hdP()));
  HD.cur.data = JSON.parse(from.pop());
  if(HD.sel && !hdFind(HD.sel)) HD.sel = null;
  hdPaint(); hdInspect(); hdUndoBtns(); hdSave();
}
function hdUndoBtns(){
  const u = document.getElementById('hdUndo'), r = document.getElementById('hdRedo');
  if(u) u.disabled = !HD.undo.length; if(r) r.disabled = !HD.redo.length;
}
function hdStatus(s){ if(HD) HD.status = s; const el = document.getElementById('hdSaved'); if(el){ el.textContent = s; el.classList.toggle('bad', /not/i.test(s)); } }
/* autosave: every edited plan object is queued in HDS.dirty and written in order (one chain, so two
   updates never land out of order). A failed write stays queued and retries with back-off; the queue
   lives outside HD so re-entering the view, or switching plans, never drops or misdirects a save. */
const HDS = {dirty: new Set(), t: null, chain: Promise.resolve(), fails: 0};
const hdPending = () => !!(HDS.t || HDS.dirty.size);
function hdSave(){
  if(!HD || !HD.cur) return;
  HDS.dirty.add(HD.cur);
  hdStatus('Saving…');
  clearTimeout(HDS.t);
  HDS.t = setTimeout(hdFlush, 700);
}
function hdFlush(){
  clearTimeout(HDS.t); HDS.t = null;
  HDS.chain = HDS.chain.then(async () => {
    const plans = [...HDS.dirty]; HDS.dirty.clear();
    let failed = null;
    for(const plan of plans){
      let res;
      try{ res = await sb.from('floor_plans').update({name: plan.name, data: plan.data, updated_at: new Date().toISOString()}).eq('id', plan.id).select('id'); }
      catch(ex){ res = {error: ex}; }
      if(res.error){ HDS.dirty.add(plan); failed = res.error; continue; }
      if(!res.data || !res.data.length) toast(`"${plan.name}" no longer exists, so it wasn't saved`);
    }
    if(failed){
      HDS.fails++;
      if(HDS.fails === 1) err(failed);          // one toast, not one every retry
      hdStatus('Not saved — retrying');
      if(!HDS.t) HDS.t = setTimeout(hdFlush, Math.min(60000, 4000 * 2 ** (HDS.fails - 1)));
    } else {
      if(HDS.fails) toast('Plan saved');
      HDS.fails = 0;
      if(!hdPending()) hdStatus('Saved');
    }
  });
  return HDS.chain;
}
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden' && hdPending()) hdFlush(); });

function hdFind(sel){
  const P = hdP(); if(!P || !sel) return null;
  const list = sel.t === 'room' ? P.rooms : sel.t === 'item' ? P.items : P.opens;
  return list.find(o => o.id === sel.id) || null;
}

/* ---------- view ---------- */
function hdRenderPref(){ try{ return localStorage.getItem('atlas_house_render') !== '0'; }catch(e){ return true; } }
views.house = async function(){
  const seq = renderStart();
  document.getElementById('main').innerHTML = `
    <div class="page-head"><h2>House</h2><img src="hero-house.png" alt="" onerror="this.remove()"></div>
    <div id="hdBody"><div class="empty">Loading…</div></div>`;
  if(hdPending()) await hdFlush();   // write pending edits first, so the reload below can't return the old row
  const {data, error} = await sb.from('floor_plans').select('*').order('created_at');
  if(stale(seq)) return;
  if(error){
    document.getElementById('hdBody').innerHTML = `<div class="empty">Couldn't load your plans — ${esc(error.message)}.
      <button class="linkish" type="button" onclick="views.house()">Retry</button></div>`;
    return;
  }
  const keep = HD && HD.cur ? HD.cur.id : null;
  // a plan whose save is still failing keeps its in-memory copy instead of the stale database row

function hdBakeInterior(P){
  const res = Math.max(2, P.W / 560, P.H / 560), cw = Math.ceil(P.W / res), ch = Math.ceil(P.H / res);
  const c = document.createElement('canvas'); c.width = cw; c.height = ch;
  const x = c.getContext('2d'); x.setTransform(1/res, 0, 0, 1/res, 0, 0);
  // walls standing ~2.6 m tall throw a short shadow across the floor next to them
  const [A, ax] = (() => { const a = document.createElement('canvas'); a.width = cw; a.height = ch; const q = a.getContext('2d'); q.setTransform(1/res, 0, 0, 1/res, 0, 0); return [a, q]; })();
  hdWallInk(ax, P, false);
  x.save(); x.setTransform(1, 0, 0, 1, 0, 0);
  const L = 48;
  for(let t = L; t >= 0; t -= Math.max(1.2, res * .8)){ x.globalAlpha = .07 * Math.pow(1 - t / L, 1.6); x.drawImage(A, HD_LIGHT[0] * t / res, HD_LIGHT[1] * t / res); }
  x.restore();
  // furniture: extrude the footprint along the light direction by the piece's height
  P.items.forEach(it => {
    if(it.type === 'rug') return;
    const h = HD_HGT[it.type] || 12, round = ['round', 'stool', 'plant', 'ochair'].includes(it.type);
    for(let t = h; t >= 0; t -= Math.max(1, res * .7)){
      x.save(); x.globalAlpha = .2 * (1 - t / (h * 1.15));
      x.translate(it.x + HD_LIGHT[0] * t, it.y + HD_LIGHT[1] * t); x.rotate((it.rot || 0) * Math.PI/180);
      x.fillStyle = '#000'; x.beginPath();
      if(round) x.ellipse(0, 0, it.w/2, it.d/2, 0, 0, 6.2832); else x.rect(-it.w/2, -it.d/2, it.w, it.d);
      x.fill(); x.restore();
    }
  });
  const im = x.getImageData(0, 0, cw, ch);
  hdBlurAlpha(im, 3.2 / res, 3, [22, 21, 18]);
  x.putImageData(im, 0, 0);

}
function hdRenderToggle(){
  HD.render = !HD.render;
  try{ localStorage.setItem('atlas_house_render', HD.render ? '1' : '0'); }catch(e){}
  HD.gKey = HD.iKey = null;

/* axis lines: every distinct wall line, lettered across the top and numbered down the side */
function hdAxes(P){
  const uniq = vals => { const s = [...vals].sort((a, b) => a - b), out = []; s.forEach(v => { if(!out.length || v - out[out.length-1] > 14) out.push(v); }); return out; };
  const xs = uniq([0, P.W, ...P.rooms.flatMap(r => [r.x, r.x + r.w])].filter(v => v >= 0 && v <= P.W));
  const ys = uniq([0, P.H, ...P.rooms.flatMap(r => [r.y, r.y + r.h])].filter(v => v >= 0 && v <= P.H));
  return {xs, ys};
}
const hdLetter = i => i < 26 ? String.fromCharCode(65 + i) : String.fromCharCode(64 + Math.floor(i / 26)) + String.fromCharCode(65 + i % 26);
const hdAxesOn = Wpx => Wpx >= 520 || (HD.textScale || 1) > 1;
/* do any two axis lines sit closer than a bubble at scale s? then the bubbles need a second row */
function hdCrowded(P, s){
  const {xs, ys} = hdAxes(P), ts = HD.textScale || 1, near = a => a.some((v, i) => i && (v - a[i-1]) * s / ts < 2*9.5 + 4);
  return near(xs) || near(ys);
}
function hdPads(Wpx, crowded){ const ts = HD.textScale || 1, small = !hdAxesOn(Wpx);
  const n = hdP() ? hdP().rooms.length : 0;
  const ax = small ? 16 : crowded ? 108 : 84;
  return {l: ax * ts, t: ax * ts, r: 26 * ts, b: (n ? 66 + Math.ceil(n / hdCols(Wpx)) * 21 : 52) * ts + 14}; }
const hdCols = Wpx => Wpx < 520 ? 1 : 2;

/* under 900 px the canvas height follows the plan's proportions; above it, CSS sets the height */
function hdStageSize(){
  const svg = document.getElementById('hdSvg'), P = hdP(); if(!svg || !P) return;
  const stage = svg.parentElement;
  if(window.innerWidth >= 900){ stage.style.height = ''; return; }
  const w = stage.clientWidth, pd = hdPads(w), b = hdBounds(P), s = (w - pd.l - pd.r) / (b.x2 - b.x1);
  const h = Math.round(Math.max(320, Math.min(window.innerHeight * .72, (b.y2 - b.y1) * s + pd.t + pd.b)));
  if(Math.abs(stage.clientHeight - h) > 2) stage.style.height = h + 'px';
}
function hdBarState(){
  document.querySelector('.hd-bar')?.classList.toggle('is3d', !!HD.mode3d);
  document.getElementById('hd3Btn')?.classList.toggle('on', !!HD.mode3d);
  document.getElementById('hdMeasure')?.classList.toggle('on', HD.tool === 'measure');
  document.getElementById('hdLabels')?.classList.toggle('on', !!HD.labels);
  document.getElementById('hdRender')?.classList.toggle('on', !!HD.render);
  const tip = document.getElementById('hdTip');
  if(tip){ tip.textContent = HD.tool === 'measure' ? 'Drag to measure · Esc to stop' : ''; tip.classList.toggle('show', HD.tool === 'measure'); }
  const svg = document.getElementById('hdSvg'); if(svg){ svg.classList.toggle('measuring', HD.tool === 'measure'); svg.classList.toggle('render', !!HD.render); }
}
function hdTool(t){ HD.tool = HD.tool === t ? null : t; if(!HD.tool) HD.measure = null; hdBarState(); hdPaint(); }

/* ---------- camera ---------- */
function hdSize(){ const s = document.getElementById('hdSvg'); return s ? [s.clientWidth || 1, s.clientHeight || 1] : [1, 1]; }
function hdBounds(P){
  let x1 = -HD_OUTER/2, y1 = -HD_OUTER/2, x2 = P.W + HD_OUTER/2, y2 = P.H + HD_OUTER/2;
  P.items.forEach(it => { const b = hdAABB(it); x1 = Math.min(x1, b.x1); y1 = Math.min(y1, b.y1); x2 = Math.max(x2, b.x2); y2 = Math.max(y2, b.y2); });
  P.rooms.forEach(r => { x1 = Math.min(x1, r.x - HD_WALL/2); y1 = Math.min(y1, r.y - HD_WALL/2); x2 = Math.max(x2, r.x + r.w + HD_WALL/2); y2 = Math.max(y2, r.y + r.h + HD_WALL/2); });
  P.opens.forEach(o => {   // the opening itself, plus a door's swing in case it opens outwards
    const pts = hdCorners({x: o.x, y: o.y, w: o.len, d: o.th || HD_WALL, rot: o.rot || 0}).concat(o.kind === 'door' ? hdSwingQuad(o) : []);
    pts.forEach(([x, y]) => { x1 = Math.min(x1, x); y1 = Math.min(y1, y); x2 = Math.max(x2, x); y2 = Math.max(y2, y); });
  });
  return {x1, y1, x2, y2};
}
/* fit leaves room in screen pixels for the axis bubbles (top/left) and the legend (bottom) */
function hdFit(){
  const P = hdP(); if(!P) return;
  const [W, H] = hdSize(), b = hdBounds(P), bw = b.x2 - b.x1, bh = b.y2 - b.y1;
  const sFor = pd => Math.max(0.05, Math.min((W - pd.l - pd.r) / bw, (H - pd.t - pd.b) / bh));
  let pd = hdPads(W), s = sFor(pd);
  if(hdAxesOn(W) && hdCrowded(P, s)){ pd = hdPads(W, true); s = sFor(pd); }
  const fx = (W - pd.l - pd.r - bw*s) / 2, fy = (H - pd.t - pd.b - bh*s) / 2;
  HD.view = {s, x: b.x1 - (pd.l + fx) / s, y: b.y1 - (pd.t + fy) / s};
}
function hdZoomAt(f, px, py){
  const v = HD.view, s2 = Math.min(12, Math.max(0.05, v.s * f)), wx = v.x + px / v.s, wy = v.y + py / v.s;
  v.s = s2; v.x = wx - px / s2; v.y = wy - py / s2;
}
function hdZoomBy(f){ const [W, H] = hdSize(); hdZoomAt(f, W/2, H/2); hdPaint(); }
function hdPt(e){ const svg = document.getElementById('hdSvg'), b = svg.getBoundingClientRect(), v = HD.view;
  return {px: e.clientX - b.left, py: e.clientY - b.top, x: v.x + (e.clientX - b.left) / v.s, y: v.y + (e.clientY - b.top) / v.s}; }

/* ---------- paint ---------- */
function hdPaint(){
  const svg = document.getElementById('hdSvg'), P = hdP();
  if(!svg || !P || !document.getElementById('hdScene')) return;
  if(!svg.clientWidth){ HD.conf = hdConflicts(P); if(HD.mode3d) hd3Sync(); return; }   // 2D canvas hidden behind the 3D view
  if(!HD.view) hdFit();
  const [W, H] = hdSize(), v = HD.view, k = 1 / v.s, ts = HD.textScale || 1, u = k * ts;   // k = cm per screen px, u = cm per "annotation px"
  const R = !!HD.render, INK = R ? HD_RINK : HD_INK, HALO = R ? HD_GROUND : '#f3f2ef';
  svg.setAttribute('viewBox', `${v.x} ${v.y} ${W * k} ${H * k}`);
  svg.classList.toggle('render', R);
  const conf = hdConflicts(P); HD.conf = conf;
  const NS = 'vector-effect="non-scaling-stroke"', fs = n => (n * u).toFixed(2);

  // --- back: page (topography or drafting grid) + per-zoom patterns
  document.getElementById('hdBack').innerHTML = `<defs>
    <pattern id="hdGrid" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M100 0H0V100" fill="none" stroke="#dcd9d3" stroke-width="${k}"/><path d="M50 0V100M0 50H100" fill="none" stroke="#e7e5e0" stroke-width="${k}"/></pattern>
    <pattern id="hdTile" width="30" height="30" patternUnits="userSpaceOnUse"><rect width="30" height="30" fill="${HD_FLOOR}"/><path d="M30 0H0V30" fill="none" stroke="#e2dfd9" stroke-width="${k}"/></pattern>
    <pattern id="hdDeck" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#f4f3ef"/><path d="M0 0H14" stroke="#e0ddd6" stroke-width="${k}"/></pattern>
    <pattern id="hdTileL" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="${Math.max(.6, 1.1*k)}"/><path d="M30 1H1V30" fill="none" stroke="rgba(60,58,52,.10)" stroke-width="${Math.max(.4, .8*k)}"/></pattern>
    <pattern id="hdDeckL" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M0 .5H14" stroke="#dedbd4" stroke-width="${Math.max(.5, k)}"/></pattern>
  </defs><rect x="${v.x}" y="${v.y}" width="${W*k}" height="${H*k}" fill="${R ? 'url(#hdTopo)' : 'url(#hdGrid)'}"/>`;
  ['hdGroundL', 'hdIntL'].forEach(id => document.getElementById(id).style.display = R ? '' : 'none');

  // --- floors (+ rugs, which lie flat and take the furniture shadows on top of them)
  const f = [];
  f.push(`<rect x="0" y="0" width="${P.W}" height="${P.H}" fill="${R ? 'url(#hdConc)' : '#f7f6f3'}"/>`);
  if(R) f.push(`<rect x="0" y="0" width="${P.W}" height="${P.H}" fill="rgba(255,255,255,.18)"/>`);   // un-roomed space reads a touch lighter
  P.rooms.forEach(r => {
    const fill = R ? (r.kind === 'balcony' ? '#f7f6f3' : 'url(#hdConc)') : (HD_KINDS[r.kind] || HD_KINDS.living).fill;
    f.push(`<rect data-t="room" data-id="${r.id}" x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" fill="${fill}"/>`);
    if(!R) return;
    const ov = r.kind === 'kitchen' || r.kind === 'bath' ? 'url(#hdTileL)' : r.kind === 'balcony' ? 'url(#hdDeckL)' : r.kind === 'storage' ? 'rgba(40,38,34,.05)' : '';
    if(ov) f.push(`<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" fill="${ov}" pointer-events="none"/>`);
  });
  const itemSvg = it => {
    const c = conf[it.id], sel = HD.sel && HD.sel.id === it.id;
    const hl = c ? `<rect x="${-it.w/2}" y="${-it.d/2}" width="${it.w}" height="${it.d}" fill="${c.lvl === 'red' ? 'rgba(155,70,58,.16)' : 'rgba(138,107,34,.14)'}" stroke="${c.lvl === 'red' ? HD_RED : HD_AMBER}" stroke-width="1.6" ${NS} stroke-dasharray="${c.lvl === 'red' ? '' : '5 3'}"/>` : '';
    return `<g data-t="item" data-id="${it.id}" class="hd-it${sel ? ' sel' : ''}" transform="translate(${it.x} ${it.y}) rotate(${it.rot || 0})">
      <rect x="${-it.w/2}" y="${-it.d/2}" width="${it.w}" height="${it.d}" fill="transparent"/>${hdSym(it.type, it.w, it.d)}${hl}</g>`;
  };
  P.items.filter(i => i.type === 'rug').forEach(it => f.push(itemSvg(it)));
  document.getElementById('hdFloor').innerHTML = f.join('');

  // --- scene: furniture, walls, openings, annotation
  const o = [];
  P.items.filter(i => i.type !== 'rug').forEach(it => o.push(itemSvg(it)));
  P.rooms.forEach(r => {
    if(r.kind === 'balcony') o.push(`<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" fill="none" stroke="${INK}" stroke-width="${R ? 4 : HD_WALL}" ${R ? '' : `stroke-dasharray="${HD_WALL*2} ${HD_WALL}"`} pointer-events="none"/>`);
    else o.push(`<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" fill="none" stroke="${INK}" stroke-width="${HD_WALL}" pointer-events="none"/>`);
  });
  o.push(`<rect x="0" y="0" width="${P.W}" height="${P.H}" fill="none" stroke="${INK}" stroke-width="${HD_OUTER}" pointer-events="none"/>`);
  P.rooms.forEach(r => { const c = conf[r.id]; if(c) o.push(`<rect x="${r.x + HD_WALL}" y="${r.y + HD_WALL}" width="${Math.max(0, r.w - 2*HD_WALL)}" height="${Math.max(0, r.h - 2*HD_WALL)}" fill="${c.lvl === 'red' ? 'rgba(155,70,58,.10)' : 'rgba(138,107,34,.08)'}" stroke="${c.lvl === 'red' ? HD_RED : HD_AMBER}" stroke-width="1.6" stroke-dasharray="7 4" ${NS} pointer-events="none"/>`); });
  P.opens.forEach(op => {
    const th = op.th || HD_WALL, L = op.len, hx = op.flip ? L/2 : -L/2, sel = HD.sel && HD.sel.id === op.id;
    const patch = R ? (op.kind === 'door' ? 'url(#hdConc)' : '#fbfbfa') : HD_FLOOR;
    let s = `<rect x="${-L/2}" y="${-th/2 - 1}" width="${L}" height="${th + 2}" fill="${patch}"/>` +
      `<path d="M${-L/2} ${-th/2}V${th/2}M${L/2} ${-th/2}V${th/2}" stroke="${INK}" stroke-width="1.6" ${NS}/>`;
    if(op.kind === 'door'){
      s += R ? `<rect x="${op.flip ? hx - 4 : hx}" y="${th/2}" width="4" height="${L}" fill="#fff" stroke="${INK}" stroke-width="1" ${NS}/>` +
               `<path d="M${hx} ${th/2 + L}A${L} ${L} 0 0 ${op.flip ? 1 : 0} ${-hx} ${th/2}" fill="none" stroke="#6d6a63" stroke-width="1" ${NS}/>`
             : `<path d="M${hx} ${th/2}V${th/2 + L}" stroke="${INK}" stroke-width="2.2" ${NS}/>` +
               `<path d="M${hx} ${th/2 + L}A${L} ${L} 0 0 ${op.flip ? 1 : 0} ${-hx} ${th/2}" fill="none" stroke="${HD_MUTED}" stroke-width="1" stroke-dasharray="4 3" ${NS}/>`;
    } else if(op.kind === 'window'){
      s += R ? `<path d="M${-L/2} ${-th*.18}H${L/2}M${-L/2} ${th*.18}H${L/2}" stroke="${INK}" stroke-width=".9" ${NS}/><path d="M${-L/2} ${-th/2}H${L/2}M${-L/2} ${th/2}H${L/2}" stroke="${INK}" stroke-width="1.2" ${NS}/>`
             : `<rect x="${-L/2}" y="${-th/2}" width="${L}" height="${th}" fill="none" stroke="${HD_INK}" stroke-width="1.1" ${NS}/><path d="M${-L/2} 0H${L/2}" stroke="${HD_INK}" stroke-width="1.1" ${NS}/>`;
    } else s += `<path d="M${-L/2} ${-th/6}H${L*.1}M${-L*.1} ${th/6}H${L/2}" stroke="${INK}" stroke-width="2.4" ${NS}/>` +
      (R ? `<path d="M${-L/2} ${-th/2}H${L/2}M${-L/2} ${th/2}H${L/2}" stroke="${INK}" stroke-width=".8" ${NS}/>` : '');
    if(conf[op.id]) s += `<rect x="${-L/2 - 3}" y="${-th/2 - 3}" width="${L + 6}" height="${th + 6}" fill="rgba(155,70,58,.18)" stroke="${HD_RED}" stroke-width="1.6" ${NS}/>`;
    o.push(`<g data-t="open" data-id="${op.id}" class="hd-op${sel ? ' sel' : ''}" transform="translate(${op.x} ${op.y}) rotate(${op.rot || 0})">
      <rect x="${-L/2}" y="${-th/2 - 8}" width="${L}" height="${th + 16}" fill="transparent"/>${s}</g>`);
  });
  // room tags: numbered disc (keyed to the legend), name, area
  P.rooms.forEach((r, i) => {
    if(r.w * v.s < 24 || r.h * v.s < 24) return;
    const nameFits = r.w * v.s > (r.name.length * 7.4 + 14) * ts, roomy = nameFits && r.h * v.s > 74 * ts;
    const bw = (nameFits ? Math.max(r.name.length * 7.4 + 10, 54) : 22) * u, top = (roomy ? 27 : nameFits ? 10 : 11) * u, bot = (roomy ? 26 : nameFits ? 18 : 11) * u;
    const [cx, cy] = hdTagSpot(P, r, bw, top, bot);
    if(!nameFits){ o.push(`<g pointer-events="none"><circle cx="${cx}" cy="${cy}" r="${9*u}" fill="#fff" stroke="${INK}" stroke-width="1" ${NS}/>

document.addEventListener('keydown', e => {
  if(!HD || window._curTab !== 'house' || !document.getElementById('hdSvg') || document.querySelector('.sheet-bg')) return;
  if(e.target.closest && e.target.closest('input,select,textarea')) return;
  const mod = e.metaKey || e.ctrlKey, key = e.key.toLowerCase();
  if(mod && key === 'z'){ e.preventDefault(); hdUndo(e.shiftKey); return; }
  if(mod && key === 'y'){ e.preventDefault(); hdUndo(true); return; }
  if(mod && key === 'd' && HD.sel){ e.preventDefault(); hdDup(); return; }
  if(mod) return;
  if(key === '3'){ hd3Toggle(); return; }
  if(HD.mode3d){
    if(key === 'f') hd3Fit();
    else if(key === 'q') hd3Turn(90);
    else if(key === 'e') hd3Turn(-90);
    else if(key === 'escape') hd3Toggle(false);
    return;
  }
  if(key === 'escape'){ if(HD.tool){ hdTool(HD.tool); } else { HD.measure = null; HD.sel = null; hdPaint(); hdInspect(); } return; }
  if(key === 'm'){ hdTool('measure'); return; }
  if(key === 'f'){ hdFit(); hdPaint(); return; }
  if(key === 'v'){ hdRenderToggle(); return; }
  if(!HD.sel) return;
  const o = hdFind(HD.sel); if(!o) return;
  if(key === 'delete' || key === 'backspace'){ e.preventDefault(); hdDel(); return; }
  if(key === 'r' && HD.sel.t !== 'room'){
    hdPush();
    o.rot = ((o.rot || 0) + (HD.sel.t === 'open' ? 180 : e.shiftKey ? 270 : 90)) % 360;   // a door turns its swing, never off the wall
    hdPaint(); hdInspect(); hdSave(); return;
  }
  const step = e.shiftKey ? 10 : 1, mv = {arrowleft: [-step, 0], arrowright: [step, 0], arrowup: [0, -step], arrowdown: [0, step]}[key];
  if(mv){
    e.preventDefault();
    if(!e.repeat) hdPush();                                     // holding a key is one undo step, not hundreds
    const P = hdP();
    if(HD.sel.t === 'open'){
      const horiz = (o.rot % 180) === 0, d = horiz ? mv[0] : mv[1];
      if(!d) return;
      hdSnapOpening(o, o.x + (horiz ? d : 0), o.y + (horiz ? 0 : d), 2);
    } else if(HD.sel.t === 'room'){
      const att = hdAttached(P, o);
      o.x = Math.min(Math.max(0, o.x + mv[0]), Math.max(0, P.W - o.w)); o.y = Math.min(Math.max(0, o.y + mv[1]), Math.max(0, P.H - o.h));
      hdCarry(att, o);
    } else { o.x += mv[0]; o.y += mv[1]; }
    hdPaint(); hdInspectLive(); hdSave();
  }
});

/* ---------- add / edit / delete ---------- */
function hdAdd(cat, i){
  const [type, name, w, d] = HD_LIB.find(c => c.cat === cat).items[i], P = hdP(), v = HD.view, [W, H] = hdSize();
  // drop it where you're looking: the 3D camera's target, the 2D view's centre, or the middle of the plan
  let cx = HD.mode3d && HD3 ? hdR(HD3.cam.tx) : v ? hdR(v.x + W / 2 / v.s) : hdR(P.W / 2), cy = HD.mode3d && HD3 ? hdR(HD3.cam.tz) : v ? hdR(v.y + H / 2 / v.s) : hdR(P.H / 2);
  cx = Math.min(P.W - 20, Math.max(20, cx)); cy = Math.min(P.H - 20, Math.max(20, cy));
  // furniture lands in the middle of the room you're looking at, not on whichever wall crosses the screen centre
  const inRoom = P.rooms.find(r => cx >= r.x && cx <= r.x + r.w && cy >= r.y && cy <= r.y + r.h);
  if(inRoom && !type.startsWith('room-') && !type.startsWith('open-')){ cx = hdR(inRoom.x + inRoom.w/2); cy = hdR(inRoom.y + inRoom.h/2); }
  hdPush();
  let sel;
  if(type.startsWith('room-')){
    const kind = type.slice(5), rw = Math.min(w, P.W), rh = Math.min(d, P.H);
    const n = P.rooms.filter(r => r.kind === kind).length;
    const r = {id: hdUid(), kind, name: n ? `${name} ${n + 1}` : name, x: hdR(Math.min(P.W - rw, Math.max(0, cx - rw/2))), y: hdR(Math.min(P.H - rh, Math.max(0, cy - rh/2))), w: rw, h: rh};
    P.rooms.push(r); sel = {t: 'room', id: r.id};
  } else if(type.startsWith('open-')){
    const op = {id: hdUid(), kind: type.slice(5), x: cx, y: cy, len: w, rot: 0, flip: false, th: HD_WALL};
    hdSnapOpening(op, cx, cy, 1e6);   // drop it onto the nearest wall
    P.opens.push(op); sel = {t: 'open', id: op.id};
  } else {
    const it = {id: hdUid(), type, name, x: cx, y: cy, w, d, rot: 0};
    P.items.push(it); sel = {t: 'item', id: it.id};
  }
  HD.sel = sel; HD.tool = null; HD.measure = null; hdBarState();
  hdPaint(); hdInspect(); hdSave();
  if(window.innerWidth < 900) document.getElementById('hdSvg')?.scrollIntoView({block: 'center', behavior: 'smooth'});
}
function hdDup(){
  const o = hdFind(HD.sel); if(!o) return;
  hdPush();
  const c = {...JSON.parse(JSON.stringify(o)), id: hdUid()}, P = hdP();
  if(HD.sel.t === 'room'){ c.x = Math.min(c.x + 30, Math.max(0, P.W - c.w)); c.y = Math.min(c.y + 30, Math.max(0, P.H - c.h)); P.rooms.push(c); }
  else if(HD.sel.t === 'item'){ c.x += 20; c.y += 20; P.items.push(c); }
  else {   // next to the original on the same wall, or on the other side of it if there's no room
    const s = hdOnWall(P, o), horiz = o.rot % 180 === 0, at = horiz ? o.x : o.y;
    const fwd = at + o.len + 20, back = at - o.len - 20, ok = v => !s || (v - o.len/2 >= s.a && v + o.len/2 <= s.b);
    const v = ok(fwd) ? fwd : ok(back) ? back : fwd;
    hdSnapOpening(c, horiz ? v : o.x, horiz ? o.y : v, o.len);
    P.opens.push(c);
  }
  HD.sel = {t: HD.sel.t, id: c.id};
  hdPaint(); hdInspect(); hdSave();
}
function hdDel(){
  if(!HD.sel) return;
  hdPush();
  const P = hdP(), id = HD.sel.id;
  P.rooms = P.rooms.filter(o => o.id !== id); P.items = P.items.filter(o => o.id !== id); P.opens = P.opens.filter(o => o.id !== id);

/* inspector edits: one undo step per committed field */
function hdSet(field, raw){
  const P = hdP(), o = HD.sel ? hdFind(HD.sel) : null;
  if(HD.sel && !o){ HD.sel = null; hdInspect(); return; }
  if(field === 'name'){
    const n = (raw || '').trim(); if(!n){ hdInspect(); return; }
    if(!HD.sel){   // plan name: not part of the drawing, so no undo step
      HD.cur.name = n; const opt = document.querySelector(`#hdPlanSel option[value="${HD.cur.id}"]`); if(opt) opt.textContent = n;
      hdPaint(); hdSave(); return;
    }
    hdPush(); o.name = n; hdPaint(); hdInspect(); hdSave(); return;
  }
  if(field === 'kind'){
    hdPush();
    if(HD.sel.t === 'room'){ const was = (HD_KINDS[o.kind] || HD_KINDS.living).label; o.kind = raw; if(o.name.startsWith(was)) o.name = HD_KINDS[raw].label; }
    else o.kind = raw;
    hdPaint(); hdInspect(); hdSave(); return;
  }
  const n = hdNum(raw);
  if(n === null){ hdInspect(); return; }
  if(!HD.sel){   // outline in metres; doors/windows on the right and bottom walls move with them
    if(n < 2 || n > 60){ toast('Size must be between 2 and 60 m'); hdInspect(); return; }
    const v = hdR(n * 100), old = P[field];
    if(v === old){ hdInspect(); return; }
    hdPush();
    P[field] = v;
    P.opens.forEach(op => {
      const horiz = op.rot % 180 === 0;
      if(field === 'W' && !horiz && Math.abs(op.x - old) < 1) op.x = v;
      if(field === 'H' && horiz && Math.abs(op.y - old) < 1) op.y = v;
      if(field === 'W' && horiz && (Math.abs(op.y) < 1 || Math.abs(op.y - P.H) < 1)) op.x = Math.min(Math.max(op.x, op.len/2), v - op.len/2);
      if(field === 'H' && !horiz && (Math.abs(op.x) < 1 || Math.abs(op.x - P.W) < 1)) op.y = Math.min(Math.max(op.y, op.len/2), v - op.len/2);
    });
    hdPaint(); hdInspect(); hdSave();
    const out = P.rooms.filter(r => r.x + r.w > P.W + .5 || r.y + r.h > P.H + .5).length;
    if(out) toast(`${out} room${out > 1 ? 's' : ''} now ${out > 1 ? 'reach' : 'reaches'} past the outline — shown in red`);
    return;
  }
  hdPush();
  if(field === 'rot') o.rot = ((Math.round(n) % 360) + 360) % 360;
  else if(HD.sel.t === 'room'){
    const att = hdAttached(P, o);
    if(field === 'w') o.w = Math.min(Math.max(60, Math.round(n)), P.W);
    else if(field === 'h') o.h = Math.min(Math.max(60, Math.round(n)), P.H);
    else o[field] = Math.round(n);
    o.x = Math.min(Math.max(0, o.x), P.W - o.w); o.y = Math.min(Math.max(0, o.y), P.H - o.h);
    hdCarry(att, o);
  } else if(HD.sel.t === 'open'){
    if(field === 'len'){
      const s = hdOnWall(P, o);
      o.len = Math.min(Math.max(40, Math.round(n)), s ? s.b - s.a : 1e9);
      if(s) hdSnapOpening(o, o.x, o.y, 2);
    }
  } else if(field === 'w' || field === 'd') o[field] = Math.min(Math.max(10, Math.round(n)), 2000);
  else o[field] = Math.round(n);
  hdPaint(); hdInspect(); hdSave();
}
function hdOpenFlip(what){

/* ---------- export: the whole board (plan, axes, legend), fitted, as a PNG ---------- */
function hdExport(){
  const svg = document.getElementById('hdSvg'); if(!svg) return;
  const keepV = HD.view, keepS = HD.sel, keepM = HD.measure, P = hdP();
  HD.sel = null; HD.measure = null; HD.textScale = 1.7;
  // 2000 px wide by default; tall plans are scaled down so the canvas stays inside browser limits (iOS: ~16.7 MP)
  let W = 2000, b = hdBounds(P), bw = b.x2 - b.x1, bh = b.y2 - b.y1, pd = hdPads(W), s = (W - pd.l - pd.r) / bw;
  if(hdCrowded(P, s)){ pd = hdPads(W, true); s = (W - pd.l - pd.r) / bw; }
  let H = Math.round(bh * s + pd.t + pd.b);
  if(H > 6000 || W * H > 14e6){
    s = Math.min((6000 - pd.t - pd.b) / bh, (14e6 / W - pd.t - pd.b) / bh);
    W = Math.max(900, Math.round(bw * s + pd.l + pd.r)); pd = hdPads(W, hdCrowded(P, s)); s = Math.min(s, (W - pd.l - pd.r) / bw);
    H = Math.round(bh * s + pd.t + pd.b);
  }
  svg.style.width = W + 'px'; svg.style.height = H + 'px';
  HD.view = {s, x: b.x1 - pd.l / s, y: b.y1 - pd.t / s};
  hdPaint();
  hdApplyTex(true);
  const xml = new XMLSerializer().serializeToString(svg).replace('<svg', `<svg width="${W}" height="${H}"`);
  hdApplyTex();
  svg.style.width = ''; svg.style.height = '';
  HD.textScale = 1; HD.view = keepV; HD.sel = keepS; HD.measure = keepM; hdPaint();
  const img = new Image();
  img.onload = () => {

/* ---------- walls: outer outline + merged room edges, split around openings ---------- */
function hd3WallLines(P){
  const L = [{h: 1, c: 0, a: 0, b: P.W, th: HD_OUTER, side: 'n'}, {h: 1, c: P.H, a: 0, b: P.W, th: HD_OUTER, side: 's'},
             {h: 0, c: 0, a: 0, b: P.H, th: HD_OUTER, side: 'w'}, {h: 0, c: P.W, a: 0, b: P.H, th: HD_OUTER, side: 'e'}];
  const groups = {};
  P.rooms.forEach(r => [[1, r.y, r.x, r.x + r.w], [1, r.y + r.h, r.x, r.x + r.w], [0, r.x, r.y, r.y + r.h], [0, r.x + r.w, r.y, r.y + r.h]].forEach(([h, c, a, b]) => {
    if(h ? (Math.abs(c) < 1 || Math.abs(c - P.H) < 1) : (Math.abs(c) < 1 || Math.abs(c - P.W) < 1)) return;   // already the outer wall
    const k = h + ':' + Math.round(c);
    (groups[k] = groups[k] || {h, c: Math.round(c), iv: []}).iv.push([Math.max(0, a), Math.min(h ? P.W : P.H, b)]);
  }));
  Object.values(groups).forEach(g => {
    g.iv.sort((p, q) => p[0] - q[0]);
    let cur = null;
    g.iv.forEach(([a, b]) => { if(cur && a <= cur[1] + 1) cur[1] = Math.max(cur[1], b); else { if(cur) L.push({h: g.h, c: g.c, a: cur[0], b: cur[1], th: HD_WALL}); cur = [a, b]; } });
    if(cur) L.push({h: g.h, c: g.c, a: cur[0], b: cur[1], th: HD_WALL});
  });
  return L;
}
/* cutaway: any wall standing between the point you're looking at and the camera is cut low, so the
   rooms in front of the target open up and the ones behind keep their walls. Zoom into a room and its

/* ---------- floors: procedural textures ---------- */
function hd3Textures(gl){

    const pw = n / 8;
    for(let i = 0; i < 8; i++){
      let y = -rnd() * n;
      while(y < n){
        const len = n * (.35 + rnd() * .45), tone = 0.93 + rnd() * .12;
        const base = [218 * tone, 189 * tone, 150 * tone];
        x.fillStyle = `rgb(${base.map(Math.round).join(',')})`; x.fillRect(i * pw, y, pw, len);
        for(let g = 0; g < 9; g++){ x.strokeStyle = `rgba(120,85,50,${.04 + rnd() * .06})`; x.lineWidth = .6 + rnd(); x.beginPath(); const gx = i * pw + rnd() * pw; x.moveTo(gx, y); x.bezierCurveTo(gx + (rnd() - .5) * 8, y + len * .3, gx + (rnd() - .5) * 8, y + len * .7, gx + (rnd() - .5) * 6, y + len); x.stroke(); }
        x.fillStyle = 'rgba(90,60,35,.22)'; x.fillRect(i * pw, y, pw, 1);

    for(let i = 0; i < 2; i++) for(let j = 0; j < 2; j++){ const t = 0.95 + rnd() * .08; x.fillStyle = `rgb(${Math.round(216*t)},${Math.round(214*t)},${Math.round(209*t)})`; x.fillRect(i*n/2 + 2, j*n/2 + 2, n/2 - 4, n/2 - 4); }
    const im = x.getImageData(0, 0, n, n); for(let i = 0; i < im.data.length; i += 4){ const v = (rnd() - .5) * 8; im.data[i] += v; im.data[i+1] += v; im.data[i+2] += v; } x.putImageData(im, 0, 0);
  });

    for(let i = 0; i < 8; i++){ const t = .9 + rnd() * .15; x.fillStyle = `rgb(${Math.round(150*t)},${Math.round(128*t)},${Math.round(104*t)})`; x.fillRect(0, i * n/8, n, n/8); x.fillStyle = 'rgba(40,30,20,.45)'; x.fillRect(0, i * n/8, n, 2); }

/* ---------- the whole scene ---------- */
function hd3Scene(P){
  const solid = hd3Mesh(), glass = hd3Mesh(), fl = {wood: hd3Mesh(), tile: hd3Mesh(), deck: hd3Mesh()}, K = HD3C, S = HD3.tex.size;
  const o = HD_OUTER/2, I = {x: 0, z: 0, rot: 0};

/* ---------- GL plumbing ---------- */
const HD3_VS = `#version 300 es
in vec3 aP; in vec3 aN; in vec3 aC; in vec2 aU;
uniform mat4 uVP; uniform mat4 uL;
out vec3 vN; out vec3 vC; out vec2 vU; out vec4 vL;
void main(){ vN = aN; vC = aC; vU = aU; vL = uL * vec4(aP, 1.0); gl_Position = uVP * vec4(aP, 1.0); }`;
const HD3_FS = `#version 300 es
precision highp float; precision highp sampler2DShadow;
in vec3 vN; in vec3 vC; in vec2 vU; in vec4 vL;
uniform sampler2DShadow uS; uniform sampler2D uT; uniform float uTex; uniform vec3 uSun; uniform float uA; uniform float uTx;
out vec4 o;
float sh(float nl){

const HD3_SVS = `#version 300 es
in vec3 aP; uniform mat4 uL; void main(){ gl_Position = uL * vec4(aP, 1.0); }`;
const HD3_SFS = `#version 300 es
precision mediump float; void main(){}`;

/* ---------- camera ---------- */
function hd3View(){
  const c = HD3.cam, cv = HD3.canvas, a = cv.clientWidth / Math.max(1, cv.clientHeight);
  const y = c.yaw * Math.PI / 180, p = c.pitch * Math.PI / 180, D = 6000;
  const eye = [c.tx + D * Math.cos(p) * Math.sin(y), c.ty + D * Math.sin(p), c.tz + D * Math.cos(p) * Math.cos(y)];
  const V = hd3M.look(eye, [c.tx, c.ty, c.tz], [0, 1, 0]);
  return hd3M.mul(hd3M.ortho(-c.zoom * a, c.zoom * a, -c.zoom, c.zoom, 1, 14000), V);
}
function hd3Fit(){
  const P = hdP(); if(!P || !HD3) return;
  const c = HD3.cam, b = hdBounds(P);
  c.tx = (b.x1 + b.x2) / 2; c.tz = (b.y1 + b.y2) / 2; c.ty = 60; c.zoom = 1;
  const V = hd3View(), cv = HD3.canvas, a = cv.clientWidth / Math.max(1, cv.clientHeight);
  let mx = 0, my = 0;
  for(const X of [b.x1, b.x2]) for(const Z of [b.y1, b.y2]) for(const Y of [-18, HD3_H]){ const q = hd3M.xf(V, [X, Y, Z]); mx = Math.max(mx, Math.abs(q[0])); my = Math.max(my, Math.abs(q[1])); }
  c.zoom = Math.max(my, mx / a) * 1.06;

/* ---------- build + draw ---------- */
function hd3Key(P){ return JSON.stringify([P.W, P.H, P.rooms, P.items, P.opens, hd3CutKey(P)]); }
function hd3Sync(force){
  if(!HD3 || !HD || !HD.mode3d) return;
  const P = hdP(); if(!P) return;
  const key = hd3Key(P);
  if(key !== HD3.key || force){
    HD3.key = key;
    const sc = hd3Scene(P), gl = HD3.gl, M = HD3.R.meshes;
    M.solid = hd3Upload(gl, sc.solid, M.solid); M.glass = hd3Upload(gl, sc.glass, M.glass);
    for(const k of ['wood', 'tile', 'deck']) M[k] = hd3Upload(gl, sc.fl[k], M[k]);
    HD3.shadowDirty = true;
  }

}
function hd3Draw(){
  if(!HD3 || HD3.raf) return;

}
function hd3Frame(){

  const W = Math.round(cv.clientWidth * dpr), H = Math.round(cv.clientHeight * dpr);

/* ---------- interaction: orbit, pan, zoom ---------- */
function hd3Bind(cv){
  const ptrs = new Map(); let g = null;
  const start = () => {
    const pts = [...ptrs.values()], c = HD3.cam;
    g = pts.length >= 2 ? {two: true, d: Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y), m: {x: (pts[0].x + pts[1].x)/2, y: (pts[0].y + pts[1].y)/2}, cam: {...c}}
                        : {two: false, x: pts[0].x, y: pts[0].y, pan: pts[0].pan, cam: {...c}};
  };
  cv.addEventListener('pointerdown', e => {
    try{ cv.setPointerCapture(e.pointerId); }catch(ex){}
    ptrs.set(e.pointerId, {x: e.clientX, y: e.clientY, pan: e.button === 2 || e.shiftKey || e.button === 1});
    start();
  });
  cv.addEventListener('pointermove', e => {
    if(!ptrs.has(e.pointerId) || !g) return;
    ptrs.get(e.pointerId).x = e.clientX; ptrs.get(e.pointerId).y = e.clientY;
    const c = HD3.cam, pts = [...ptrs.values()], px = 2 * c.zoom / Math.max(1, cv.clientHeight);
    if(g.two && pts.length >= 2){
      const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y), m = {x: (pts[0].x + pts[1].x)/2, y: (pts[0].y + pts[1].y)/2};
      c.zoom = Math.min(8000, Math.max(80, g.cam.zoom * g.d / Math.max(1, d)));
      hd3Pan(g.cam, m.x - g.m.x, m.y - g.m.y, 2 * g.cam.zoom / Math.max(1, cv.clientHeight));
    } else if(!g.two){
      const dx = e.clientX - g.x, dy = e.clientY - g.y;
      if(g.pan) hd3Pan(g.cam, dx, dy, px);
      else { c.yaw = g.cam.yaw - dx * .35; c.pitch = Math.min(89, Math.max(12, g.cam.pitch + dy * .25)); }
    }
    hd3Sync();
  });
  const up = e => { ptrs.delete(e.pointerId); if(ptrs.size) start(); else g = null; };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  cv.addEventListener('contextmenu', e => e.preventDefault());
  cv.addEventListener('dblclick', () => hd3Fit());
  cv.addEventListener('wheel', e => {
    e.preventDefault();
    const c = HD3.cam;
    if(!e.ctrlKey && !e.metaKey && Math.abs(e.deltaX) > Math.abs(e.deltaY) * 1.5){ c.yaw -= e.deltaX * .2; }   // sideways two-finger swipe turns the model
    else c.zoom = Math.min(8000, Math.max(80, c.zoom * Math.exp(e.deltaY * (e.ctrlKey ? .01 : .0015))));
    hd3Sync();
  }, {passive: false});
}
/* move the target in the camera's own right/up directions, so the model follows the finger */
function hd3Pan(from, dx, dy, px){
  const c = HD3.cam, y = c.yaw * Math.PI / 180, p = c.pitch * Math.PI / 180;
  const right = [Math.cos(y), 0, -Math.sin(y)], upv = [-Math.sin(p) * Math.sin(y), Math.cos(p), -Math.sin(p) * Math.cos(y)];
  c.tx = from.tx - (right[0] * dx - upv[0] * dy) * px; c.ty = from.ty - (right[1] * dx - upv[1] * dy) * px; c.tz = from.tz - (right[2] * dx - upv[2] * dy) * px;
}
function hd3Turn(deg){
  if(!HD3) return;
  const c = HD3.cam, from = c.yaw, to = from + deg, t0 = performance.now();
  const step = t => { const k = Math.min(1, (t - t0) / 350), e = k < .5 ? 2*k*k : 1 - (-2*k + 2) ** 2 / 2; c.yaw = from + (to - from) * e; hd3Sync(); if(k < 1) requestAnimationFrame(step); };
