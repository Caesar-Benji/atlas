name: deals

on:
  schedule:
    - cron: "0 5 * * *"          # 07:00 Israel (05:00 UTC; 06:00 UTC in winter would be 08:00 IL — fine either way)
  workflow_dispatch:
    inputs:
      shops:
        description: "space-separated shops (default: all six)"
        default: "redback outline benda terminalx nike mous"
      dry:
        description: "dry run — gather only, send nothing"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shops: ${{ steps.m.outputs.shops }}
    steps:
      - id: m
        run: |
          S="${{ github.event.inputs.shops || 'redback outline benda terminalx nike mous' }}"
          echo "shops=$(echo $S | jq -Rc 'split(" ") | map(select(length>0))')" >> "$GITHUB_OUTPUT"

  gather:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shop: ${{ fromJson(needs.plan.outputs.shops) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: gather ${{ matrix.shop }}
        working-directory: scraper
        env:
          DEALS_TOKEN: ${{ secrets.DEALS_TOKEN }}
        run: node run.js ${{ matrix.shop }} ${{ github.event.inputs.dry == 'true' && '--dry' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deals-${{ matrix.shop }}
          path: scraper/out/
          retention-days: 7
          if-no-files-found: ignore
